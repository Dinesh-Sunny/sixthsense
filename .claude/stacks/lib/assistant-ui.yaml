      signature: useLocalRuntime, ChatModelAdapter
      ref: /docs/runtimes/custom/local-runtime.md
    - id: protocol-runtimes
      name: 'Protocol runtimes'
      summary: 'Runtimes for other agent protocols: A2A, AG-UI, Google ADK, Eve, OpenCode, Claude Managed Agents'
      lenses:
      - composability
      ref: /docs/runtimes/pick-a-runtime.md
- title: 'API reference - adapters, providers, external store'
  sections:
  - id: api-adapters
    title: 'Adapter interfaces'
    level: intermediate
    requires: [layers]
    ref: /docs/api-reference/adapters.md
    entries:
    - id: api-chat-model-adapter
      name: 'ChatModelAdapter'
      summary: 'LocalRuntime model adapter: run(options) returns a Promise or AsyncGenerator of ChatModelRunResult'
      lenses: [composability, typing-dx]
      signature: 'ChatModelAdapter.run(options: ChatModelRunOptions): Promise<ChatModelRunResult> | AsyncGenerator<ChatModelRunResult, void>'
      params:
      - {name: messages, type: 'readonly ThreadMessage[]', default: null, desc: History to send (ChatModelRunOptions).}
      - {name: abortSignal, type: AbortSignal, default: null, desc: Aborted when the run is cancelled.}
      - {name: runConfig, type: 'RunConfig {custom?}', default: null, desc: Per-run config set via composer.setRunConfig.}
      - {name: context, type: ModelContext, default: null, desc: 'Merged system, tools, callSettings, config (apiKey, baseUrl, modelName, reasoningEffort).'}
      returns: 'ChatModelRunResult {content?, status?, metadata? (steps, timing, custom, unstable_state/annotations/data)}'
      notes:
      - 'yield cumulative content per update; CreateStartRunConfig and CreateResumeRunConfig carry parentId, sourceId, runConfig'
      ref: /docs/api-reference/adapters/model.md
    - id: api-attachment-adapter
      name: 'AttachmentAdapter and built-ins'
      summary: 'Upload lifecycle accept/add/remove/send; ships SimpleImage, SimpleText, Composite and CloudFile adapters'
      lenses: [composability, security]
      signature: 'AttachmentAdapter {accept: string; add({file}); remove(att); send(att, {signal?})}'
      returns: 'add yields PendingAttachment (Promise or AsyncGenerator for progress); send returns CompleteAttachment'
      notes:
      - 'CompositeAttachmentAdapter([...]) merges adapters by accept; CloudFileAttachmentAdapter needs an AssistantCloud'
      ref: /docs/api-reference/adapters/attachments.md
    - id: api-feedback-adapter
      name: 'FeedbackAdapter'
      summary: 'Single submit(feedback) callback invoked by feedback action buttons or runtime actions'
      lenses: [observability]
      signature: 'FeedbackAdapter.submit(feedback: FeedbackAdapterFeedback): void'
      ref: /docs/api-reference/adapters/feedback.md
    - id: api-history-adapter
      name: 'ThreadHistoryAdapter'
      summary: 'Per-thread message persistence: load, append, optional update/delete/resume/withFormat/unstable_copy'
      lenses: [reliability, composability]
      signature: 'ThreadHistoryAdapter {load(): Promise<ExportedMessageRepository & {state?, unstable_resume?}>; append(item); update?(item); delete?(items); resume?(options); withFormat?(fmt)}'
      notes:
      - update rewrites an appended message in place (tool approval pauses, late tool results); delete of a missing entry must succeed
      - withFormat is required with useAISDKRuntime/useChatRuntime; GenericThreadHistoryAdapter/MessageFormatAdapter (format, encode, decode, getId) back it
      ref: /docs/api-reference/adapters/persistence.md
    - id: api-remote-thread-list-adapter
      name: 'RemoteThreadListAdapter'
      summary: 'Backend thread-list contract: list, rename, archive, unarchive, delete, initialize, generateTitle, fetch'
      lenses: [reliability, composability]
      signature: 'useRemoteThreadListRuntime({adapter, runtimeHook}); RemoteThreadListAdapter {list(params?); rename; updateCustom?; archive; unarchive; delete; initialize(threadId); generateTitle(remoteId, messages): Promise<AssistantStream>; fetch(threadId); unstable_Provider?; unstable_useAdapters?}'
      notes:
      - 'generateTitle: when it persists the title itself the returned stream must not complete before that write lands; concurrent generations are ordered by stream completion'
      - unstable_Provider wraps each active thread to inject per-thread history/attachments adapters; InMemoryThreadListAdapter is a no-op stub
      ref: /docs/api-reference/adapters/persistence.md
    - id: api-runtime-adapters
      name: 'RuntimeAdapters and RuntimeAdapterProvider'
      summary: 'Bundle {modelContext?, history?, attachments?, feedback?} provided to a subtree through RuntimeAdapterProvider'
      lenses: [composability]
      signature: '<RuntimeAdapterProvider adapters={RuntimeAdapters}>'
      ref: /docs/api-reference/adapters/runtime.md
    - id: api-suggestion-adapter
      name: 'SuggestionAdapter'
      summary: 'generate(options) returns ThreadSuggestion[] (Promise or AsyncGenerator); createSuggestionAdapter wraps it'
      lenses: [ux-a11y]
      signature: 'createSuggestionAdapter(options): SuggestionAdapter; SuggestionAdapter.generate(options)'
      ref: /docs/api-reference/adapters/suggestions.md
  - id: api-context-providers
    title: 'Context providers'
    level: intermediate
    requires: [layers]
    ref: /docs/api-reference/context-providers.md
    entries:
    - id: api-runtime-provider
      name: 'AssistantRuntimeProvider'
      summary: 'Root provider exposing an AssistantRuntime (threads, thread, registerModelContextProvider) to all primitives and hooks'
      lenses: [composability]
      import: '@assistant-ui/react'
      signature: '<AssistantRuntimeProvider runtime={AssistantRuntime} aui?={AssistantClient}>'
      params:
      - {name: runtime, type: AssistantRuntime, default: null, desc: 'From useLocalRuntime, useExternalStoreRuntime, useAssistantTransportRuntime or a framework runtime.'}
      - {name: aui, type: AssistantClient, default: null, desc: Parent client whose scopes the new client inherits (nested providers).}
      notes:
      - 'thread runtime exposes append, startRun, resumeRun, cancelRun, loadEarlier, reset, export/import, getModelContext; threads exposes switchToThread, switchToNewThread, reload, reloadMainThread, loadMore'
      - 'composer runtime: setText, setRunConfig, addAttachment (File or CreateAttachment descriptor), send, cancel, setQuote, moveQueueItem, startDictation'
      ref: /docs/api-reference/context-providers/assistant-runtime-provider.md
    - id: api-scoped-providers
      name: 'Scoped providers'
      summary: 'Lower-level providers for custom renderers: MessageProvider, ReadonlyThreadProvider, TextMessagePartProvider and *ByIndexProvider'
      lenses: [composability, testing]
      signature: 'MessageProvider{message,index,isLast?,branchNumber?,branchCount?}; ReadonlyThreadProvider{messages}; TextMessagePartProvider{text,isRunning?}; ThreadListItemRuntimeProvider{runtime}; MessageByIndexProvider{index}; PartByIndexProvider{index}'
      notes:
      - 'useful to render stored messages outside a live thread and in unit tests'
      ref: /docs/api-reference/context-providers/scoped-providers.md
  - id: api-external-store
    title: 'External store runtime API'
    level: advanced
    requires: [layers]
    ref: /docs/api-reference/external-store.md
    entries:
    - id: api-external-store-adapter
      name: 'ExternalStoreAdapter'
      summary: 'Options for useExternalStoreRuntime(store): host-owned messages plus onNew/onEdit/onReload/onCancel/onResume callbacks'
      lenses: [composability, typing-dx]
      signature: 'useExternalStoreRuntime<T>(store: ExternalStoreAdapter<T>)'
      params:
      - {name: messages, type: 'readonly T[]', default: null, desc: 'Host messages; converted with convertMessage, or use messageRepository.'}
      - {name: onNew, type: '(m: AppendMessage) => Promise<void>', default: null, desc: Required send handler.}
      - {name: isRunning, type: boolean, default: null, desc: Flows to thread.isRunning.}
      - {name: isDisabled, type: boolean, default: null, desc: Disables the whole thread incl. composer input.}
      - {name: isSendDisabled, type: boolean, default: null, desc: Keeps input usable but makes send() a no-op.}
      - {name: hasEarlier, type: boolean, default: null, desc: Pairs with onLoadEarlier to page older messages in.}
      - {name: onRefetchThread, type: '() => Promise<void>', default: null, desc: In-place refetch that drives threads.reloadMainThread().}
      - {name: onAddToolResult, type: function, default: null, desc: Receives frontend tool results.}
      - {name: onRespondToToolApproval, type: function, default: null, desc: Receives approval decisions; absent means a capability error.}
      - {name: queue, type: ExternalThreadQueueAdapter, default: null, desc: 'Opt in to message queue/steer lanes (createMessageQueue).'}
      - {name: unstable_enableToolInvocations, type: boolean, default: 'false', desc: Opt in to the client-side tool invocation pipeline.}
      notes:
      - 'stable message ids keep rendered rows and scroll position when pages are prepended; react-langchain builds on this'
      ref: /docs/api-reference/external-store/runtime.md
    - id: api-external-thread
      name: 'ExternalThread and queue adapter'
      summary: 'ExternalThreadProps shape (messages, isRunning, branches, queue, adapters) and ExternalThreadQueueAdapter lanes'
      lenses: [composability]
      signature: 'ExternalThreadQueueAdapter {items, steerItems, enqueue, steer, move, edit, remove}'
      notes:
      - '''an unanchored move into the steer lane mid-run cancels the live run and dispatches the item'''
      ref: /docs/api-reference/external-store/runtime.md
    - id: api-message-conversion
      name: 'External message conversion'
      summary: 'useExternalMessageConverter, unstable_createMessageConverter, conversion cache and getExternalStoreMessages'
      lenses: [perf, typing-dx]
      signature: 'useExternalMessageConverter({callback, messages, isRunning, joinStrategy?, metadata?}); getExternalStoreMessages<T>(input): T[]; unstable_createExternalMessageConversionCache()'
      notes:
      - keep callback and metadata referentially stable; the cache returns the same ThreadMessage for an unchanged source message
      - bindExternalStoreMessage (experimental) attaches the original message to a ThreadMessage or part
      ref: /docs/api-reference/external-store/message-conversion.md
- title: 'API reference - model context, hooks, tools, transport, voice'
  sections:
  - id: api-model-context
    title: 'Model context API'
    level: intermediate
    requires: [layers]
    ref: /docs/api-reference/model-context.md
    entries:
    - id: api-use-assistant-instructions
      name: 'useAssistantInstructions and useAssistantContext'
      summary: 'Register system instructions or arbitrary context from a mounted component; removed on unmount'
      lenses: [composability]
      import: '@assistant-ui/react'
      signature: 'useAssistantInstructions(config: string | AssistantInstructionsConfig); useAssistantContext(config: AssistantContextConfig)'
      ref: /docs/api-reference/model-context/context.md
    - id: api-make-assistant-visible
      name: 'makeAssistantVisible'
      summary: 'HOC exposing a component DOM to the model, with optional clickable/editable tools'
      lenses: [composability]
      signature: 'makeAssistantVisible<T>(Component: T, config?: {clickable?: boolean; editable?: boolean}): T'
      ref: /docs/api-reference/model-context/context.md
    - id: api-model-context-registry
      name: 'ModelContextRegistry'
      summary: 'Imperative registry: addTool, addInstruction, addProvider each return a handle; getModelContext/subscribe feed a runtime'
      lenses: [composability, testing]
      signature: 'new ModelContextRegistry(); addTool(tool): handle; addInstruction(cfg): handle; addProvider(p): handle; getModelContext(): ModelContext; subscribe(cb): Unsubscribe'
      notes:
      - 'mergeModelContexts(Set<ModelContextProvider>) folds providers into one ModelContext; ModelContextProvider = {getModelContext, subscribe?}'
      ref: /docs/api-reference/model-context/registry.md
    - id: api-use-inline-render
      name: 'useInlineRender'
      summary: 'Wrap a tool-UI FC so an inline renderer keeps the latest closure without re-registering'
      lenses: [perf]
      signature: 'useInlineRender(toolUI: FC<ToolCallMessagePart & {status}>)'
      ref: /docs/api-reference/model-context/context.md
  - id: api-hooks
    title: 'Hook reference'
    level: intermediate
    requires: [layers]
    ref: /docs/api-reference/hooks.md
    entries:
    - id: api-runtime-hooks
      name: 'Runtime creation hooks'
      summary: 'useLocalRuntime(chatModel, options?), useRemoteThreadListRuntime(options), useCloudThreadListRuntime(options)'
      lenses: [composability]
      signature: 'useLocalRuntime(chatModel: ChatModelAdapter, options?: LocalRuntimeOptions); useRemoteThreadListRuntime({adapter, runtimeHook}); useCloudThreadListRuntime(options)'
      ref: /docs/api-reference/hooks/runtimes.md
    - id: api-tool-overrides
      name: 'useAuiToolOverrides'
      summary: 'Experimental: override toolkit entries per scope so a stubTool() declaration gets a React-closing executor'
      lenses: [composability]
      signature: 'useAuiToolOverrides(overrides: AuiToolOverrides)'
      notes: ['intended for dynamic local-state tools whose contract lives in a "use generative" toolkit file with execute: stubTool()']
      ref: /docs/api-reference/hooks/model-context.md
    - id: api-message-timing-quote
      name: 'useMessageTiming and useMessageQuote'
      summary: 'Per-message hooks reading metadata.timing (tokensPerSecond, firstTokenTime, totalChunks) and metadata.custom.quote'
      lenses: [observability, ux-a11y]
      signature: 'useMessageTiming(): MessageTiming | undefined; useMessageQuote(): QuoteInfo | undefined'
      ref: /docs/api-reference/hooks/primitives.md
    - id: api-thread-viewport
      name: 'Thread viewport hooks'
      summary: 'useThreadViewport(selector?), useThreadViewportStore, useThreadViewportAutoScroll(options), useScrollLock(ref, ms)'
      lenses: [ux-a11y, perf]
      signature: 'useThreadViewport<T>(selector?: (s: ThreadViewportState) => T); useScrollLock(ref, animationDuration): () => void'
      notes:
      - 'useScrollLock locks the nearest scrollable ancestor during collapse/expand animations without forcing layout reads'
      - '{optional: true} option returns null outside a viewport instead of throwing'
      ref: /docs/api-reference/hooks/primitives.md
    - id: api-use-runtime-adapters
      name: 'useRuntimeAdapters'
      summary: 'Read the RuntimeAdapters {modelContext, history, attachments, feedback} provided to the current scope; null when absent'
      lenses: [composability]
      signature: 'useRuntimeAdapters(): RuntimeAdapters | null'
      ref: /docs/api-reference/hooks/primitives.md
    - id: api-composer-input-hooks
      name: 'Composer input hooks (unstable)'
      summary: 'Headless composer input bridge, terminal-style ArrowUp history, stall detection, stable thread message ids, combobox aria props'
      lenses: [ux-a11y, typing-dx]
      signature: 'unstable_useComposerInput(); unstable_useComposerInputHistory(); unstable_useMessageStallDetection(options?); unstable_useThreadMessageIds(): readonly string[]; unstable_useTriggerPopoverAriaProps()'
      notes:
      - 'unstable_useThreadMessageIds keeps a stable array identity across streaming content updates; pair with an Unstable per-id message renderer for virtualization'
      - 'unstable_useComposerInputHistory: ArrowUp on an empty draft recalls sent messages; spread onto ComposerPrimitive.Input'
      ref: /docs/api-reference/hooks/primitives.md
    - id: api-composer-triggers
      name: 'Composer trigger hooks (unstable)'
      summary: 'Mention and slash-command adapters for ComposerTriggerPopover plus a live async completion adapter'
      lenses: [ux-a11y, composability]
      signature: 'unstable_useMentionAdapter(options?) => {adapter, directive}; unstable_useSlashCommandAdapter({commands}) => {adapter, action}; unstable_useLiveCompletionAdapter({fetcher}) => {adapter, isLoading}'
      notes:
      - 'spread the result into <ComposerTriggerPopover char="@" {...mention} />; slash execute stays in the hook closure'
      - 'unstable_useTriggerPopoverTriggers returns a live Map of registered triggers'
      ref: /docs/api-reference/hooks/composer-triggers.md
    - id: api-deprecated-part-hooks
      name: 'Deprecated useMessagePart* hooks'
      summary: 'useMessagePartText/Image/File/Source/Reasoning/Data replaced by useAuiState selectors that return null for non-matching parts'
      lenses: [best-practice]
      signature: 'useAuiState((s) => s.part.type === "text" ? s.part : null)'
      deprecated: 'use useAuiState to select and narrow s.part (return null for optional rendering, never throw in the selector)'
      ref: /docs/api-reference/hooks/primitives.md
  - id: api-tools
    title: 'Tools API reference'
    level: intermediate
    requires: [define-toolkit]
    ref: /docs/api-reference/tools.md
    entries:
    - id: api-tool-rendering
      name: 'Tool and data renderers'
      summary: 'Register renderers for tool-call parts and named data parts; deprecated makeAssistantToolUI/useAssistantToolUI still listed'
      lenses: [composability, ux-a11y]
      signature: 'useAssistantDataUI({name, render}); makeAssistantDataUI(...); makeAssistantToolUI({toolName, render, display?}); useAssistantToolUI(tool | null)'
      notes:
      - rendering and status are independent of where a tool executes (frontend, backend, human, MCP)
      - 'getMcpAppFromToolPart(part) returns metadata for a ui:// MCP app resource; McpAppRenderer and McpAppsRemoteHost render it'
      - 'toolApprovalAcceptsText(approval) says whether an approval request wants a free-form answer'
      ref: /docs/api-reference/tools/rendering.md
    - id: api-component-tools
      name: 'Component tools (deprecated)'
      summary: 'makeAssistantTool/useAssistantTool register a tool for the lifetime of a mounted component; superseded by Tools({toolkit})'
      lenses: [best-practice]
      signature: 'useAssistantTool(tool: AssistantToolProps) with {toolName, type, description, parameters, execute, render?, renderText?}'
      deprecated: 'use a toolkit registered via AuiConfig({tools: Tools({toolkit})}); pass a referentially stable tool object'
      ref: /docs/api-reference/tools/component-tools.md
    - id: api-interactables
      name: 'Interactables (unstable)'
      summary: 'Model-editable state: unstable_useInteractable, unstable_interactableTool, version history and snapshot helpers'
      lenses: [composability, reliability]
      signature: 'unstable_useInteractable(name, config) => [state,...]; unstable_useInteractableState(id); unstable_useInteractableVersions({id,name}); unstable_interactableTool({description, stateSchema, render})'
      notes:
      - 'interactableTool entries become toolkit keys; render also serves every update_{name} call with streaming previews'
      - 'unstable_getInteractableVersions folds create, user-edit and update versions; unstable_getInteractableSnapshots reads metadata.custom.interactables'
      ref: /docs/api-reference/tools/interactables.md
    - id: api-interactables-legacy
      name: 'Interactables (legacy)'
      summary: 'useAssistantInteractable + useInteractableState with per-instance update tools'
      lenses: [best-practice]
      signature: 'useAssistantInteractable(name, config); useInteractableState(id, fallback)'
      deprecated: 'deprecated 2026-06-14, removal scheduled on/after 2026-09-14: use the unstable interactables API'
      ref: /docs/api-reference/tools/interactables-legacy.md
  - id: api-transport
    title: 'Transport and frame API'
    level: advanced
    requires: [layers]
    ref: /docs/api-reference/transport.md
    entries:
    - id: api-assistant-transport
      name: 'Assistant transport hooks'
      summary: 'useAssistantTransportRuntime plus useAssistantTransportSendCommand/State for the command-based AssistantTransport protocol'
      lenses: [composability]
      signature: 'useAssistantTransportRuntime(options: AssistantTransportOptions<T>); useAssistantTransportSendCommand(): (cmd) => void; useAssistantTransportState(): UserExternalState'
      notes:
      - 'SendCommandsRequestBody carries state?, runId?, system?, tools?, callSettings?, config?, threadId?, parentId?, commands[]'
      - 'state is absent on a resume with resumeStateApi; the server replays from its retained snapshot'
      ref: /docs/api-reference/transport/assistant-transport.md
    - id: api-assistant-frame
      name: 'Assistant frame bridge'
      summary: 'Share model context (system + tools) with an iframe: AssistantFrameHost in the parent, AssistantFrameProvider inside'
      lenses: [security, composability]
      signature: 'useAssistantFrameHost({iframeRef, targetOrigin}); AssistantFrameProvider.addModelContextProvider(provider, targetOrigin?)'
      notes: ['always pass an explicit trusted targetOrigin; FRAME_MESSAGE_CHANNEL is "assistant-ui-frame"']
      ref: /docs/api-reference/transport/frame.md
  - id: api-voice
    title: 'Voice and dictation API'
    level: advanced
    requires: [layers]
    ref: /docs/api-reference/voice.md
    entries:
    - id: api-voice-session
      name: 'Realtime voice sessions'
      summary: 'createVoiceSession(options, setup) builds a RealtimeVoiceAdapter session; useVoiceState/useVoiceControls/useVoiceVolume read it'
      lenses: [composability]
      signature: 'createVoiceSession({abortSignal}, setup(helpers) => VoiceSessionControls); useVoiceControls(): {connect, disconnect, mute, unmute}'
      notes: ['helpers: setStatus, end, emitTranscript, emitMode, emitVolume, isDisposed; sendText? routes typed text into the session']
      ref: /docs/api-reference/voice/session.md
    - id: api-speech-dictation
      name: 'Speech and dictation adapters'
      summary: 'WebSpeechSynthesisAdapter and WebSpeechDictationAdapter(language, continuous, interimResults) implement the speak and listen contracts'
      lenses: [ux-a11y]
      signature: 'SpeechSynthesisAdapter.speak(text); DictationAdapter.listen(); WebSpeechDictationAdapter.isSupported()'
      ref: /docs/api-reference/voice/speech-dictation.md
- title: 'API reference - generative UI, utilities, integrations'
  sections:
  - id: api-generative-ui
    title: 'JSON generative UI API'
    level: advanced
    requires: [layers]
    ref: /docs/api-reference/generative-ui.md
    entries:
    - id: api-json-generative-ui
      name: 'JSONGenerativeUI'
      summary: 'Builds the present (frontend, resolves at once) and promptUser (human-in-the-loop) tools from a component library'
      lenses: [composability, security]
      signature: 'new JSONGenerativeUI({library, actions?}); .present({display?: "standalone"}); .promptUser()'
      params:
      - {name: library, type: GenerativeUILibrary, default: null, desc: 'Allowlist of renderable components keyed by $type; author with defineGenerativeComponents.'}
      - {name: actions, type: ActionRegistry, default: null, desc: 'Handlers for model-emitted $action payloads.'}
      notes: ['display "standalone" renders outside the chain-of-thought trace']
      ref: /docs/api-reference/generative-ui/json-generative-ui.md
    - id: api-generative-components
      name: 'Component library'
      summary: 'defineGenerativeComponents({Name: {description, properties: zod, streamProperties?, render}}) and defaultGenerativeUILibrary'
      lenses: [security, typing-dx]
      signature: 'defineGenerativeComponents(lib): GenerativeUILibrary; GenerativeUIComponent {description, properties: ZodType, streamProperties?, render(props)}'
      notes:
      - 'the library is the security boundary: any $type not present is rejected'
      - 'with streamProperties render sees Partial<P> while $status is "streaming"; a node must keep its type across renders'
      - defineGenerativeComponents has no runtime implementation; a "use generative" compiler unwraps it
      ref: /docs/api-reference/generative-ui/components.md
    - id: api-generative-actions
      name: 'Action registry'
      summary: 'createActionRegistry({type: handler}) resolves model-emitted $action payloads; unknown types degrade to a dev warning'
      lenses: [security, reliability]
      signature: 'createActionRegistry(handlers: Record<string, ActionHandler>): ActionRegistry; ActionHandler(ctx: ActionDispatchContext) => unknown | Promise<unknown>'
      notes: ['for a prompt_user call with no result yet, a non-undefined handler return value becomes the tool result']
      ref: /docs/api-reference/generative-ui/actions.md
    - id: api-generative-spec
      name: 'GenerativeUISpec and message part'
      summary: 'Serializable node tree {root} carried by a generative-ui message part and rendered with MessagePrimitive.GenerativeUI'
      lenses: [typing-dx]
      signature: '<MessagePrimitive.GenerativeUI components={...} />; GenerativeUIMessagePart {type: "generative-ui", spec, id?, parentId?}'
      ref: /docs/api-reference/generative-ui/spec.md
    - id: api-generative-rendering
      name: 'Rendering helpers'
      summary: 'renderGenerativeUI(node, library, context?), buildPresentParameters, generativeUIToJSX, GenerativeUIRenderError'
      lenses: [security, testing]
      signature: 'renderGenerativeUI(node, library, context?); buildPresentParameters(library); generativeUIToJSX(node, {escape?, pretty?})'
      notes:
      - 'wire nodes are flat {$type, $key?, ...props}; present parameters are a flat object schema because tool schemas reject top-level unions'
      - 'generativeUIToJSX({escape: true}) output is safe to paste back into JSX'
      ref: /docs/api-reference/generative-ui/rendering.md
    - id: api-generative-slack
      name: 'Slack Block Kit conversion'
      summary: 'toSlackBlocks(node, {surface}), fromSlackBlocks and decodeBlockAction turn button payloads back into $action'
      lenses: [composability]
      signature: 'toSlackBlocks(node, {surface?: "message" | "modal"}): {blocks, warnings}; decodeBlockAction(action, stateValues?)'
      notes:
      - 'warnings carry code clamped, dropped or fallback; the Slack shape is lossy so fromSlackBlocks cannot recover Badge vs Caption'
      ref: /docs/api-reference/generative-ui/slack.md
    - id: api-generative-teams
      name: 'Microsoft Teams conversion'
      summary: 'toAdaptiveCard, toTeamsAttachments (Carousel becomes one attachment per Card) and decodeSubmitData for Action.Submit'
      lenses: [composability]
      signature: 'toAdaptiveCard(node): {card, warnings}; toTeamsAttachments(node); decodeSubmitData(value)'
      ref: /docs/api-reference/generative-ui/teams.md
    - id: api-generative-a2ui
      name: 'A2UI conversion'
      summary: 'applyA2uiOperations(state, ops) folds A2UI v0.9 surface operations; convertSurfaceToUISpec turns a surface into a generative UI spec'
      lenses: [composability]
      signature: 'applyA2uiOperations(state: A2uiState, operations: unknown): {state, warnings}; convertSurfaceToUISpec(surface, {keepUnknownComponents?})'
      ref: /docs/api-reference/generative-ui/a2ui.md
    - id: api-generative-tokens
      name: 'Vocabulary tokens'
      summary: 'Shared token arrays (TEXT_SIZES, COLORS, BUTTON_STYLES, ALERT_TONES, ALIGNS, JUSTIFIES, WEIGHTS, ICON_NAMES) for the default vocabulary'
      lenses: [typing-dx]
      ref: /docs/api-reference/generative-ui/tokens.md
  - id: api-utilities
    title: 'Miscellaneous utilities'
    level: intermediate
    requires: [layers]
    ref: /docs/api-reference/utilities.md
    entries:
    - id: api-aui-config
      name: 'AuiConfig'
      summary: 'Builds the plain-data config for the provider config prop, mapping scopes (thread, threads, tools, suggestions...) to client elements'
      lenses: [composability]
      signature: 'AuiConfig({threads?, tools?, suggestions?, thread?, message?, ...})'
      notes: ['configs are plain data, safe to hoist or recreate per render; Derived({source, query}) derives a scope from another']
      ref: /docs/api-reference/utilities/miscellaneous.md
    - id: api-message-queue
      name: 'createMessageQueue'
      summary: 'Message queue controller from a driver; backs the queue adapter that lets the composer stay usable mid-run'
      lenses: [reliability, ux-a11y]
      signature: 'createMessageQueue(driver: MessageQueueDriver): MessageQueueController'
      ref: /docs/api-reference/utilities/miscellaneous.md
    - id: api-thread-rows
      name: 'createThreadRowsSelector'
      summary: 'useAuiState selector flattening a thread into stable rows (groupBy part type) for virtualized lists'
      lenses: [perf]
      signature: 'createThreadRowsSelector({groupBy?: groupPartByType({reasoning: [...]})}) => (state) => readonly ThreadRow[]'
      notes: ['returns the same array for the same thread state']
      ref: /docs/api-reference/utilities/miscellaneous.md
    - id: api-message-not-sent
      name: 'MessageNotSentError'
      summary: 'Thrown from onNew when a send never reached the backend so the composer restores the draft; isMessageNotSentError guards it'
      lenses: [reliability]
      signature: 'throw new MessageNotSentError(message?); isMessageNotSentError(e)'
      ref: /docs/api-reference/utilities/miscellaneous.md
    - id: api-webmcp
      name: 'WebMCP provider'
      summary: 'Publishes frontend tools from the model context to a WebMCP-capable browser so the user''s own browser agent can call them'
      lenses: [security, composability]
      signature: 'unstable_useWebMcpProvider({filter?}) => {status}; unstable_defaultWebMcpFilter(name, tool)'
      notes: ['status is "unsupported" when the page has no document.modelContext; the default filter keeps enabled frontend tools with a client execute']
      ref: /docs/api-reference/utilities/miscellaneous.md
    - id: api-misc-helpers
      name: 'Smaller helpers'
      summary: 'useSmooth, createSimpleTitleAdapter, fromThreadMessageLike, generateId, DevToolsHooks, directive formatter, in-memory lists'
      lenses: [reuse]
      signature: 'useSmooth(text, running); createSimpleTitleAdapter(); fromThreadMessageLike(msg, id, status); generateId()'
      notes: ['defaultDirectiveFormatter writes :type[label]{name=id}; RemoteThreadList is the AuiConfig threads entry backed by a RemoteThreadListAdapter']
      ref: /docs/api-reference/utilities/miscellaneous.md
  - id: api-integrations
    title: 'Integration package APIs'
    level: intermediate
    requires: [layers]
    ref: /docs/api-reference/integrations.md
    entries:
    - id: api-ai-sdk-package
      name: '@assistant-ui/ai-sdk exports'
      summary: 'useChatRuntime, useAISDKRuntime, AssistantChatTransport, frontendTools, injectQuoteContext, token usage and resumable-stream helpers'
      lenses: [composability]
      signature: 'useChatRuntime({transport: new AssistantChatTransport({api})}); frontendTools(tools): ToolSet; injectQuoteContext(messages); useAISDKChat(); useAISDKError(); useThreadTokenUsage()'
      notes:
      - 'AISDKChat/AISDKThreads are AuiConfig entries hosting the same orchestration as useChatRuntime'
      - 'createResumableSessionStorage + RESUMABLE_STREAM_ID_HEADER ("x-resumable-stream-id") wire resumable streams; generativeTools builds a server ToolSet from a generative toolkit'
      ref: /docs/api-reference/integrations/ai-sdk.md
    - id: api-data-stream-package
      name: '@assistant-ui/react-data-stream exports'
      summary: 'useDataStreamRuntime, useCloudRuntime and toLanguageModelMessages for custom streaming backends'
      lenses: [composability]
      signature: 'useDataStreamRuntime(options); toLanguageModelMessages(messages)'
      ref: /docs/api-reference/integrations/react-data-stream.md
    - id: api-eve-package
      name: '@assistant-ui/eve exports'
      summary: 'useEveAgentRuntime plus useEveSession/Events/Error/Reset and convertEveMessage(s) for Eve agents'
      lenses: [composability]
      signature: 'useEveAgentRuntime(...); toEveInputResponse(response, inputRequest?); getEveMessageContent(message)'
      ref: /docs/api-reference/integrations/eve.md
    - id: api-assistant-cloud-package
      name: 'assistant-cloud client'
      summary: 'AssistantCloud(config) client with threads, messages, runs, events, scores, files; CloudAPIError carries status and code'
      lenses: [observability, security]
      signature: 'new AssistantCloud({baseUrl, anonymous: true} | {baseUrl, authToken} | api key server-side)'
      notes:
      - 'client events are batched and flushed after two seconds of quiet'
      - 'CloudRunReporter, CloudEngagementReporter, CloudMessagePersistence, createRunReport are the building blocks for custom integrations'
      ref: /docs/api-reference/integrations/assistant-cloud.md
    - id: api-cloud-ai-sdk-format
      name: 'assistant-cloud/ai-sdk'
      summary: 'AI SDK v6 message format adapter and extractAISDKRunTelemetry, typed against UIMessage without loading the ai runtime'
      lenses: [observability, typing-dx]
      signature: 'aiSDKV6FormatAdapter; extractAISDKRunTelemetry(messages)'
      ref: /docs/api-reference/integrations/assistant-cloud-ai-sdk.md
    - id: api-cloud-telemetry
      name: 'assistant-cloud/telemetry'
      summary: 'OTLP exporter and span processor sending GenAI spans to Assistant Cloud; assistantCloudTraceMetadata hands the trace id to the browser'
      lenses: [observability]
      signature: 'createAssistantCloudSpanProcessor(); createAssistantCloudTraceExporter(); assistantCloudTraceMetadata(): {traceId?}'
      notes: ['telemetry entry needs optional peers @opentelemetry/api, sdk-trace-base, exporter-trace-otlp-http']
      ref: /docs/api-reference/integrations/assistant-cloud-telemetry.md
- title: 'API reference - runtime state objects'
  sections:
  - id: api-runtime-state
    title: 'Runtime and state shapes behind useAui and useAuiState'
    level: intermediate
    requires: [layers]
    ref: /docs/api-reference/runtimes.md
    entries:
    - id: api-assistant-runtime
      name: 'AssistantRuntime'
      summary: 'Top-level runtime from useAui(): threads, thread (= threads.main) and registerModelContextProvider'
      lenses: [composability]
      signature: 'AssistantRuntime {threads: ThreadListRuntime; thread: ThreadRuntime; registerModelContextProvider(p): Unsubscribe}'
      ref: /docs/api-reference/runtimes/assistant-runtime.md
    - id: api-thread-runtime
      name: 'ThreadRuntime and ThreadRuntimeState'
      summary: 'Thread actions (append, startRun, cancelRun, reset, export/import) and state (isRunning, isLoading, hasEarlier, messages)'
      lenses: [reliability, typing-dx]
      signature: 'useAui().thread.{append,cancelRun,startRun,resumeRun,loadEarlier,reset,export,import}; useAuiState(s => s.thread.{isRunning,isLoading,isDisabled,hasEarlier,isLoadingEarlier,capabilities,messages,suggestions,extras})'
      notes:
      - 'isRunning means an active stream connection; isLoading means history hydration; extras is runtime-defined custom state'
      - 'threadId and metadata on ThreadRuntimeState are deprecated: use the threadListItem scope'
      ref: /docs/api-reference/runtimes/thread-runtime.md
    - id: api-composer-runtime
      name: 'ComposerRuntime and state'
      summary: 'Composer actions (setText, send, cancel, addAttachment, setRunConfig, setQuote, queue moves) and state (canSend, canCancel, queue)'
      lenses: [ux-a11y, typing-dx]
      signature: 'useAui().composer.{setText,send,cancel,addAttachment,clearAttachments,setRunConfig,setQuote,moveQueueItem,removeQueueItem}; useAuiState(s => s.composer.{canSend,canCancel,isEmpty,text,attachments,queue,submission,inTransit})'
      notes:
      - 'canCancel is true only when the runtime supports cancel and a run is in flight'
      - 'steerQueueItem deprecated, removal after 2026-11-05: use moveQueueItem(id, {lane: "steer", insertAfter: null})'
      - 'addAttachment takes a File (goes through AttachmentAdapter) or a CreateAttachment descriptor for external sources'
      ref: /docs/api-reference/runtimes/composer-runtime.md
    - id: api-message-runtime
      name: 'MessageRuntime and state'
      summary: 'Message actions (reload, delete, switchToBranch, submitFeedback) and state (status, metadata, index, isLast, branchCount)'
      lenses: [typing-dx]
      signature: 'useAui().message.{reload(config?),delete,switchToBranch({position|branchId}),submitFeedback({type,comment?}),getMessagePartByToolCallId(id)}'
      ref: /docs/api-reference/runtimes/message-runtime.md
    - id: api-message-part-runtime
      name: 'MessagePartRuntime and part state'
      summary: 'Tool-part actions addToolResult, resumeToolCall, respondToToolApproval; EnrichedPartState adds toolUI and dataRendererUI'
      lenses: [reliability]
      signature: 'useAui().part.{addToolResult(result|ToolResponse), resumeToolCall(payload), respondToToolApproval(response)}'
      notes: ['the children render function is also invoked once with a synthetic empty running text part when the message has no parts yet']
      ref: /docs/api-reference/runtimes/message-part-runtime.md
    - id: api-thread-list-runtime
      name: 'ThreadListRuntime and state'
      summary: 'switchToThread, switchToNewThread, reload, reloadMainThread, loadMore; state mainThreadId, threadIds, isLoading, loadError, hasMore'
      lenses: [reliability]
      signature: 'useAui().threads.{switchToThread(id,{unarchive?}),switchToNewThread,reload,reloadMainThread,loadMore,unstable_subscribeThreadEvents}'
      notes: ['loadError holds the last failed list load and clears when a later load starts']
      ref: /docs/api-reference/runtimes/thread-list-runtime.md
    - id: api-thread-list-item-runtime
      name: 'ThreadListItemRuntime and state'
      summary: 'initialize, generateTitle, switchTo, rename, updateCustom, archive, delete, detach; state status, title, remoteId, isRunning'
      lenses: [reliability]
      signature: 'useAui().threadListItem.{initialize,generateTitle,switchTo,rename,updateCustom,archive,unarchive,delete,detach}'
      notes: ['isRunning stays true for a run that continues after the user switches threads']
      ref: /docs/api-reference/runtimes/thread-list-item-runtime.md
    - id: api-attachment-runtime
      name: 'AttachmentRuntime and state'
      summary: 'Attachment remove(); state id, type, name, contentType, file, content, status, source (thread-composer or message)'
      lenses: [typing-dx]
      signature: 'useAui().attachment.remove(); useAuiState(s => s.attachment)'
      ref: /docs/api-reference/runtimes/attachment-runtime.md
    - id: api-queue-state
      name: 'QueueItemState'
      summary: 'Queued composer message {id, parts, prompt}; prompt is deprecated for text parts'
      lenses: [typing-dx]
      signature: 'QueueItemState {id: string; parts: readonly (FileMessagePart | TextMessagePart)[]}'
      deprecated: 'prompt removal after 2026-11-05: derive from the text parts'
      ref: /docs/api-reference/runtimes/queue-state.md
- title: 'Primitives reference'
  sections:
  - id: primitives-ref
    title: 'Primitive parts and props'
    level: basic
    requires: [primitive-pattern]
    ref: /docs/api-reference/primitives.md
    entries:
    - id: prim-composition
      name: 'asChild composition'
      summary: 'Every part forwards props, merges classes and chains handlers; asChild or render swaps the element while keeping behavior'
      lenses: [composability, ux-a11y]
      signature: '<ActionBarPrimitive.Copy asChild><MyButton /></ActionBarPrimitive.Copy>'
      ref: /docs/api-reference/primitives/composition.md
    - id: prim-action-bar
      name: 'ActionBarPrimitive'
      summary: 'Copy, Reload, Edit, Speak, StopSpeaking, Feedback buttons that self-disable by runtime capability; Root handles auto-hide'
      lenses: [ux-a11y]
      signature: '<ActionBarPrimitive.Root hideWhenRunning autohide="never|not-last|always" autohideFloat="never|single-branch|always">'
      options:
      - {name: autohide, type: '"always" | "not-last" | "never"', default: '"never"', desc: Hide the bar until the message is hovered.}
      - {name: autohideFloat, type: '"always" | "single-branch" | "never"', default: '"never"', desc: 'Sets data-floating while an auto-hidden bar shows.'}
      - {name: hideWhenRunning, type: boolean, default: 'false', desc: Hide while the thread runs.}
      - {name: copiedDuration, type: number, default: null, desc: 'Copy button: ms the data-copied attribute stays set (docs default 3 s).'}
      notes:
      - 'Copy disables with no text or a running assistant message; Reload disables when running or the runtime lacks reload; feedback buttons set data-submitted and aria-pressed'
      - 'ActionBarMorePrimitive (Root, Trigger, Content, Item, Separator) is a Radix dropdown for secondary actions'
      ref: /docs/api-reference/primitives/action-bar.md
    - id: prim-assistant-modal
      name: 'AssistantModalPrimitive'
      summary: 'Radix-Popover floating chat: Root, Trigger, Anchor, Content; opens on run start by default'
      lenses: [ux-a11y]
      signature: '<AssistantModalPrimitive.Root unstable_openOnRunStart><Anchor><Trigger/></Anchor><Content/></Root>'
      notes:
      - 'Content positions against Anchor, not Trigger; its dismiss prop is spelled dissmissOnInteractOutside (sic) and defaults to false'
      ref: /docs/api-reference/primitives/assistant-modal.md
    - id: prim-attachment
      name: 'AttachmentPrimitive'
      summary: 'Root, unstable_Thumb, Name, Remove for composer (removable) and message (read-only) attachments; iterate with children render fn'
      lenses: [ux-a11y]
      signature: '<ComposerPrimitive.Attachments>{({attachment}) => <AttachmentPrimitive.Root>...</AttachmentPrimitive.Root>}</ComposerPrimitive.Attachments>'
      notes: ['the components prop is deprecated: use the children render function']
      ref: /docs/api-reference/primitives/attachment.md
    - id: prim-branch-picker
      name: 'BranchPickerPrimitive'
      summary: 'Root (hideWhenSingleBranch), Previous, Next, Number, Count; buttons auto-disable at boundaries and while running'
      lenses: [ux-a11y]
      signature: '<BranchPickerPrimitive.Root hideWhenSingleBranch>'
      ref: /docs/api-reference/primitives/branch-picker.md
    - id: prim-chain-of-thought
      name: 'ChainOfThoughtPrimitive (legacy) and GroupedParts'
      summary: 'Accordion Root/AccordionTrigger/Parts is legacy; new code groups reasoning and tool parts with MessagePrimitive.GroupedParts'
      lenses: [best-practice, ux-a11y]
      signature: '<ChainOfThoughtPrimitive.Root><AccordionTrigger/><Parts>{({part}) => ...}</Parts></Root>'
      deprecated: 'Parts components prop and the components.ChainOfThought path: use GroupedParts with a children render function'
      ref: /docs/api-reference/primitives/chain-of-thought.md
    - id: prim-composer
      name: 'ComposerPrimitive parts'
      summary: 'Root (form), Input (textarea), Send, Cancel, AddAttachment, AttachmentDropzone, Dictate, Quote, Queue, TriggerPopover'
      lenses: [ux-a11y, typing-dx]
      signature: '<ComposerPrimitive.Input submitMode="enter|ctrlEnter|none" cancelOnEscape addAttachmentOnPaste />'
      options:
      - {name: submitMode, type: '"enter" | "ctrlEnter" | "none"', default: '"enter"', desc: 'Enter key behavior; replaces the deprecated submitOnEnter.'}
      - {name: cancelOnEscape, type: boolean, default: 'true', desc: Escape sends a cancel action.}
      - {name: addAttachmentOnPaste, type: boolean, default: 'true', desc: Pasted files become attachments.}
      - {name: unstable_focusOnRunStart, type: boolean, default: 'true', desc: 'Refocus input when a run starts; siblings unstable_focusOnScrollToBottom and unstable_focusOnThreadSwitched.'}
      - {name: unstable_insertNewlineOnTouchEnter, type: boolean, default: 'false', desc: 'Plain Enter inserts a newline on touch-primary devices (only with submitMode "enter").'}
      - {name: compact, type: boolean, default: 'false', desc: 'Root: compact mode while the input holds at most one line.'}
      notes:
      - 'same primitives compose new messages inside a Thread and edit a message inside a Message'
      - 'TriggerPopoverRoot groups TriggerPopover declarations keyed by char; Categories, CategoryItem, Items, Item, Back render the menu'
      ref: /docs/api-reference/primitives/composer.md
    - id: prim-message
      name: 'MessagePrimitive parts'
      summary: 'Root, Parts (children render fn), PartByIndex, Attachments, Quote, Error, GroupedParts, GenerativeUI and If conditions'
      lenses: [composability, typing-dx]
      signature: '<MessagePrimitive.Parts>{({part}) => ...}</MessagePrimitive.Parts>; <MessagePrimitive.If assistant hasBranches last ...>'
      options:
      - {name: unstable_showEmptyOnNonTextEnd, type: boolean, default: 'true', desc: 'Parts: show the Empty component when the last part is not text.'}
      - {name: groupBy, type: '(part, context) => readonly TKey[] | null', default: null, desc: 'GroupedParts: maps each part to a group-key path.'}
      - {name: indicator, type: IndicatorMode, default: '"no-text"', desc: 'GroupedParts: when to emit the synthetic trailing indicator part.'}
      notes:
      - 'part kinds: modality (text, image, file), provider channel (reasoning, source, tool-call, generative-ui), extensibility (data, routed by name); file carries audio/video/pdf via mimeType'
      - 'children API gives part.toolUI (registered tool UI or null) and part.dataRendererUI; returning null still lets registered UIs render, return <></> to suppress them'
      - 'groupPartByType({reasoning: ["group-reasoning"]}) builds a groupBy; "tool-call:<name>" beats "tool-call"; "standalone-tool-call" renders outside the trace'
      ref: /docs/api-reference/primitives/message.md
    - id: prim-message-part
      name: 'MessagePartPrimitive'
      summary: 'Text (smooth streaming, data-status), Image, InProgress and Messages for part-level rendering'
      lenses: [perf, ux-a11y]
      signature: '<MessagePartPrimitive.Text smooth component="span" />'
      options:
      - {name: smooth, type: 'boolean | SmoothOptions', default: 'true', desc: Smooth text streaming animation.}
      ref: /docs/api-reference/primitives/message-part.md
    - id: prim-queue-item
      name: 'QueueItemPrimitive'
      summary: 'Text, Steer and Remove parts for pending queued messages rendered via ComposerPrimitive.Queue'
      lenses: [ux-a11y]
      signature: '<ComposerPrimitive.Queue>{({queueItem}) => <QueueItemPrimitive.Text/>}</ComposerPrimitive.Queue>'
      ref: /docs/api-reference/primitives/queue-item.md
    - id: prim-selection-toolbar
      name: 'SelectionToolbarPrimitive'
      summary: 'Floating Root plus Quote button that copies selected message text into the composer as a quote'
      lenses: [ux-a11y]
      signature: '<SelectionToolbarPrimitive.Root><SelectionToolbarPrimitive.Quote/></SelectionToolbarPrimitive.Root>'
      notes:
      - 'place inside ThreadPrimitive.Root; shown only when the selection sits in one message'
      - 'mark quotable regions with data-aui-quote-selectable; data-aui-quote-selectable="false" excludes a subtree or a whole message'
      ref: /docs/api-reference/primitives/selection-toolbar.md
    - id: prim-suggestion
      name: 'SuggestionPrimitive'
      summary: 'Title, Description and Trigger (send, clearComposer) rendered via ThreadPrimitive.Suggestions or ThreadPrimitive.Suggestion'
      lenses: [ux-a11y]
      signature: '<SuggestionPrimitive.Trigger send clearComposer />'
      options:
      - {name: send, type: boolean, default: 'false', desc: 'true sends at once (queued mid-run on queueing runtimes); false fills the composer.'}
      - {name: clearComposer, type: boolean, default: 'true', desc: 'Replace vs append composer text; with send decides whether the draft clears.'}
      notes:
      - 'static suggestions flow through the suggestions scope; dynamic ones through thread.suggestions (SuggestionAdapter or ExternalStore suggestions)'
      ref: /docs/api-reference/primitives/suggestion.md
    - id: prim-thread-list-parts
      name: 'ThreadListItemPrimitive and More menu'
      summary: 'Root (data-active, aria-current), Trigger, Title (fallback), Archive, Unarchive, Delete plus a Radix ThreadListItemMore dropdown'
      lenses: [ux-a11y]
      signature: '<ThreadListItemMorePrimitive.Root sharedFocusGroup>'
      notes:
      - 'arrow-key list navigation is layered on native tab stops; sharedFocusGroup folds the More menu into it (Right opens, Left/Escape close)'
      - 'Archive/Unarchive/Delete do not self-disable and throw if the runtime lacks the action: render only supported ones'
      ref: /docs/api-reference/primitives/thread-list-item.md
    - id: prim-action-bar-more
      name: 'ActionBarMorePrimitive'
      summary: 'Radix dropdown (Root, Trigger, Content, Item, Separator) grouping secondary message actions inside ActionBarPrimitive'
      lenses: [ux-a11y]
      signature: '<ActionBarMorePrimitive.Root><Trigger/><Content><Item/></Content></Root>'
      ref: /docs/api-reference/primitives/action-bar-more.md
    - id: prim-error
      name: 'ErrorPrimitive'
      summary: 'Root and Message parts for rendering runtime, thread and message failures'
      lenses: [reliability, ux-a11y]
      signature: '<ErrorPrimitive.Root><ErrorPrimitive.Message/></ErrorPrimitive.Root>'
      ref: /docs/api-reference/primitives/error.md
    - id: prim-thread-list-parts-list
      name: 'ThreadListPrimitive and ThreadListItemMore'
      summary: 'ThreadListPrimitive Root, New (data-active on a fresh thread), Items (archived prop); ThreadListItemMore Radix menu with sharedFocusGroup'
      lenses: [ux-a11y]
      signature: '<ThreadListPrimitive.Items archived>{({threadListItem}) => ...}</ThreadListPrimitive.Items>'
      notes:
      - 'ThreadListItemMorePrimitive Root/Trigger/Content/Item; sharedFocusGroup joins its trigger and open menu to the list focus group'
      ref: /docs/api-reference/primitives/thread-list-item-more.md
    - id: prim-thread-list-nav
      name: 'ThreadListPrimitive navigation and a11y'
      summary: 'Three namespaces (ThreadList, ThreadListItem, ThreadListItemMore); native tab stops plus arrow keys; aria-current on the active row'
      lenses: [ux-a11y]
      signature: '<ThreadListPrimitive.Root><ThreadListPrimitive.New/><ThreadListPrimitive.Items>...'
      ref: /docs/api-reference/primitives/thread-list.md
    - id: api-context-tree
      name: 'Context tree overview'
      summary: 'Which primitives and runtime accessors exist in each scope: assistant, thread, composer, message, part, attachment, threadListItem'
      lenses: [composability]
      signature: 'useAui().{thread,composer,message,part,attachment,threadListItem}; useAuiState(s => s.message.isCopied / isHovering)'
      ref: /docs/api-reference/overview.md
  - id: primitive-guides
    title: 'Primitive guides'
    level: basic
    requires: [primitive-pattern]
    ref: /docs/primitives/thread.md
    entries:
    - id: guide-action-bar
      name: 'ActionBar guide'
      summary: 'Auto-hide (never, not-last, always), floating, automatic disabling and data-copied/data-submitted feedback state'
      lenses: [ux-a11y]
      signature: '<ActionBarPrimitive.Root autohide="not-last" autohideFloat="single-branch">'
      notes:
      - 'an auto-hidden bar is not rendered until the message is hovered; single-branch floats only when the message has no alternatives'
      ref: /docs/primitives/action-bar.md
    - id: guide-assistant-modal
      name: 'AssistantModal guide'
      summary: 'Radix Popover architecture: anchor vs trigger, auto-open on run start, dismiss behavior, data-state animations, custom portal container'
      lenses: [ux-a11y]
      notes: ['shadcn AssistantModal element wraps these primitives with animations']
      ref: /docs/primitives/assistant-modal.md
    - id: guide-attachment
      name: 'Attachment guide'
      summary: 'Two contexts (composer pending removable, message read-only), iterator via children render function, Name renders bare text'
      lenses: [ux-a11y]
      ref: /docs/primitives/attachment.md
    - id: guide-branch-picker
      name: 'BranchPicker guide'
      summary: 'Previous/Next disable at boundaries, Number and Count render raw text, hideWhenSingleBranch; usually sits beside ActionBar in the footer'
      lenses: [ux-a11y]
      ref: /docs/primitives/branch-picker.md
    - id: guide-chain-of-thought
      name: 'ChainOfThought guide'
      summary: 'Recommended GroupedParts path; legacy accordion keeps collapsed state via AuiIf; deprecated components.Reasoning/tools.Fallback/Layout'
      lenses: [best-practice, ux-a11y]
      deprecated: 'components.ChainOfThought path: use MessagePrimitive.GroupedParts'
      ref: /docs/primitives/chain-of-thought.md
    - id: guide-composer
      name: 'Composer guide'
      summary: 'Root form/Input textarea/Send; new-message vs edit mode follows context; trigger popovers for @ mentions and / commands'
      lenses: [ux-a11y]
      notes: ['see the Mentions and Slash Commands guides for trigger popover wiring']
      ref: /docs/primitives/composer.md
    - id: guide-message
      name: 'Message guide'
      summary: 'Parts pipeline via children render fn, part kinds, tool resolution order (deprecated components path), hover state'
      lenses: [composability]
      notes:
      - 'legacy components prop resolves tool calls as tools.Override, registered Tools({toolkit}), tools.by_name, tools.Fallback'
      ref: /docs/primitives/message.md
    - id: guide-selection-toolbar
      name: 'SelectionToolbar guide'
      summary: 'Portal-positioned toolbar; single-message validation via data-message-id; Quote calls composer.setQuote; hides on scroll or collapse'
      lenses: [ux-a11y]
      ref: /docs/primitives/selection-toolbar.md
    - id: guide-suggestion
      name: 'Suggestion guide'
      summary: 'Static suggestions scope vs runtime thread.suggestions; send vs populate; ThreadPrimitive.Suggestion for ad-hoc prompts'
      lenses: [ux-a11y]
      ref: /docs/primitives/suggestion.md
    - id: guide-thread-list
      name: 'ThreadList guide'
      summary: 'Three namespaces, data-active on New and current row, keyboard navigation, archived Items, composing Archive asChild with menu Item'
      lenses: [ux-a11y]
      ref: /docs/primitives/thread-list.md
- title: 'Runtimes - custom, AI SDK, protocols'
  sections:
  - id: runtimes-custom
    title: 'Custom runtime paths'
    level: advanced
    requires: [layers]
    ref: /docs/runtimes/custom/overview.md
    entries:
    - id: rt-custom-paths
      name: 'Four custom runtime paths'
      summary: 'LocalRuntime (ChatModelAdapter.run), ExternalStoreRuntime (own messages), DataStream (wire protocol), AssistantTransport (state snapshots)'
      lenses: [composability]
      signature: 'useLocalRuntime | useExternalStoreRuntime | useDataStreamRuntime | useAssistantTransportRuntime'
      notes:
      - 'use a framework adapter when one fits the backend; ExternalStore if message state already lives in redux/zustand/tanstack-query'
      ref: /docs/runtimes/custom/overview.md
    - id: rt-external-store
      name: 'ExternalStoreRuntime guide'
      summary: 'Capability-based UI: onNew required; setMessages enables branching, onEdit edit, onReload regenerate, onCancel stop, queue queuing'
      lenses: [composability, typing-dx]
      signature: 'useExternalStoreRuntime<T>({messages, convertMessage, onNew, setMessages?, onEdit?, onReload?, onCancel?, onAddToolResult?})'
      notes:
      - 'any of onAddToolResult/onResumeToolCall/onRespondToToolApproval turns on thread.capabilities.answerToolCall for tool fallback answer controls'
      - 'paging earlier messages: stable message ids, merge the page into the latest messages, publish a full repository with its head'
      - 'convertMessage inline or useExternalMessageConverter with a join strategy; getExternalStoreMessages recovers originals'
      ref: /docs/runtimes/custom/external-store.md
    - id: rt-data-stream
      name: 'Data stream runtime'
      summary: 'useDataStreamRuntime({api}) consumes ui-message-stream (AI SDK v5+) or data-stream v1; protocol auto-detected from response headers'
      lenses: [composability]
      signature: 'useDataStreamRuntime({api, protocol?, initialMessages?, onFinish?, onError?, headers?, body?})'
      options:
      - {name: protocol, type: '"ui-message-stream" | "data-stream"', default: null, desc: 'Auto-detected from x-vercel-ai-ui-message-stream or x-vercel-ai-data-stream headers; set only when a proxy hides them.'}
      notes: ['backend side: createAssistantStreamResponse from assistant-stream or toUIMessageStreamResponse()']
      ref: /docs/runtimes/custom/data-stream.md
    - id: rt-assistant-transport
      name: 'AssistantTransport protocol'
      summary: 'Backend streams full agent state snapshots; UI is a stateless view; frontend queues commands (add-message, add-tool-result, custom)'
      lenses: [composability, reliability]
      signature: 'useAssistantTransportRuntime({api, protocol?, converter, ...}); stream ops set and append-text over data-stream or assistant-transport SSE'
      notes:
      - 'command lifecycle queued -> in_transit -> applied; one request in flight, new commands queue until it completes'
      - 'protocol defaults to "data-stream"; "assistant-transport" selects the AssistantTransportEncoder SSE encoding'
      ref: /docs/runtimes/custom/assistant-transport.md
  - id: runtimes-ai-sdk
    title: 'Vercel AI SDK runtime'
    level: intermediate
    requires: [layers]
    ref: /docs/runtimes/ai-sdk/overview.md
    entries:
    - id: rt-ai-sdk-versions
      name: 'AI SDK version matrix'
      summary: 'ai@7 uses @assistant-ui/ai-sdk (current); ai@6/5 pin react-ai-sdk 1.3.40/1.1.21; ai@4 uses react-data-stream'
      lenses: [reliability]
      signature: 'useChatRuntime (recommended, adds cloud threads + AssistantChatTransport) vs useAISDKRuntime (bring your own useChat)'
      ref: /docs/runtimes/ai-sdk/overview.md
    - id: rt-ai-sdk-legacy
      name: 'Legacy AI SDK v4/v5/v6 pages'
      summary: 'Reference for projects not on ai@7; no new features; v6 made convertToModelMessages async'
      lenses: [best-practice]
      deprecated: 'migrate to @assistant-ui/ai-sdk on ai@^7'
      notes: ['v4 path is useDataStreamRuntime plus toDataStreamResponse(); v5/v6 use useChatRuntime from @assistant-ui/react-ai-sdk']
      ref: /docs/runtimes/ai-sdk/v6-legacy.md
    - id: rt-ai-sdk-v5-legacy
      name: 'AI SDK v5 legacy'
      summary: 'Pin @assistant-ui/react-ai-sdk@1.1.21 with ai@^5; convertToModelMessages is synchronous'
      lenses: [best-practice]
      deprecated: 'plan migration to v7'
      ref: /docs/runtimes/ai-sdk/v5-legacy.md
    - id: rt-ai-sdk-v4-legacy
      name: 'AI SDK v4 legacy'
      summary: 'ai@^4 plugs into react-data-stream; toDataStreamResponse() header x-vercel-ai-data-stream: v1 is auto-detected'
      lenses: [best-practice]
      deprecated: 'plan migration to v7'
      ref: /docs/runtimes/ai-sdk/v4-legacy.md
  - id: runtimes-protocols
    title: 'Protocol and agent runtimes'
    level: advanced
    requires: [layers]
    ref: /docs/runtimes/pick-a-runtime.md
    entries:
    - id: rt-a2a
      name: 'A2A runtime'
      summary: 'useA2ARuntime({baseUrl | client}) for A2A v1.0 servers; A2UI operation parts are folded into surfaces and restored from history'
      lenses: [composability]
      signature: 'new A2AClient({baseUrl, basePath?, headers?, tenant?, extensions?, fetchOptions?}); useA2ARuntime({client})'
      notes:
      - 'build the A2AClient once (module scope or useState): the runtime keeps its session per client'
      - 'client methods: sendMessage, streamMessage, getTask, listTasks, cancelTask, subscribeToTask, getAgentCard, push-notification config CRUD'
      ref: /docs/runtimes/a2a/overview.md
    - id: rt-a2a-quickstart
      name: 'A2A quickstart'
      summary: 'useA2ARuntime({baseUrl}) in a provider plus a Thread'
      lenses: [reuse]
      ref: /docs/runtimes/a2a/quickstart.md
    - id: rt-a2a-hooks
      name: 'A2A client and hooks'
      summary: 'A2AClient options and methods, useA2ARuntime options, task states, artifacts, structured errors'
      lenses: [typing-dx]
      ref: /docs/runtimes/a2a/client-and-hooks.md
    - id: rt-ag-ui
      name: 'AG-UI runtime'
      summary: 'useAgUiRuntime({agent: HttpAgent}) maps AG-UI events, thinking/reasoning, STATE_SNAPSHOT/DELTA and subagent runs'
      lenses: [composability]
      signature: 'useAgUiRuntime({agent, showThinking?, autoCancelPendingToolCalls?, resumeTranscript?, onError?, onCancel?, unstable_enableMessageQueue?, adapters?})'
      options:
      - {name: showThinking, type: boolean, default: 'true', desc: Render THINKING_* and REASONING_* events as reasoning.}
      - {name: autoCancelPendingToolCalls, type: boolean, default: 'true', desc: 'Cancel unresolved client tool calls on send, edit or reload.'}
      - {name: resumeTranscript, type: '"full" | "appended"', default: '"full"', desc: What messages carries on a run that also carries resume.}
      - {name: unstable_enableMessageQueue, type: boolean, default: null, desc: Buffer sends mid-run; pending items appear on composer.queue.}
      notes: ['a2ui-surface activity becomes a present tool part; mcp-apps attaches to its tool call; other activities become data parts agui-activity/<type>']
      ref: /docs/runtimes/ag-ui/runtime-options.md
    - id: rt-ag-ui-overview
      name: 'AG-UI overview and quickstart'
      summary: 'Install react-ag-ui and @ag-ui/client; create HttpAgent in useMemo and pass it to useAgUiRuntime'
      lenses: [reuse]
      signature: 'const agent = useMemo(() => new HttpAgent({url}), []); useAgUiRuntime({agent})'
      ref: /docs/runtimes/ag-ui/overview.md
    - id: rt-ag-ui-quickstart
      name: 'AG-UI quickstart'
      summary: 'Minimal provider wiring against an AG-UI endpoint'
      lenses: [reuse]
      ref: /docs/runtimes/ag-ui/quickstart.md
    - id: rt-ag-ui-state
      name: 'AG-UI agent state hooks'
      summary: 'useAgUiState mirrors agent state; useAgUiSetState stages an optimistic update sent as state on the next run'
      lenses: [reliability, composability]
      signature: 'useAgUiState(); useAgUiSetState()'
      notes: ['optimistic and local first: not a live channel into a run already in progress']
      ref: /docs/runtimes/ag-ui/agent-state.md
    - id: rt-claude-managed-agents
      name: 'Claude Managed Agents'
      summary: 'useExternalStoreRuntime over a pure fold of the session event log plus useRemoteThreadListRuntime where thread id = session id'
      lenses: [composability, reliability]
      signature: 'useExternalStoreRuntime({messages, convertMessage: m => m}); RemoteThreadListAdapter over sessions.list/create/update/archive'
      notes: ['replaying stored sessions and tailing live SSE run through the same fold, so both render identical messages']
      ref: /docs/runtimes/claude-managed-agents.md
    - id: rt-eve
      name: 'Eve runtime'
      summary: 'useEveAgentRuntime wraps Eve useEveAgent; withEve() and withAui() in next.config; runConfig.custom becomes Eve clientContext'
      lenses: [composability]
      signature: 'useEveAgentRuntime(); withAui(withEve(nextConfig)); makeAssistantDataUI<EveAuthorizationData>({name: "authorization"})'
      ref: /docs/runtimes/eve/overview.md
    - id: rt-eve-quickstart
      name: 'Eve quickstart'
      summary: 'Template (create-assistant-ui -t eve), Eve CLI (eve registry add; eve add @assistant-ui/eve-chat) or manual setup'
      lenses: [reuse]
      notes: ['the Eve CLI writes registry files without editing CSS: add @import "tw-shimmer" and data-open/data-closed custom variants yourself']
      ref: /docs/runtimes/eve/quickstart.md
    - id: rt-google-adk
      name: 'Google ADK runtime'
      summary: 'useAdkRuntime for ADK JS/Python agents with multi-agent author tracking, HITL confirmations and grounding metadata'
      lenses: [composability]
      signature: 'useAdkRuntime(...); createAdkStream({api, appName?, userId?, headers?}); createAdkSessionAdapter(...)'
      notes: ['expects camelCase JSON from ADK JS and ADK Python']
      ref: /docs/runtimes/google-adk/overview.md
    - id: rt-google-adk-quickstart
      name: 'Google ADK quickstart'
      summary: 'createAdkApiRoute server helper plus client useAdkRuntime setup'
      lenses: [reuse]
      ref: /docs/runtimes/google-adk/quickstart.md
    - id: rt-google-adk-api
      name: 'Google ADK API'
      summary: 'createAdkStream proxy vs direct mode, session adapter backing the thread list, AdkEventAccumulator, message editing'
      lenses: [composability]
      ref: /docs/runtimes/google-adk/api.md
    - id: rt-google-adk-hooks
      name: 'Google ADK hooks'
      summary: 'useAdkToolConfirmations/ConfirmTool, useAdkAuthRequests/SubmitAuth, useAdkSubmitInput, artifacts, escalation, agent and session state'
      lenses: [reliability, security]
      ref: /docs/runtimes/google-adk/hooks.md
    - id: rt-opencode
      name: 'OpenCode runtime'
      summary: 'useOpenCodeRuntime over a local OpenCode server (:4096): sessions as threads, fork/revert, permission and question flows'
      lenses: [composability]
      signature: 'useOpenCodeRuntime(...)'
      notes: ['task tool calls load child sessions eagerly; empty messages on a task part means the child session has not loaded yet']
      ref: /docs/runtimes/opencode/overview.md
    - id: rt-opencode-quickstart
      name: 'OpenCode quickstart'
      summary: 'Minimal useOpenCodeRuntime setup against a local OpenCode server'
      lenses: [reuse]
      ref: /docs/runtimes/opencode/quickstart.md
    - id: rt-opencode-hooks
      name: 'OpenCode hooks'
      summary: 'useOpenCodePermissions {pending, reply}, useOpenCodeQuestions and useOpenCodeRuntimeExtras (replyToQuestion, rejectQuestion)'
      lenses: [security, reliability]
      ref: /docs/runtimes/opencode/hooks.md
  - id: runtimes-langgraph-legacy
    title: 'react-langgraph runtime (sibling of react-langchain)'
    level: intermediate
    requires: [layers]
    ref: /docs/runtimes/langgraph/overview.md
    entries:
    - id: lg-quickstart
      name: 'react-langgraph quickstart'
      summary: 'useLangGraphRuntime with unstable_createLangGraphStream, create and load; same-origin /api proxy in production'
      lenses: [reuse, security]
      signature: 'useLangGraphRuntime({stream, create, load, unstable_allowCancellation})'
      notes:
      - 'production: proxy through your own backend so the API key never reaches the client and allowlist the endpoints needed'
      - 'the template path uses useStreamRuntime from react-langchain; this manual path is the older runtime'
      ref: /docs/runtimes/langgraph/quickstart.md
    - id: lg-agent-state
      name: 'LangGraph agent state hooks'
      summary: 'useLangGraphState mirrors graph values; useLangGraphSetState stages an update merged into the next run input'
      lenses: [reliability]
      signature: 'useLangGraphState(); useLangGraphSetState()'
      notes:
      - 'streamMode must include "values"; unstable_createLangGraphStream defaults do not'
      - 'a custom stream callback must forward config.state into its run input itself'
      ref: /docs/runtimes/langgraph/agent-state.md
    - id: lg-generative-ui
      name: 'LangGraph generative UI'
      summary: 'push_ui_message / typedUi().push() events over the custom stream channel become data parts rendered by makeAssistantDataUI or uiComponents'
      lenses: [composability]
      signature: 'useLangGraphRuntime({uiStateKey}); makeAssistantDataUI({name, render})'
      notes:
      - 'pass message to push_ui_message so the adapter can attach the part to that assistant message (metadata.message_id, falling back to metadata.id)'
      - 'uiStateKey only affects the values stream path; the custom channel carries each event individually'
      ref: /docs/runtimes/langgraph/generative-ui.md
    - id: lg-interrupts
      name: 'LangGraph interrupts and checkpoint editing'
      summary: 'load returns interrupts with messages to restore them on thread switch; getCheckpointId enables edit and regenerate via server forks'
      lenses: [reliability]
      signature: 'useLangGraphRuntime({getCheckpointId, load: () => ({messages, interrupts})})'
      notes: ['the resolved checkpointId reaches stream as config.checkpointId; a custom stream callback must forward it as checkpoint: {checkpoint_id}']
      ref: /docs/runtimes/langgraph/interrupts.md
    - id: lg-streaming
      name: 'LangGraph streaming helpers'
      summary: 'LangGraphMessageAccumulator, convertLangChainMessages, eventHandlers, message metadata hook, message queue, per-run config'
      lenses: [composability]
      signature: 'useLangGraphRuntime({eventHandlers, unstable_enableMessageQueue}); useLangGraphMessageMetadata()'
      notes: ['a message sent mid-run steers by default; runConfig is posted as the SDK run config']
      ref: /docs/runtimes/langgraph/streaming.md
- title: 'Tools - generative UI, MCP, backend wiring'
  sections:
  - id: tools-guides
    title: 'Tool guides beyond the toolkit basics'
    level: intermediate
    requires: [define-toolkit]
    ref: /docs/tools.md
    entries:
    - id: tools-render-chooser
      name: 'Choosing how model output becomes UI'
      summary: 'Tool UI (model calls a known tool), Interactables (two-way state), present tool (composed vocabulary), LangGraph data UI, OpenUI'
      lenses: [best-practice, composability]
      ref: /docs/tools.md
    - id: tools-backend-wiring
      name: 'Backend tool wiring (AI SDK)'
      summary: 'AISDKToolkit({toolkit}).tools() merges server-build tools with uploaded frontend tools; use frontendTools without the generative build'
      lenses: [composability, reliability]
      signature: 'new AISDKToolkit({toolkit}).tools(); frontendTools(tools ?? {}); convertToModelMessages(messages, {tools})'
      notes:
      - 'a server execute wins over an uploaded entry of the same name'
      - 'pass {tools} to convertToModelMessages or toModelOutput is silently ignored for round-tripped results'
      - 'multi-step: useChatRuntime sendAutomaticallyWhen lastAssistantMessageIsCompleteWithToolCalls'
      ref: /docs/tools/backend.md
    - id: tools-dynamic
      name: 'Dynamic tools (stubTool + override)'
      summary: 'Declare the contract with execute: stubTool() in the toolkit; supply the real executor via useAuiToolOverrides in the state-owning component'
      lenses: [composability]
      signature: 'defineToolkit({manage_tasks: {description, parameters, execute: stubTool(), render}}); useAuiToolOverrides({manage_tasks: {execute}})'
      notes: ['an override registers above toolkit defaults and supplies only execute; return a useful payload such as a new id']
      ref: /docs/tools/dynamic-tools.md
    - id: tools-mcp-apps
      name: 'MCP Apps renderer'
      summary: 'McpAppRenderer({host: McpAppsRemoteHost({url})}) renders ui:// MCP widgets in sandboxed iframes over a JSON-RPC bridge'
      lenses: [security, composability]
      signature: 'Tools + McpAppRenderer({host, handlers?: {requestDisplayMode, updateModelContext}}); host route receives {method, params}'
      notes:
      - 'only resourceUri values starting with ui:// render; openLink and sendMessage are auto-wired; handlers must be provided before mount since capabilities are advertised then'
      - 'key the host resource with withKey (from @assistant-ui/tap) when account or workspace identity changes'
      ref: /docs/tools/mcp-apps.md
    - id: tools-user-managed-mcp
      name: 'User-managed MCP'
      summary: 'react-mcp: McpManagerResource({connectors}) with defineConnector presets or user-added servers; OAuth PKCE, bearer or none'
      lenses: [security]
      signature: 'AuiConfig({mcp: McpManagerResource({connectors})}); defineConnector({id, name, url, auth: {type: "oauth"|"none"|bearer}})'
      notes: ['connected tools register as frontend tools automatically']
      ref: /docs/tools/user-managed-mcp.md
    - id: tools-webmcp
      name: 'WebMCP publishing'
      summary: 'unstable_useWebMcpProvider publishes frontend tools with execute to document.modelContext; your filter replaces the default predicate'
      lenses: [security]
      signature: 'unstable_useWebMcpProvider({filter?}) => {status: "unsupported"|"active", registeredToolNames}'
      notes:
      - 'a tool the browser agent can call is callable by anyone driving that browser: publish only what you would expose as an unauthenticated API'
      - 'Chrome origin trial covers 149-156 and ends 2026-11-17; locally use chrome://flags/#enable-webmcp-testing'
      ref: /docs/tools/webmcp.md
    - id: tools-generative-primitive
      name: 'MessagePrimitive.GenerativeUI wiring'
      summary: 'Render a generative-ui message part from a JSON spec against a component allowlist; unknown names throw GenerativeUIRenderError'
      lenses: [security]
      signature: '<MessagePrimitive.GenerativeUI components={{Card, ...}} />'
      notes:
      - 'the stock thread part switch returns null for generative-ui parts: opt in via MessagePrimitive.Parts or a custom switch'
      - 'the allowlist limits which components render, not the props they receive'
      ref: /docs/tools/generative-ui-primitive.md
    - id: tools-a2ui
      name: 'A2UI surfaces'
      summary: 'ACTIVITY_SNAPSHOT a2ui-surface or A2A parts become tool-call parts a2ui:<surfaceId>; Button actions go out via useAgUiSendA2uiAction'
      lenses: [composability]
      signature: 'JSONGenerativeUI({library: defaultGenerativeUILibrary, actions}); useAgUiSendA2uiAction()'
      notes: ['the a2ui: tool-call id prefix is reserved and excluded from history sent back to the agent']
      ref: /docs/tools/a2ui.md
    - id: tools-generative-slack
      name: 'Generative UI to Slack'
      summary: 'toSlackBlocks never throws and returns {blocks, warnings}; subpath @assistant-ui/react-generative-ui/slack is React-free'
      lenses: [composability]
      signature: 'toSlackBlocks(tree, {surface: "modal"})'
      ref: /docs/tools/generative-ui-slack.md
    - id: tools-generative-teams
      name: 'Generative UI to Teams'
      summary: 'toAdaptiveCard stamps schema 1.5 (Teams mobile caps at 1.2); toTeamsAttachments for carousels; subpath is React-free'
      lenses: [composability]
      signature: 'toAdaptiveCard(tree): {card, warnings}'
      ref: /docs/tools/generative-ui-teams.md
    - id: tools-openui
      name: 'OpenUI integration'
      summary: 'Third-party @openuidev/assistant-ui: openuiIntegration bundles toolkit and instructions from one OpenUI component library'
      lenses: [composability]
      signature: 'npm i @openuidev/assistant-ui @openuidev/react-ui @openuidev/react-lang @openuidev/react-headless zustand@^4.5.5'
      notes: ['peers require Zustand 4 and AI SDK 6 or 7; import the layered stylesheet once']
      ref: /docs/tools/openui.md
- title: 'Copilot helpers, Store and Tap'
  sections:
  - id: copilots
    title: 'Model context helpers for components'
    level: intermediate
    requires: [layers]
    ref: /docs/copilots/model-context.md
    entries:
    - id: cop-model-context
      name: 'Model context concepts'
      summary: 'useAssistantInstructions registers a static string; useAssistantContext takes a callback evaluated at each read; tools via toolkits'
      lenses: [composability]
      signature: 'useAssistantInstructions(string | {instruction, disabled?}); useAssistantContext({getContext})'
      ref: /docs/copilots/model-context.md
    - id: cop-instructions
      name: 'useAssistantInstructions'
      summary: 'Registers system instructions, cleans up on unmount, updates when the text changes, no-op when disabled'
      lenses: [composability]
      signature: 'useAssistantInstructions(config: string | AssistantInstructionsConfig)'
      ref: /docs/copilots/use-assistant-instructions.md
    - id: cop-make-visible
      name: 'makeAssistantVisible guide'
      summary: 'HOC sends the outermost readable component HTML as system context; clickable adds a click tool, editable an edit tool for input/textarea'
      lenses: [composability]
      signature: 'makeAssistantVisible(Component, {clickable?, editable?})'
      notes: ['nested readable components contribute only the outermost HTML; refs and props are forwarded']
      ref: /docs/copilots/make-assistant-visible.md
    - id: cop-assistant-frame
      name: 'Assistant Frame guide'
      summary: 'Iframe provides tools and instructions via AssistantFrameProvider + ModelContextRegistry; parent consumes with useAssistantFrameHost'
      lenses: [security, composability]
      signature: 'AssistantFrameProvider.addModelContextProvider(registry); useAssistantFrameHost({iframeRef, targetOrigin})'
      ref: /docs/copilots/assistant-frame.md
    - id: cop-motivation
      name: 'Intelligent components'
      summary: 'Banking example adding intelligence to a component with readable HTML, instructions and tools'
      lenses: [best-practice]
      ref: /docs/copilots/motivation.md
  - id: store
    title: '@assistant-ui/store'
    level: advanced
    requires: [layers]
    ref: /docs/store/quickstart.md
    entries:
    - id: store-why
      name: 'Why Store'
      summary: 'Store provides Tap resource state deep in a tree without prop drilling: AuiProvider creates it, useAuiState selects with re-render on change'
      lenses: [composability]
      ref: /docs/store/why-store.md
    - id: store-quickstart
      name: 'Store quickstart'
      summary: 'Augment ScopeRegistry, define a Tap resource returning ClientOutput<scope>, mount with AuiProvider and read with useAuiState'
      lenses: [typing-dx]
      signature: 'npm i @assistant-ui/store @assistant-ui/tap; declare module "@assistant-ui/store" { interface ScopeRegistry {...} }'
      ref: /docs/store/quickstart.md
    - id: store-scopes
      name: 'Scopes'
      summary: 'Named independent units of state; ScopeRegistry is a type-level module augmentation that other packages can extend'
      lenses: [typing-dx, composability]
      signature: 'AuiConfig({thread: ThreadResource()}); <AuiProvider config={config}>'
      ref: /docs/store/scopes.md
    - id: store-methods
      name: 'Scope methods'
      summary: 'Functions returned by the resource become methods on useAui().<scope>; ClientOutput ties the resource to the registry type'
      lenses: [typing-dx]
      signature: 'const aui = useAui(); aui.counter.increment()'
      ref: /docs/store/methods.md
    - id: store-state
      name: 'Scope state'
      summary: 'getState() returns a memoized object; reference equality drives useAuiState((s) => s.scope.x) re-renders, AuiIf and subscribe'
      lenses: [perf, typing-dx]
      signature: 'useAuiState<T>(selector: (s: AssistantState) => T): T'
      notes: ['build the state object with useMemo so an unchanged state keeps its reference']
      ref: /docs/store/state.md
    - id: store-events
      name: 'Typed events'
      summary: 'Declare scope.event payloads in ScopeRegistry, emit with useAssistantEmit in a resource, listen via useAuiEvent; delivered by microtask'
      lenses: [reliability, typing-dx]
      signature: 'useAssistantEmit(); useAuiEvent("counter.changed", cb)'
      ref: /docs/store/events.md
    - id: store-meta
      name: 'Scope meta'
      summary: 'Accessors expose source ("root" | parent scope | null), query and name; these names are reserved for scope methods'
      lenses: [typing-dx]
      signature: 'aui.thread.source; aui.thread.query; aui.thread.name'
      ref: /docs/store/meta.md
    - id: store-child-scopes
      name: 'Child scopes'
      summary: 'Parent resource manages items with useClientLookup; Derived({source, query}) resolves one child scope by index or key'
      lenses: [composability]
      signature: 'useClientLookup; useClientResource; useClientList; Derived({source: "todoList", query: {index}, get: (aui) => aui.todoList().todo(query)})'
      ref: /docs/store/child-scopes.md
    - id: store-sibling-scopes
      name: 'Sibling scopes'
      summary: 'useAssistantClientRef gives a resource a ref to the whole client once all scopes mount, so siblings can call each other'
      lenses: [composability]
      signature: 'const clientRef = useAssistantClientRef(); clientRef.current.modelContext()'
      ref: /docs/store/sibling-scopes.md
    - id: store-rendering-lists
      name: 'Rendering lists'
      summary: 'Subscribe to list length, useMemo the element array, wrap each item with RenderChildrenWithAccessor so item state re-renders only the item'
      lenses: [perf]
      signature: 'RenderChildrenWithAccessor'
      ref: /docs/store/rendering-lists.md
    - id: store-api
      name: 'Store API surface'
      summary: 'useAui, AuiConfig (branded), useAuiState, useAuiEvent, AuiProvider, AuiIf, Derived, transform-scope helpers and types'
      lenses: [typing-dx]
      signature: '<AuiProvider extends={aui} config={config}>; attachTransformScopes; forwardTransformScopes; getClientId'
      deprecated: 'useAui(scopes) extension overload: hoist useAui() and AuiConfig(scopes), then pass extends={aui}'
      ref: /docs/store/api-reference.md
  - id: tap
    title: '@assistant-ui/tap'
    level: advanced
    requires: [layers]
    ref: /docs/tap.md
    entries:
    - id: tap-overview
      name: 'Tap resources'
      summary: 'State management on React Hooks: wrap a use-prefixed hook with resource(); calling the factory yields an inert ResourceElement'
      lenses: [composability]
      import: '@assistant-ui/tap'
      signature: 'resource(hook): Resource; useResource(element)'
      ref: /docs/tap.md
    - id: tap-motivation
      name: 'Tap motivation'
      summary: 'Resource elements are values forming a typed declarative config tree (AuiConfig({threads, tools})) with a React-like render/mount lifecycle'
      lenses: [composability]
      ref: /docs/tap/motivation.md
    - id: tap-quickstart
      name: 'Tap quickstart'
      summary: 'npm i @assistant-ui/tap; resource(useCounter); useResource(Counter({initialValue}))'
      lenses: [reuse]
      ref: /docs/tap/quickstart.md
    - id: tap-resources
      name: 'Resources'
      summary: 'A resource renders with inputs, keeps hook state, mounts effects and cleans up; its return value is its public API'
      lenses: [composability]
      ref: /docs/tap/resources.md
    - id: tap-composition
      name: 'Resource composition'
      summary: 'useResource and useResources let a parent read child output; pass a ResourceElement as config to swap implementations'
      lenses: [composability, testing]
      ref: /docs/tap/composition.md
    - id: tap-context
      name: 'Tap context'
      summary: 'createContext from React, read with use(), provide with useContextProvider across resource boundaries'
      lenses: [composability]
      signature: 'useContextProvider(Context, value, () => useResource(...))'
      ref: /docs/tap/context.md
    - id: tap-differences
      name: 'Differences from React'
      summary: 'Effects run in call order (not children-first), the whole tree re-renders from the root, useLayoutEffect behaves like useEffect'
      lenses: [best-practice, reliability]
      ref: /docs/tap/differences-from-react.md
    - id: tap-lifecycle
      name: 'Tap lifecycle'
      summary: 'Render (no side effects) then commit (changed effects, previous cleanup first); effect and cleanup order is FIFO in call order'
      lenses: [reliability]
      ref: /docs/tap/lifecycle.md
    - id: tap-trees
      name: 'Trees and re-renders'
      summary: 'useResource/useResources do not form scheduling boundaries; useTapRoot creates a new root with its own scheduler'
      lenses: [perf]
      signature: 'useTapRoot(...); useTapHost(...)'
      ref: /docs/tap/trees-and-rerenders.md
    - id: tap-outside-react
      name: 'Tap outside React'
      summary: 'createTapRoot(cb, {mountOnSubscribe?}) hosts a tree imperatively returning {getValue, subscribe, unmount}; flushTapSync forces delivery'
      lenses: [testing]
      signature: 'createTapRoot(function Root() { return useResource(Counter({initialValue: 0})) })'
      ref: /docs/tap/outside-react.md
    - id: tap-api
      name: 'Tap API surface'
      summary: 'resource, withKey, useResource(s), useTapRoot, useTapHost, createTapRoot, flushTapSync, useContextProvider, Resource types'
      lenses: [typing-dx]
      signature: 'resource<R, A>(hook: (...args: A) => R): Resource<R, A>; withKey(key, element)'
      ref: /docs/tap/api-reference.md
  - id: heat-graph
    title: 'heat-graph'
    level: basic
    requires: []
    ref: /docs/utilities/heat-graph.md
    entries:
    - id: heat-graph-lib
      name: 'heat-graph'
      summary: 'Headless Radix-style activity heatmap with Popper tooltip and custom bucketing; shadcn item @assistant-ui/heat-graph or npm heat-graph'
      lenses: [ux-a11y, reuse]
      signature: 'npx shadcn@latest add @assistant-ui/heat-graph; npm install heat-graph'
      ref: /docs/utilities/heat-graph.md
