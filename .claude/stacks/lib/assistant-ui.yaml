stack: assistant-ui
version: 0.15.23
docs_base: https://www.assistant-ui.com
source: https://www.assistant-ui.com/llms.txt
fetched: 2026-10-05
verified: 2026-10-05
toc:
- index: 'https://www.assistant-ui.com/llms.txt'
  match: '^https://www\.assistant-ui\.com/docs/'
  exclude: '^https://www\.assistant-ui\.com/docs/(react-native|vue|ink)(/|\.md$|$)'
  why: 'Other renderers (React Native, Vue, Ink terminal UI) ship separate packages; this stack is the Next.js React web app on @assistant-ui/react'
groups:
- title: 'AI tooling'
  sections:
  - id: ai-docs-access
    title: 'Docs and agent access'
    level: basic
    requires: []
    ref: /docs/llm.md
    entries:
    - id: aui-mcp-docs
      name: 'Official docs MCP'
      summary: 'Hosted docs MCP: search and read assistant-ui pages and navigation; wire it so agents never code from memory'
      lenses:
      - best-practice
      - reuse
      signature: list_pages, get_navigation, search_docs, read_page
      notes:
      - https://www.assistant-ui.com/mcp, Streamable HTTP; tools list_pages, get_navigation, search_docs, read_page
      ref: /docs/llm.md
    - id: aui-mcp-stdio
      name: 'MCP stdio fallback'
      summary: 'Local stdio build of the docs MCP for clients lacking HTTP MCP support (Zed, Claude Desktop)'
      lenses:
      - reuse
      signature: npx -y @assistant-ui/mcp-docs-server
      notes:
      - only for clients without HTTP MCP (Zed, Claude Desktop)
      ref: /docs/llm.md
    - id: aui-llms-txt
      name: 'llms.txt and per-page markdown'
      summary: 'Docs index plus a markdown copy of every page (append .md); llms-full.txt is the whole site in one file'
      lenses:
      - best-practice
      - cost
      signature: /llms.txt, <page>.md, /llms-full.txt, /sitemap.md
      notes:
      - registry docs source; fetch the narrowest .md, llms-full only for cross-page work
      ref: /llms.txt
    - id: aui-agents-md
      name: 'Agent instructions'
      summary: 'Official agent rules: identify runtime and package version first, retrieve narrowly, follow the discovery routes'
      lenses:
      - best-practice
      notes:
      - identify runtime and package version before changing code
      ref: /AGENTS.md
    - id: aui-skills
      name: 'Official agent skills'
      summary: 'Installable per-area agent skills (setup, tools, runtime, update) published by the assistant-ui org'
      lenses:
      - best-practice
      - reuse
      signature: npx skills add assistant-ui/skills, /.well-known/agent-skills/index.json
      notes:
      - 19 area skills (setup, tools, runtime, update...); not in skills-lock.json
      ref: /docs/llm.md
    - id: aui-design-md
      name: 'Design law skill'
      summary: 'Machine-readable design law (print/sand style) for UIs built on assistant-ui elements'
      lenses:
      - ux-a11y
      signature: /design.md
      ref: /design.md
    - id: aui-cli
      name: 'CLI'
      summary: 'Scaffold, add elements, run codemods and doctor checks; `upgrade` applies version migrations'
      lenses:
      - reuse
      - reliability
      signature: npx assistant-ui@latest {add,update,upgrade,codemod,doctor,info,mcp,agent}
      notes:
      - '`doctor` finds duplicate/outdated pkgs; `update` moves exact pins, review the diff'
      ref: /docs/cli.md
    - id: aui-devtools
      name: 'DevTools'
      summary: 'Dev-only overlay inspecting thread state, model context and runtime events without console.log'
      lenses:
      - observability
      - testing
      signature: '@assistant-ui/react-devtools, DevToolsModal, createDevToolsPlugin'
      notes:
      - dev-only overlay, stripped from production; new dep, scouting gate
      ref: /docs/devtools.md
- title: 'Architecture and runtime choice'
  sections:
  - id: layers
    title: 'Layers and runtime choice'
    level: basic
    requires: []
    ref: /docs/architecture.md
    entries:
    - id: layer-model
      name: 'Layer model'
      summary: 'UI reads the runtime through AssistantRuntimeProvider; runtime talks to the backend; persistence is a separate adapter seam'
      lenses:
      - best-practice
      - composability
      notes:
      - UI reads runtime context, never the backend directly
      ref: /docs/architecture.md
    - id: pick-a-runtime
      name: 'Runtime decision guide'
      summary: 'Choose the runtime by backend: react-langchain for the LangGraph Agent Server via @langchain/react useStream'
      lenses:
      - best-practice
      signature: useStreamRuntime, useLangGraphRuntime, useExternalStoreRuntime
      notes:
      - react-langchain chosen
      ref: /docs/runtimes/pick-a-runtime.md
    - id: runtime-layering
      name: 'Runtime architecture'
      summary: 'LocalRuntime and ExternalStoreRuntime are the two cores; protocol and framework runtimes layer on top of them'
      lenses:
      - composability
      ref: /docs/runtimes/concepts/architecture.md
    - id: adapter-matrix
      name: 'Adapters'
      summary: 'Optional runtime slots (attachments, speech, dictation, feedback, history, suggestion, threadList) with per-runtime support'
      lenses:
      - composability
      notes:
      - 'react-langchain: no suggestion slot, history via thread state'
      ref: /docs/runtimes/concepts/adapters.md
  - id: stability
    title: 'Stability and deprecation policy'
    level: basic
    requires: []
    ref: /docs/runtimes/concepts/stability.md
    entries:
    - id: unstable-prefix
      name: 'unstable_ exports'
      summary: '`unstable_` exports are public but may change in any release; pin versions and wrap the call site in one place'
      lenses:
      - reliability
      - best-practice
      signature: unstable_threadListAdapter, unstable_allowCancellation
      notes:
      - 'may change in any release: pin range, isolate call site'
      ref: /docs/runtimes/concepts/stability.md
    - id: deprecation-tiers
      name: 'Deprecation policy'
      summary: 'Stable APIs get over 3 months deprecation notice; beta APIs (tw-shimmer, context/runtime API) under 1 month'
      lenses:
      - reliability
      ref: /docs/migrations/deprecation-policy.md
- title: 'LangChain runtime (react-langchain)'
  sections:
  - id: langchain-runtime
    title: 'useStreamRuntime and wiring'
    level: intermediate
    requires:
    - layers
    ref: /docs/runtimes/langchain.md
    entries:
    - id: use-stream-runtime
      name: 'useStreamRuntime'
      summary: 'Wraps @langchain/react useStream as an assistant-ui runtime for a LangGraph server; takes every useStream option plus its own'
      lenses:
      - reuse
      - reliability
      signature: useStreamRuntime({assistantId, apiUrl, adapters, ...})
      notes:
      - 'v2 protocol only; SSE default; absolute apiUrl needed: client-only mount'
      ref: /docs/runtimes/langchain.md
      returns: AssistantRuntime for AssistantRuntimeProvider; thread.isLoading tracks history hydration, isRunning an in-flight run
      options:
      - name: 'assistantId'
        type: string
        default: null
        desc: Graph or assistant id on the Agent Server (upstream useStream option).
      - name: 'apiUrl'
        type: string
        default: null
        desc: Agent Server base URL (upstream useStream option); must be absolute for the SDK client.
      - name: 'messagesKey'
        type: string
        default: '"messages"'
        desc: State key holding the messages.
      - name: 'uiStateKey'
        type: string
        default: '"ui"'
        desc: State key holding generative UIMessage entries (data UI).
      - name: 'adapters'
        type: '{attachments?, speech?, dictation?, voice?, feedback?}'
        default: null
        desc: Optional assistant-ui adapters; there is no suggestion or history slot.
      - name: 'autoCancelPendingToolCalls'
        type: boolean
        default: 'true'
        desc: Sending a message while tool calls are pending submits tool messages that cancel them.
      - name: 'unstable_allowCancellation'
        type: boolean
        default: 'true'
        desc: Routes the Cancel button to useStream().stop(); false removes the Cancel button.
      - name: 'unstable_threadListAdapter'
        type: RemoteThreadListAdapter
        default: null
        desc: Replaces the Cloud thread list adapter with your own (thread list backed by your server).
      - name: 'onThreadIdChange'
        type: '(threadId: string | undefined) => void'
        default: null
        desc: Called when the active thread canonical id changes.
      - name: 'cloud'
        type: AssistantCloud
        default: null
        desc: Use Assistant Cloud for the thread list and a copy of settled messages.
      - name: 'create / delete'
        type: () => Promise<{externalId}> / (threadId) => Promise<void>
        default: null
        desc: Backend thread create/delete hooks; delete is called when Cloud owns the list.
    - id: provider-config
      name: 'Provider config'
      summary: 'AssistantRuntimeProvider takes `config` built with AuiConfig({...}) to install the toolkit and other scopes'
      lenses:
      - best-practice
      - composability
      signature: '<AssistantRuntimeProvider runtime={runtime} config={AuiConfig({tools: Tools({toolkit})})}>'
      notes:
      - AuiConfig at module scope
      ref: /docs/api-reference/tools/toolkits.md
    - id: run-error-state
      name: 'Run error'
      summary: 'Run failures surface as an Error in useLangChainError(); cleared on the next submit or thread switch'
      lenses:
      - reliability
      - ux-a11y
      signature: useLangChainError()
      notes:
      - cleared on submit/switch; hydration failure sets it
      ref: /docs/runtimes/langchain.md
      returns: Error | undefined from the stream root store (server message for run errors)
    - id: tool-error-status
      name: 'Tool error status'
      summary: 'A ToolMessage with status "error" maps to isError and an incomplete tool status for the tool renderer'
      lenses:
      - reliability
      - ux-a11y
      signature: status:"error", isError, status.reason
      notes:
      - incomplete includes cancelled; not a failure
      ref: /docs/tools/tool-ui.md
    - id: cancel-stop
      name: 'Stop button'
      summary: 'Cancel button calls useStream().stop(), which cancels the server run; on by default via unstable_allowCancellation'
      lenses:
      - reliability
      - security
      signature: useStream().stop(), unstable_allowCancellation
      notes:
      - 'POST threads/{id}/runs/{runId}/cancel, errors swallowed: proxy must allow'
      ref: /docs/runtimes/langchain.md
    - id: fork-regenerate
      name: 'Regenerate and edit'
      summary: 'Regenerate and edit fork the thread from a checkpoint with submit(null, {forkFrom}) instead of mutating history'
      lenses:
      - reliability
      signature: submit(null,{forkFrom}), ActionBarPrimitive.Reload
      notes:
      - fork/edit POST threads/{id}/history; proxy must allow
      ref: /docs/runtimes/langchain.md
    - id: auto-cancel-pending
      name: 'Auto-cancel pending tools'
      summary: 'When the user types mid tool call, pending calls are cancelled with tool messages so the next run is valid'
      lenses:
      - reliability
      signature: autoCancelPendingToolCalls
      notes:
      - typing mid tool call sends cancelling tool messages
      ref: /docs/runtimes/langchain.md
      options:
      - name: 'autoCancelPendingToolCalls'
        type: boolean
        default: 'true'
        desc: Set false to keep pending tool calls instead of cancelling them on new input.
    - id: run-config-forwarding
      name: 'Per-run config'
      summary: 'Message runConfig.custom (mode, model) is forwarded to submit as config.configurable, also on resumes'
      lenses:
      - composability
      signature: runConfig.custom, config.configurable
      notes:
      - reused for tool-result resumes and interrupt helpers
      ref: /docs/runtimes/langchain.md
    - id: interrupts-hitl
      name: 'Interrupts'
      summary: 'Hooks to read pending LangGraph interrupts and resume them; useLangChainRespond avoids hand-built Commands'
      lenses:
      - reliability
      - ux-a11y
      signature: useLangChainInterruptState, useLangChainRespond, useLangChainRespondAll, useLangChainInterrupts
      notes:
      - prefer respond over raw Command
      ref: /docs/runtimes/langchain.md
      returns: useLangChainInterruptState gives the current interrupt (.value); respond(payload) resumes it; respondAll resumes several in one run
    - id: raw-command-submit
      name: 'Raw submit and command'
      summary: 'Escape hatch to submit raw state updates or Commands when respond helpers do not fit'
      lenses:
      - composability
      signature: useLangChainSubmit(null,{command}), useLangChainSend, useLangChainSendCommand
      ref: /docs/runtimes/langchain.md
    - id: custom-state-keys
      name: 'Custom state keys'
      summary: 'Read any graph state key (todos, plan, files) reactively without rebuilding it from tool-call args'
      lenses:
      - typing-dx
      - reuse
      signature: 'useLangChainState<T>(key: string, defaultValue?: T)'
      notes:
      - reactive todos/plan keys without rebuilding from tool-call args
      ref: /docs/runtimes/langchain.md
      returns: T (or T | undefined without default), updated when the stream emits new state
    - id: stream-handle-hooks
      name: 'Stream handle hooks'
      summary: 'Expose the underlying useStream handle and tool calls for @langchain/react selector hooks (messages, media, metadata)'
      lenses:
      - composability
      signature: useLangChainStream(), useLangChainToolCalls(), useMessageMetadata, useImages
      notes:
      - 'handle is undefined outside provider: guard before selector hooks'
      ref: /docs/runtimes/langchain.md
      returns: 'useLangChainStream: useStream handle or undefined outside the provider; useLangChainToolCalls: root tool calls, default []'
    - id: subagent-discovery
      name: 'Subagent discovery'
      summary: 'Discovery maps of subagents and subgraphs seen on the run; task subagents also fill ToolCallMessagePart.messages'
      lenses:
      - observability
      - ux-a11y
      signature: useLangChainSubagents, useLangChainSubgraphs, ToolCallMessagePart.messages
      notes:
      - task transcripts stream live and nest recursively up to 16 levels; only tool `task` gets them
      ref: /docs/runtimes/langchain.md
      returns: Map keyed by namespace of SubagentDiscoverySnapshot / SubgraphDiscoverySnapshot, to feed useMessages/useToolCalls
    - id: data-ui-generative
      name: 'LangGraph data UI'
      summary: 'Render backend-pushed UI messages (push_ui_message) with makeAssistantDataUI renderers keyed by name'
      lenses:
      - ux-a11y
      - composability
      signature: makeAssistantDataUI({name, render}), uiStateKey, push_ui_message
      notes:
      - live path needs streamMode to include custom
      ref: /docs/runtimes/langchain.md
    - id: message-convert
      name: 'Message conversion'
      summary: 'Converts a LangChain BaseMessage into an assistant-ui message; only needed for custom adapters'
      lenses:
      - reuse
      signature: convertLangChainBaseMessage
      ref: /docs/runtimes/langchain.md
- title: 'Threads and persistence'
  sections:
  - id: thread-list
    title: 'Thread list adapter'
    level: intermediate
    requires:
    - langchain-runtime
    ref: /docs/runtimes/concepts/threads.md
    entries:
    - id: thread-list-adapter
      name: 'Thread adapter'
      summary: 'Backs the thread list with your own database: list/initialize/rename/archive/unarchive/delete/fetch/generateTitle'
      lenses:
      - typing-dx
      - reliability
      signature: 'useStreamRuntime({unstable_threadListAdapter: adapter})'
      notes:
      - 8 required members (tsc-verified)
      ref: /docs/runtimes/concepts/threads.md
      options:
      - name: 'list'
        type: ({after?}) => Promise<{threads, nextCursor?}>
        default: null
        desc: Loads thread metadata pages; return nextCursor to enable loadMore.
      - name: 'initialize'
        type: (localId) => Promise<{remoteId}>
        default: null
        desc: Creates the remote thread record; safe to await many times.
      - name: 'fetch'
        type: (remoteId) => Promise<RemoteThreadMetadata>
        default: null
        desc: Reads one thread record (status, remoteId, title).
      - name: 'generateTitle'
        type: (remoteId, messages) => Promise<AssistantStream>
        default: null
        desc: Returns a stream whose text is the title; persisting it is the adapter job.
      - name: 'updateCustom'
        type: (remoteId, custom) => Promise<void>
        default: null
        desc: Optional; persists RemoteThreadMetadata.custom.
      returns: RemoteThreadListAdapter object; pass a stable reference
    - id: generate-title
      name: 'generateTitle'
      summary: 'Called after the first message; returns an assistant stream of title text (createAssistantStream from assistant-stream)'
      lenses:
      - reliability
      signature: generateTitle(remoteId, messages) => createAssistantStream(c => c.appendText(title))
      notes:
      - runs after 1st message; not persisted for you; assistant-stream not re-exported
      ref: /docs/runtimes/concepts/threads.md
    - id: threads-search-select
      name: 'threads.search select'
      summary: 'Pass select to threads.search so the server returns metadata fields only, not full message history per thread'
      lenses:
      - perf
      - cost
      signature: client.threads.search({select, limit, offset})
      notes:
      - server honours select; without it full values history returns
      ref: /docs/runtimes/langgraph/threads.md
    - id: stable-adapter-ref
      name: 'Stable adapter reference'
      summary: 'Keep the adapter object referentially stable (module scope or useMemo); a new instance reloads the list'
      lenses:
      - reliability
      - perf
      signature: useMemo(createThreadListAdapter)
      notes:
      - a new adapter reloads the list and cancels in-flight mutations
      ref: /docs/runtimes/concepts/threads.md
    - id: thread-list-paginate
      name: 'List pagination'
      summary: 'list() returns nextCursor; the UI calls aui.threads.loadMore() or renders ThreadListPrimitive.LoadMore'
      lenses:
      - perf
      - reliability
      signature: list({after}) => {threads, nextCursor}; aui.threads.loadMore(); aui.threads.hasMore
      notes:
      - loadMore deduped; page errors swallowed, cursor kept
      ref: /docs/runtimes/concepts/threads.md
      returns: nextCursor enables hasMore; the runtime passes params.after back on each loadMore()
    - id: custom-metadata
      name: 'Custom thread metadata'
      summary: 'Per-thread app metadata stored on RemoteThreadMetadata.custom and written through updateCustom'
      lenses:
      - composability
      signature: RemoteThreadMetadata.custom, aui.threadListItem.updateCustom
      ref: /docs/runtimes/concepts/threads.md
    - id: thread-reload
      name: 'Reload after auth'
      summary: 'Re-run list() after async auth resolves; reload() drops in-flight responses from superseded calls'
      lenses:
      - reliability
      signature: aui.threads.reload()
      notes:
      - needed if per-user auth is added
      ref: /docs/runtimes/concepts/threads.md
    - id: selection-event
      name: 'Selection event'
      summary: 'Event fired when the selected thread changes; replaces threadListItem.switchedTo/switchedAway'
      lenses:
      - perf
      - reliability
      signature: useAuiEvent("threads.selectionChanged", cb)
      notes:
      - useAuiEvent({scope:"*", event}) subscribes across all threads, not just the selected one
      ref: /docs/migrations/v0-15.md
    - id: cloud-persistence
      name: 'Assistant Cloud'
      summary: 'Hosted thread list, message copy and telemetry through the cloud option of the runtime hook'
      lenses:
      - cost
      signature: cloud
      ref: /docs/cloud/langgraph.md
    - id: resumable-streams
      name: 'Resumable streams'
      summary: 'Server-side resumable stream contexts so a client can rejoin a stream after disconnect'
      lenses:
      - reliability
      signature: assistant-stream/resumable, createResumableStreamContext
      ref: /docs/guides/resumable-streams.md
    - id: refetch-thread
      name: 'Refetch open thread'
      summary: 'Re-pull the open thread server state when it changed out of band; reload() alone refreshes only list metadata'
      lenses:
      - reliability
      signature: aui.threads.reloadMainThread(); useExternalStoreRuntime({onRefetchThread})
      notes:
      - in-place refetch keeps composer drafts; remount path drops the rendering runtime
      - capabilities.refetchThread reports which path
      ref: /docs/runtimes/concepts/threads.md
- title: 'Tools and tool UI'
  sections:
  - id: tool-ui
    title: 'Toolkits and tool renderers'
    level: intermediate
    requires:
    - langchain-runtime
    ref: /docs/tools/tool-ui.md
    entries:
    - id: define-toolkit
      name: 'defineToolkit'
      summary: 'Named map of tools (frontend, backend, human) with optional render; registered via Tools({toolkit}) in AuiConfig'
      lenses:
      - composability
      - typing-dx
      signature: defineToolkit({name:{type:"backend", render}}), Tools({toolkit})
      notes:
      - render-only backend entries type-check
      ref: /docs/api-reference/tools/toolkits.md
      params:
      - name: 'definition'
        type: Record<string, ToolDefinition>
        default: null
        desc: Keys are tool names; each entry has type frontend|backend|human, render, and for frontend tools parameters + execute.
      returns: Typed Toolkit; outside a "use generative" compiler it returns the object unchanged
    - id: tool-display
      name: 'Tool display mode'
      summary: 'Controls whether a tool call folds into the tool group (inline) or renders on its own (standalone)'
      lenses:
      - ux-a11y
      signature: 'display: "standalone" | "inline"'
      notes:
      - standalone keeps delegation cards out of the folded tool group
      ref: /docs/api-reference/tools/toolkits.md
      options:
      - name: 'display'
        type: '"inline" | "standalone"'
        default: '"inline"'
        desc: standalone surfaces the call outside the chain-of-thought group; human tools are always standalone.
    - id: tool-render-props
      name: 'Renderer props'
      summary: 'Props a tool renderer receives: args, argsText, result, isError and a four-state status'
      lenses:
      - typing-dx
      - ux-a11y
      signature: args, argsText, result, isError, status
      notes:
      - 'status.type: running, requires-action, incomplete (reason cancelled or error), complete'
      ref: /docs/tools/tool-ui.md
    - id: tool-args-status
      name: 'Tool timing'
      summary: 'Hooks for tool UIs: wall-clock elapsed time, and per-argument streaming-vs-complete state'
      lenses:
      - ux-a11y
      - perf
      signature: useToolCallElapsed, useToolArgsStatus
      notes:
      - elapsed reads part.timing; args status unused
      ref: /docs/api-reference/tools/status.md
      returns: 'useToolCallElapsed: ms (ticks 1s) or undefined; useToolArgsStatus: {propStatus: per-key "streaming"|"complete"}'
    - id: tool-fallback
      name: 'ToolFallback, ToolGroup'
      summary: 'Default renderer for tool calls without a registered UI, plus the folded ToolGroup around consecutive calls'
      lenses:
      - reuse
      - ux-a11y
      signature: ToolFallback, MessagePrimitive.GroupedParts
      notes:
      - vendored; Thread uses part.toolUI ?? ToolFallback
      ref: /elements/tool-fallback.md
    - id: external-tool
      name: 'use-generative helpers'
      summary: 'Marks a generative toolkit entry as executed elsewhere (backend, LangGraph node) so only its renderer is built'
      lenses:
      - security
      signature: externalTool(), humanTool(), stubTool()
      ref: /docs/tools/defining-tools.md
      notes:
      - needs a "use generative" compiler (@assistant-ui/next or /vite)
    - id: approval-gates
      name: 'Approval gates'
      summary: 'Server-side approval for tool calls: the UI answers with respondToApproval instead of executing locally'
      lenses:
      - security
      - ux-a11y
      signature: respondToApproval({approved, reason?}), approval.approved
      ref: /docs/tools/tool-ui.md
    - id: generative-ui
      name: 'present tool'
      summary: 'Model composes UI from a shipped component vocabulary through one present tool and a JSON tree'
      lenses:
      - ux-a11y
      signature: present, JSONGenerativeUI, @assistant-ui/react-generative-ui, MessagePrimitive.GenerativeUI
      notes:
      - model-composed UI; new dep, scouting gate
      ref: /docs/tools/generative-ui.md
    - id: interactables
      name: 'Interactables'
      summary: 'Stateful UI the user and model both edit; auto-generated update_{name} tool, versions and persistence'
      lenses:
      - composability
      ref: /docs/tools/interactables.md
    - id: mcp-tools
      name: 'MCP tools and apps'
      summary: 'Spread MCP server tools into a toolkit and render MCP Apps (ui:// resources)'
      lenses:
      - security
      signature: defineMcpToolkit
      ref: /docs/tools/mcp.md
      params:
      - name: 'definition'
        type: McpServerConfig | {server, disabled?, tools?}
        default: null
        desc: Raw config for always-on servers, or the object form to configure but not expose all tools this request.
    - id: tool-helper
      name: 'tool()'
      summary: 'Type-checked single tool definition with a Standard Schema (Zod) parameters; inferred args for execute'
      lenses:
      - typing-dx
      - reuse
      signature: tool({type, description, parameters, execute})
      params:
      - name: 'type'
        type: '"frontend" | "backend" | "human"'
        default: null
        desc: Where the tool executes; frontend needs execute and a renderer.
      - name: 'parameters'
        type: StandardSchema | JSONSchema7
        default: null
        desc: Schema of arguments the model supplies; Zod v4 input type is inferred.
      - name: 'execute'
        type: (args) => Promise<result>
        default: null
        desc: Runs after valid args; omit for backend tools executed server-side.
      ref: /docs/api-reference/tools/toolkits.md
    - id: human-tool
      name: 'humanTool'
      summary: 'Marks a tool as human-in-the-loop: the agent pauses and the render UI supplies the result'
      lenses:
      - security
      - ux-a11y
      signature: '{execute: humanTool(), render}'
      notes:
      - no runtime body; a "use generative" compiler must strip it
      - replaces deprecated hitl and hitlTool
      ref: /docs/api-reference/tools/toolkits.md
- title: 'Multi-agent UI'
  sections:
  - id: multi-agent
    title: 'Sub-agent rendering'
    level: advanced
    requires:
    - tool-ui
    ref: /docs/tools/multi-agent.md
    entries:
    - id: subagent-messages
      name: 'Nested sub-agent thread'
      summary: 'MessagePartPrimitive.Messages renders a tool call nested messages array as a read-only recursive thread'
      lenses:
      - ux-a11y
      - composability
      signature: MessagePartPrimitive.Messages, ToolCallMessagePart.messages
      notes:
      - inherits the parent toolkit renderers; answerToolCall capability is false inside
      ref: /docs/tools/multi-agent.md
    - id: thread-tasks
      name: 'Thread tasks'
      summary: 'Derived list of delegated tasks on the thread, selectable by id for custom cards or status lists'
      lenses:
      - observability
      - perf
      signature: useAuiState(s => s.thread.tasks), aui.thread.task({id})
      notes:
      - identity stable across unrelated tokens; depth cap 32
      ref: /docs/tools/multi-agent.md
    - id: task-group
      name: 'TaskGroup slot'
      summary: 'Opt-in Thread slot that renders nested tool calls (with messages, no registered UI) as task cards'
      lenses:
      - ux-a11y
      - reuse
      signature: TaskGroup
      notes:
      - only nested tool calls with no registered tool UI
      ref: /elements/task-card.md
    - id: readonly-thread
      name: 'ReadonlyThreadProvider'
      summary: 'Renders a ThreadMessage[] you already hold in a read-only thread context (replays, history views)'
      lenses:
      - composability
      signature: ReadonlyThreadProvider messages={ThreadMessage[]}
      ref: /docs/tools/multi-agent.md
    - id: subagent-list
      name: 'Subagent list'
      summary: 'Elements listing subagents with live status for a multi-agent run'
      lenses:
      - ux-a11y
      ref: /elements/subagent-list.md
    - id: react-o11y
      name: 'react-o11y'
      summary: 'Renders observability spans as collapsible trees, waterfalls and call timelines, complementing message views'
      lenses:
      - observability
      notes:
      - new dep, scouting gate
      ref: /docs/utilities/react-o11y.md
- title: 'Primitives and elements'
  sections:
  - id: primitives
    title: 'Primitives and vendored elements'
    level: basic
    requires:
    - layers
    ref: /docs/primitives.md
    entries:
    - id: primitive-pattern
      name: 'Primitive pattern'
      summary: 'Unstyled composable parts (Root, Part children) with asChild for your own elements; render functions replace the components prop'
      lenses:
      - composability
      - best-practice
      signature: Primitive.Root, Part, asChild
      notes:
      - stable tier; `components` prop deprecated
      ref: /docs/primitives.md
    - id: thread-primitives
      name: 'ThreadPrimitive'
      summary: 'Root, Viewport (owns auto-scroll), Messages, ViewportFooter, ScrollToBottom and Suggestions for the chat transcript'
      lenses:
      - ux-a11y
      - perf
      signature: Root, Viewport, Messages, ViewportFooter, ScrollToBottom
      notes:
      - Viewport owns auto-scroll
      ref: /docs/api-reference/primitives/thread.md
    - id: message-parts
      name: 'MessagePrimitive parts'
      summary: 'Render a message part by part; GroupedParts coalesces adjacent parts via groupBy (for example tool calls, reasoning)'
      lenses:
      - composability
      signature: '<MessagePrimitive.GroupedParts groupBy={groupPartByType({"tool-call": ["group-tool"]})}>{({part, children}) => ...}'
      notes:
      - groupBy/groupKey for custom groups
      ref: /docs/guides/part-grouping.md
    - id: error-primitive
      name: 'Error primitive'
      summary: 'Accessible role=alert error block that reads error text from message state; MessagePrimitive.Error is the bare variant'
      lenses:
      - ux-a11y
      - reliability
      signature: MessagePrimitive.Error, ErrorPrimitive.{Root,Message}
      notes:
      - role=alert container
      ref: /docs/primitives/error.md
    - id: aui-if
      name: 'AuiIf'
      summary: 'Conditional render from the whole assistant state; replaces ThreadPrimitive.If/Empty and friends'
      lenses:
      - composability
      signature: AuiIf condition={s => ...}
      notes:
      - replaces ThreadPrimitive.If/Empty
      ref: /docs/api-reference/primitives/assistant-if.md
      params:
      - name: 'condition'
        type: '(s: AssistantState) => boolean'
        default: null
        desc: Reads thread, message, composer, part or attachment scopes; return a boolean.
    - id: state-hooks
      name: 'State hooks'
      summary: 'useAui gives the client for actions, useAuiState selects one reactive value, useAuiEvent subscribes to events'
      lenses:
      - typing-dx
      - perf
      signature: useAui, useAuiState(selector), useAuiEvent
      notes:
      - useAuiEvent callback needs no memoization; s.optional.<scope> avoids throws for absent scopes
      ref: /docs/api-reference/hooks/state.md
      returns: useAuiState re-renders only when the selected value changes by Object.is; returning the whole state throws
    - id: state-outside-thread
      name: 'State outside the thread'
      summary: 'Header, sidebar or status UI can read thread state anywhere under the provider with no second store'
      lenses:
      - composability
      notes:
      - outside the provider, scope accessors throw
      ref: /docs/guides/state-outside-the-thread.md
    - id: thread-list-primitives
      name: 'Thread list primitives'
      summary: 'ThreadListPrimitive (Root, Items, ItemByIndex, New, LoadMore) and ThreadListItemPrimitive for the sidebar list'
      lenses:
      - ux-a11y
      signature: ThreadListPrimitive, ThreadListItemPrimitive
      ref: /elements/thread-list.md
    - id: composer-attachments
      name: 'Attachments'
      summary: 'Composer attachment parts and an AttachmentAdapter for uploads, previews and validation'
      lenses:
      - ux-a11y
      - security
      signature: ComposerPrimitive.Attachments, AttachmentPrimitive
      notes:
      - no AttachmentAdapter set; validate if added
      ref: /docs/guides/attachments.md
    - id: suggestions
      name: 'Suggestions'
      summary: 'Empty-state suggestion chips via ThreadPrimitive.Suggestions and a suggestion adapter on runtimes that have the slot'
      lenses:
      - ux-a11y
      signature: ThreadPrimitive.Suggestions, SuggestionPrimitive
      notes:
      - react-langchain has no suggestion adapter slot
      ref: /docs/guides/suggestions.md
    - id: branching
      name: 'Branching'
      summary: 'BranchPicker walks alternate message versions created by edits and regenerations'
      lenses:
      - ux-a11y
      signature: BranchPickerPrimitive.{Root,Previous,Number,Count,Next}, aui.message.switchToBranch
      ref: /docs/guides/branching.md
    - id: editing
      name: 'Message editing'
      summary: 'Inline message editing through an edit composer and ActionBarPrimitive.Edit'
      lenses:
      - ux-a11y
      signature: message.composer.isEditing, ActionBarPrimitive.Edit
      ref: /docs/guides/editing.md
    - id: reasoning-group
      name: 'Reasoning group'
      summary: 'Groups consecutive reasoning parts into a collapsible block, shown while thinking streams'
      lenses:
      - ux-a11y
      signature: ReasoningGroup, group-reasoning, ChainOfThoughtPrimitive
      ref: /elements/reasoning.md
    - id: stopped-run
      name: 'Stopped run'
      summary: 'A cancelled message keeps its partial text with status incomplete and reason cancelled; show a continue/dismiss UI'
      lenses:
      - ux-a11y
      - reliability
      signature: status.reason === "cancelled"
      ref: /elements/stopped-run.md
    - id: connection-state
      name: 'Connection state'
      summary: 'No connection field on thread state; catch the transport failure, show a banner, then resume or reload the thread'
      lenses:
      - reliability
      - ux-a11y
      signature: aui.threads.reloadMainThread(), resumeRun
      notes:
      - no connection field in thread state
      ref: /elements/connection-state.md
      returns: reloadMainThread() re-fetches the open thread messages; resumeRun({parentId}) rejoins a run
    - id: thread-virtualization
      name: 'Thread virtualization'
      summary: 'Virtualize very long threads by rows (message/part/turn-end) with @tanstack/react-virtual; default kit uses content-visibility'
      lenses:
      - perf
      signature: createThreadRowsSelector, ThreadPrimitive.Row
      ref: /docs/guides/virtualization.md
    - id: message-timing
      name: 'Message timing'
      summary: 'Experimental hook returning stream duration, time to first token and tokens per second for the current message'
      lenses:
      - observability
      signature: useMessageTiming()
      notes:
      - experimental; react-langchain fills metadata.timing
      ref: /docs/guides/message-timing.md
      returns: '{streamStartTime, firstTokenTime?, totalStreamTime?, tokenCount?, tokensPerSecond?, totalChunks, toolCallCount} | undefined'
    - id: markdown-text
      name: 'MarkdownText'
      summary: 'MarkdownTextPrimitive renders a text part as markdown with remark plugins; kit wrapper in components'
      lenses:
      - reuse
      - ux-a11y
      signature: MarkdownTextPrimitive, remarkPlugins
      notes:
      - renders inside a text part
      ref: /elements/markdown-text.md
    - id: streamdown
      name: 'Streamdown'
      summary: 'Alternative markdown renderer with math, mermaid and shiki code highlighting'
      lenses:
      - ux-a11y
      signature: StreamdownTextPrimitive
      ref: /docs/guides/streamdown.md
    - id: composer-extras
      name: 'Composer extras'
      summary: 'Optional composer features: mentions, slash commands, dictation, speech and voice'
      lenses:
      - ux-a11y
      ref: /docs/guides/mentions.md
- title: 'Styling utilities'
  sections:
  - id: styling
    title: 'tw-shimmer'
    level: basic
    requires: []
    ref: /docs/utilities/tw-shimmer.md
    entries:
    - id: tw-shimmer
      name: 'tw-shimmer'
      summary: 'Tailwind v4 CSS-only shimmer for loading text and skeletons; needs a semi-transparent text colour'
      lenses:
      - ux-a11y
      - perf
      signature: '@import "tw-shimmer", shimmer, shimmer-bg'
      notes:
      - text shimmer holds still under prefers-reduced-motion; shimmer-bg keeps animating
      ref: /docs/utilities/tw-shimmer.md
- title: 'Migrations and deprecated APIs'
  sections:
  - id: migrations
    title: 'Deprecated and removed APIs'
    level: intermediate
    requires: []
    ref: /docs/migrations/v0-15.md
    entries:
    - id: scope-accessor-props
      name: 'Scope accessors as properties'
      summary: 'aui.thread() call form is deprecated; use the property form aui.thread, which is always truthy (check .source != null)'
      lenses:
      - best-practice
      - typing-dx
      signature: aui.thread.getState(), source != null
      notes:
      - 'codemod: assistant-ui upgrade'
      ref: /docs/migrations/v0-15.md
    - id: legacy-context-hooks
      name: 'Legacy context hooks'
      summary: 'v0.12-era hooks (useThreadRuntime, useThread, useMessage...) were removed in 0.15 in favour of useAui/useAuiState'
      lenses:
      - best-practice
      signature: useThreadRuntime
      deprecated: removed in 0.15, use useAui/useAuiState
      ref: /docs/migrations/v0-15.md
    - id: legacy-if-components
      name: 'Legacy If and part hooks'
      summary: 'ThreadPrimitive.If/Empty, useMessagePartText and the components prop are replaced by AuiIf, useAuiState and render children'
      lenses:
      - best-practice
      signature: ThreadPrimitive.If, ThreadPrimitive.Empty, useMessagePartText, components
      deprecated: use AuiIf, useAuiState, children render fn
      ref: /docs/migrations/v0-15.md
    - id: legacy-tool-apis
      name: 'Legacy tool APIs'
      summary: 'makeAssistantTool, useAssistantTool, makeAssistantToolUI, useAssistantToolUI are deprecated for toolkits'
      lenses:
      - best-practice
      - composability
      signature: makeAssistantTool, useAssistantTool, makeAssistantToolUI, useAssistantToolUI
      deprecated: use defineToolkit + Tools({toolkit}); hitl/hitlTool also deprecated, use humanTool
      notes:
      - banned by web rules
      ref: /docs/migrations/toolkit-tools.md
    - id: legacy-thread-events
      name: 'Legacy thread events'
      summary: 'switchedTo/switchedAway events, ToolsState.tools and the "mcp-app" group key were replaced in 0.15'
      lenses:
      - best-practice
      signature: threadListItem.switchedTo, switchedAway, ToolsState.tools, "mcp-app"
      deprecated: use threads.selectionChanged, s.tools.toolUIs, standalone-tool-call
      ref: /docs/migrations/v0-15.md
    - id: react-langgraph-runtime
      name: 'react-langgraph runtime'
      summary: 'Older sibling runtime with a custom stream function and event handlers; heavier than react-langchain'
      lenses:
      - composability
      signature: '@assistant-ui/react-langgraph'
      notes:
      - only it has message queue, custom backend streams
      ref: /docs/runtimes/langgraph/overview.md
- title: 'Other runtimes'
