      summary: 'useChatRuntime adapter for Vercel AI SDK backends'
      lenses:
      - composability
      signature: useChatRuntime
      ref: /docs/runtimes/ai-sdk/v7.md
    - id: local-runtime
      name: 'LocalRuntime and protocols'
      summary: 'In-browser runtime driven by a ChatModelAdapter, plus DataStream and AssistantTransport protocols'
      lenses:
