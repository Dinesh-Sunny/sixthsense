  exclude: '/oss/javascript/langgraph/(overview|install|quickstart|choosing-apis|thinking-in-langgraph|workflows-agents|agentic-rag|graph-api|use-graph-api|functional-api|use-functional-api|pregel|application-structure|test|fault-tolerance|add-memory)(\.md)?$'
  why: in-process JS graph authoring (StateGraph, Functional API, Pregel, node retries and timeouts, memory trimming, graph tests, langgraph.json); these packages are only the browser client of a Python Agent Server and the server-side concepts live in the langgraph stack
