  react-sdk: https://github.com/langchain-ai/langgraphjs/blob/main/libs/sdk-react/docs
  sdk: https://github.com/langchain-ai/langgraphjs/blob/main/libs/sdk/docs
source: https://docs.langchain.com/_llms/agent-development-lifecycle/build/type-script.md
fetched: 2026-10-05
