      name: 'OpenRouter and LiteLLM'
      summary: 'Use the dedicated langchain-openrouter and langchain-litellm packages instead of the openai provider with a router base_url.'
      lenses: [composability]
      notes: ["docs prefer the dedicated packages"]
      ref: /oss/python/langchain/models.md#base-url-and-proxy-settings
