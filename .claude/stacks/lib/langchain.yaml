    entries:
    - id: provider-packages
      name: 'Provider packages'
      summary: 'Provider integrations ship as separate installs (langchain-openai, langchain-anthropic, ...) or langchain[extra].'
      lenses: [reuse, best-practice]
      notes: ["use uv add"]
      ref: /oss/python/langchain/install.md
