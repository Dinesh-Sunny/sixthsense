- title: 'Mental model and API choice'
  sections:
  - id: lg-model
    title: 'Thinking in LangGraph'
    level: basic
    requires: []
    ref: /oss/python/langgraph/thinking-in-langgraph.md
    entries:
    - id: lg-thinking
      name: 'Design method'
      summary: 'Steps as nodes, raw state, prompts formatted on demand, errors handled by class'
      lenses: [best-practice]
      ref: /oss/python/langgraph/thinking-in-langgraph.md
    - id: lg-workflow-patterns
      name: 'Workflow patterns'
      summary: 'Chaining, parallelization, routing, orchestrator-worker, evaluator-optimizer, `ToolNode`'
      lenses: [composability]
      ref: /oss/python/langgraph/workflows-agents.md
    - id: lg-choose-api
      name: 'Graph API vs Functional API'
      summary: 'Graph API for explicit topology and visualization; Functional API to add durability to existing code'
      lenses: [best-practice]
      ref: /oss/python/langgraph/choosing-apis.md
    - id: lg-create-react-agent
      name: 'create_react_agent, AgentState*, ValidationNode, MessageGraph'
      summary: 'Old prebuilt agent API; use `create_agent`, `AgentState`, `StateGraph` instead'
      lenses: [best-practice]
      signature: create_agent, AgentState, StateGraph
      deprecated: use create_agent
      ref: /oss/python/migrate/langgraph-v1.md
    - id: lg-hitl-types
      name: 'HumanInterruptConfig, ActionRequest, HumanInterrupt'
      summary: 'Old HITL types; use `InterruptOnConfig` / `HITLRequest` from the LangChain HITL middleware'
      lenses: [best-practice]
      signature: InterruptOnConfig, HITLRequest
      deprecated: use LangChain HITL middleware types
      ref: /oss/python/migrate/langgraph-v1.md
    - id: lg-migrate-supervisor
      name: 'Migrate from langgraph-supervisor'
      summary: 'langgraph-supervisor is unmaintained; wrap workers as tools of one create_agent supervisor'
      lenses: [best-practice, composability]
      signature: 'create_supervisor(...) -> create_agent(model, tools=[call_worker, ...], checkpointer=...) with @tool wrappers that call worker.invoke'
      deprecated: 'langgraph-supervisor package (create_supervisor, create_handoff_tool, output_mode); use the subagents pattern'
      notes:
      - 'output_mode full_history or last_message becomes whatever the tool wrapper returns; nested supervisors flatten to one tool per leaf, or nest tool-wrapped middle-tier agents'
      - 'interrupt() inside a subagent tool bubbles through nested create_agent layers only if just the outermost graph has a checkpointer and the outer call passes thread_id in configurable'
      - 'need static subgraph discovery, per-tier checkpoint namespaces, shared state keys or mixed deterministic/agentic steps: use a custom StateGraph with subgraph nodes instead'
      ref: /oss/python/migrate/langgraph-supervisor.md
  - id: lg-tutorials
    title: 'Quickstart and custom-agent tutorials'
    level: basic
    requires: [lg-model]
    ref: /oss/python/langgraph/quickstart.md
    entries:
    - id: lg-install
      name: 'Install'
      summary: '`uv add langgraph` plus `langchain` (Python 3.10+) for models and tools; provider packages separately'
      lenses: [reuse]
      signature: uv add langgraph langchain
      ref: /oss/python/langgraph/install.md
    - id: lg-quickstart
      name: 'Quickstart (calculator agent)'
      summary: 'Hand-built tool loop: llm_call node, tool_node, should_continue conditional edge; also as @entrypoint'
      lenses: [best-practice]
      signature: 'StateGraph(MessagesState); add_node; add_edge(START, "llm_call"); add_conditional_edges("llm_call", should_continue, ["tool_node", END]); add_edge("tool_node", "llm_call")'
      notes:
      - 'the quickstart state is a TypedDict with Annotated[list[AnyMessage], operator.add], which only appends; MessagesState (add_messages) also merges by message id'
      - 'a Literal return annotation on the routing function (or a path_map) lets visualization draw only real edges'
      - 'create_agent is the production form of this loop; hand-build it only for custom topology'
      ref: /oss/python/langgraph/quickstart.md
    - id: lg-agentic-rag
      name: 'Custom RAG agent'
      summary: 'Retriever tool, grade-documents router with structured output, rewrite loop, ToolNode retrieve step'
      lenses: [best-practice, composability]
      signature: 'add_conditional_edges("generate_query_or_respond", route_on_tool_calls, {"tools": "retrieve", END: END}); add_conditional_edges("retrieve", grade_documents)'
      notes:
      - 'grading is a model call with .with_structured_output(Pydantic) inside a routing function typed Literal["generate_answer", "rewrite_question"]'
      - 'the grader prompt tells the model to treat retrieved text as data only, ignoring instructions inside it (prompt-injection guard)'
      - 'the loop rewrite_question -> generate_query_or_respond is bounded only by the recursion limit'
      ref: /oss/python/langgraph/agentic-rag.md
    - id: lg-sql-agent
      name: 'Custom SQL agent'
      summary: 'Fixed list_tables, get_schema prefix steps, then a generate/check/run query loop; interrupt() reviews the query'
      lenses: [security, reliability]
      signature: 'ToolNode([run_query_tool_with_interrupt], name="run_query"); interrupt([request]) with response type accept or edit'
      notes:
      - 'wrap a read-only DB tool so interrupt() asks a human to accept, edit or reject the SQL before it runs; needs a checkpointer'
      - 'the final run streams with stream_events(version="v3"): iterate stream.messages, read stream.output'
      ref: /oss/python/langgraph/sql-agent.md
- title: 'Graph API'
  sections:
  - id: lg-graph-core
    title: 'State, nodes, edges'
    level: basic
    requires: [lg-model]
    ref: /oss/python/langgraph/graph-api.md
    entries:
    - id: lg-stategraph
      name: 'StateGraph'
      summary: 'Builder for a graph of nodes sharing typed state; `.compile()` turns it into the runnable graph'
      lenses: [composability, typing-dx]
      import: langgraph.graph
      signature: StateGraph(state_schema, context_schema=None, *, input_schema=None, output_schema=None)
      params:
      - {name: state_schema, type: 'type[StateT]', default: null, desc: 'Schema class defining state channels; per-key reducers come from Annotated types.'}
      - {name: context_schema, type: 'type[ContextT] | None', default: 'None', desc: 'Schema for immutable run-scoped context (user_id, db handle) read via Runtime.'}
      - {name: input_schema, type: 'type | None', default: 'None', desc: 'Narrower schema for the graph input; defaults to the state schema.'}
      - {name: output_schema, type: 'type | None', default: 'None', desc: 'Narrower schema for the graph output; defaults to the state schema.'}
      returns: 'A builder, not runnable; add_node/add_edge/add_conditional_edges chain, then compile() returns a CompiledStateGraph'
      notes:
      - 'config_schema is deprecated since 0.6.0 (removal in 2.0.0): use context_schema'
      - 'edge helpers: add_edge, add_conditional_edges, add_sequence, set_entry_point, set_finish_point; START and END come from langgraph.graph'
      ref: reference:/python/langgraph/graph/state/StateGraph
    - id: lg-add-node
      name: 'add_node'
      summary: 'Register a node and attach its per-node policies: retry, timeout, cache, error handler, deferral'
      lenses: [reliability, composability]
      signature: builder.add_node(node, action=None, *, defer=False, metadata=None, input_schema=None, retry_policy=None, cache_policy=None, error_handler=None, destinations=None, timeout=None, trace_policy=None)
      options:
      - {name: retry_policy, type: 'RetryPolicy | Sequence[RetryPolicy] | None', default: 'None', desc: 'Retry config; with a sequence, the first matching policy applies.'}
      - {name: timeout, type: 'float | timedelta | TimeoutPolicy | None', default: 'None', desc: 'Per-attempt cap; async nodes only.'}
      - {name: cache_policy, type: 'CachePolicy | None', default: 'None', desc: 'Cache node results by input; needs compile(cache=...).'}
      - {name: error_handler, type: 'callable | None', default: 'None', desc: 'Runs after retries are exhausted; may return an update or Command.'}
      - {name: defer, type: bool, default: 'False', desc: 'Delay the node until the run is about to end (fan-in cleanup).'}
      - {name: input_schema, type: 'type | None', default: 'None', desc: 'Per-node input schema; defaults to the graph state schema.'}
      - {name: destinations, type: 'dict[str, str] | tuple[str, ...] | None', default: 'None', desc: 'Declares where a Command-returning node can route; rendering only, no runtime effect.'}
      - {name: trace_policy, type: 'TracePolicy | None', default: 'None', desc: 'process_inputs transforms the node input before it is traced (trim big histories); execution unchanged.'}
      returns: 'Self, so calls chain'
      notes:
      - 'a node may take (state), (state, config: RunnableConfig) or (state, runtime: Runtime[Ctx]); sync and async both work'
      - 'nodes resume from the top of their function after a retry or interrupt, so keep side effects idempotent'
      ref: reference:/python/langgraph/graph/state/StateGraph/add_node
    - id: lg-compile
      name: 'compile'
      summary: 'Validate topology and bind runtime options: checkpointer, store, cache, static breakpoints, name, stream transformers'
      lenses: [composability, reliability]
      signature: builder.compile(checkpointer=None, *, cache=None, store=None, interrupt_before=None, interrupt_after=None, debug=False, name=None, transformers=None)
      options:
      - {name: checkpointer, type: 'BaseCheckpointSaver | bool | None', default: 'None', desc: 'Saver enabling pause/resume/replay. None inherits the parent graph checkpointer when used as a subgraph; False inherits none.'}
      - {name: cache, type: 'BaseCache | None', default: 'None', desc: 'Backend for node cache_policy, e.g. InMemoryCache.'}
      - {name: store, type: 'BaseStore | None', default: 'None', desc: 'Cross-thread store exposed to nodes as runtime.store.'}
      - {name: interrupt_before, type: 'All | list[str] | None', default: 'None', desc: 'Static breakpoints before these nodes (debug and tests).'}
      - {name: interrupt_after, type: 'All | list[str] | None', default: 'None', desc: 'Static breakpoints after these nodes.'}
      - {name: name, type: 'str | None', default: 'None', desc: 'Label for the compiled graph; shows as graph_name on streamed subgraphs.'}
      - {name: transformers, type: 'Sequence[Callable[[tuple[str, ...]], Any]] | None', default: 'None', desc: 'stream_events v3 transformer factories, propagated to subgraphs, appended after built-ins.'}
      returns: 'CompiledStateGraph (a Pregel): invoke, stream, stream_events, get_state, update_state'
      notes:
      - 'compiling is mandatory; it checks structure (orphan nodes) and fixes the checkpointer'
      ref: reference:/python/langgraph/graph/state/StateGraph/compile
    - id: lg-invoke
      name: 'invoke / stream'
      summary: 'Run a compiled graph once (`invoke`) or iterate its steps (`stream`); async twins `ainvoke`/`astream`'
      lenses: [composability, reliability]
      signature: graph.invoke(input, config=None, *, context=None, stream_mode="values", durability=None, control=None, version="v1")
      options:
      - {name: input, type: 'InputT | Command | None', default: null, desc: 'Graph input; Command(resume=...) continues an interrupt; None resumes from the checkpoint (after drain, fork or replay).'}
      - {name: config, type: 'RunnableConfig | None', default: 'None', desc: 'configurable.thread_id selects the thread; recursion_limit is a top-level key, never inside configurable.'}
      - {name: context, type: 'ContextT | None', default: 'None', desc: 'Run-scoped context matching context_schema.'}
      - {name: durability, type: 'Literal["exit","async","sync"] | None', default: 'None (async)', desc: 'When checkpoints are written.'}
      - {name: control, type: 'RunControl | None', default: 'None', desc: 'Enables cooperative drain; GraphDrained is raised at the next superstep boundary.'}
      - {name: version, type: 'Literal["v1","v2"]', default: '"v1"', desc: 'v2 returns GraphOutput(value, interrupts) from invoke and StreamPart dicts from stream.'}
      - {name: subgraphs, type: bool, default: 'False', desc: 'stream only: include subgraph events as (namespace, data).'}
      returns: 'Final state (dict, or GraphOutput on v2); with a non-values stream_mode, a list of chunks'
      notes:
      - 'Command(update=...) alone as input resumes from the latest checkpoint and looks stuck; send a plain input dict for follow-up turns'
      ref: reference:/python/langgraph/pregel/main/Pregel/invoke
    - id: lg-state-reducers
      name: 'Reducers and schemas'
      summary: 'Per-key merge functions via `Annotated`, `MessagesState`, `Overwrite`, untracked fields, input/output schemas'
      lenses: [typing-dx, best-practice]
      signature: 'Annotated[list, add_messages]; return {"key": Overwrite(value)} to bypass a reducer'
      notes:
      - 'a reducer is binary: reducer(current, update); with no reducer, updates overwrite the key'
      - 'an empty update does NOT clear a merging field; wrap in Overwrite([]) to reset it (two Overwrites in one superstep raise InvalidUpdateError)'
      - 'UntrackedValue fields exist during a run but are never checkpointed and reset on resume'
      - 'MessagesState is the ready-made schema with a messages key and the add_messages reducer'
      ref: /oss/python/langgraph/use-graph-api.md
    - id: lg-send-command
      name: 'Dynamic routing'
      summary: '`Send(node, arg)` for map-reduce fan-out; `Command(update, goto, graph, resume)` for routing and resuming'
      lenses: [composability]
      import: langgraph.types
      signature: Send(node, arg, *, timeout=None); Command(*, graph=None, update=None, resume=None, goto=())
      params:
      - {name: Send.arg, type: Any, default: null, desc: 'State handed to the target node for this one task; may differ from the graph state.'}
      - {name: Send.timeout, type: 'float | timedelta | TimeoutPolicy | None', default: 'None', desc: 'Overrides the target node timeout for this push only.'}
      - {name: Command.update, type: Any, default: 'None', desc: 'State update applied like a node return.'}
      - {name: Command.goto, type: 'Send | Sequence[Send | str] | str', default: '()', desc: 'Next node(s) or Send packets.'}
      - {name: Command.graph, type: 'str | None', default: 'None', desc: 'Command.PARENT targets the closest parent graph from inside a subgraph.'}
      - {name: Command.resume, type: 'dict | Any | None', default: 'None', desc: 'Value (or mapping of interrupt id to value) returned by interrupt().'}
      returns: 'Returned from nodes or tools to update state and route in one step; also accepted as graph input'
      notes:
      - 'Command adds dynamic edges only; static add_edge from the same node still runs, so use one mechanism per node'
      - 'annotate nodes returning Command as Command[Literal["next"]] so rendering knows the destinations'
      - 'a parent-key update from a subgraph needs a reducer on that key in the parent schema'
      ref: /oss/python/langgraph/graph-api.md
    - id: lg-runtime-context
      name: 'Runtime context'
      summary: 'Pass dependencies (model name, user id, db) per run via `context_schema` and read them from `Runtime` in nodes'
      lenses: [typing-dx, composability]
      import: langgraph.runtime
      signature: 'StateGraph(State, context_schema=Ctx); graph.invoke(x, context=Ctx(...)); def node(state, runtime: Runtime[Ctx])'
      options:
      - {name: runtime.context, type: ContextT, default: null, desc: 'The context object passed to invoke/stream.'}
      - {name: runtime.store, type: 'BaseStore | None', default: null, desc: 'Store given to compile(store=...) or provided by the server.'}
      - {name: runtime.stream_writer, type: StreamWriter, default: null, desc: 'Emit custom stream chunks.'}
      - {name: runtime.execution_info, type: ExecutionInfo, default: null, desc: 'node_attempt (1-indexed), node_first_attempt_time, thread_id, run_id, checkpoint_id, task_id.'}
      - {name: runtime.heartbeat, type: 'Callable[[], None]', default: null, desc: 'Resets an idle timeout; a no-op outside an idle-timed attempt.'}
      - {name: runtime.drain_requested, type: bool, default: null, desc: 'True once RunControl.request_drain was called; drain_reason holds the label.'}
      notes:
      - 'Runtime has no config; add a `config: RunnableConfig` parameter or use get_config()'
      - 'ToolRuntime (langgraph.prebuilt) is the tool-side subclass adding state and tool_call_id'
      ref: reference:/python/langgraph/runtime/Runtime
    - id: lg-recursion-limit
      name: 'Recursion limit'
      summary: 'Caps supersteps per run; exceeding it raises `GraphRecursionError`; the step counter is readable in nodes'
      lenses: [reliability, cost]
      signature: 'graph.invoke(x, config={"recursion_limit": n}); config["metadata"]["langgraph_step"]'
      notes:
      - 'recursion_limit is a standalone config key, not under configurable'
      - 'docs say default 1000 since 1.0.6; installed 1.2.12 source defaults to 10007 (env LANGGRAPH_DEFAULT_RECURSION_LIMIT), docs stale'
      - 'proactive pattern: read langgraph_step in a node and route to a graceful exit before the limit'
      ref: /oss/python/langgraph/graph-api.md
    - id: lg-node-cache
      name: 'Node caching'
      summary: 'Skip re-running a node for an input already seen; per-node `CachePolicy`, cache backend set at compile'
      lenses: [perf, cost]
      import: langgraph.types
      signature: add_node(cache_policy=CachePolicy(key_func=..., ttl=None)); compile(cache=InMemoryCache())
      params:
      - {name: key_func, type: callable, default: 'default_cache_key', desc: 'Builds the cache key from the node input; default hashes the input with pickle.'}
      - {name: ttl, type: 'int | None', default: 'None', desc: 'Seconds to keep an entry; None never expires.'}
      returns: 'Cache hits stream with {"__metadata__": {"cached": True}} in updates mode'
      ref: /oss/python/langgraph/graph-api.md
    - id: lg-visualize
      name: 'Visualization'
      summary: 'Render the compiled graph as Mermaid text or PNG to review topology'
      lenses: [observability]
      signature: graph.get_graph().draw_mermaid(); .draw_mermaid_png()
      ref: /oss/python/langgraph/use-graph-api.md
    - id: lg-conditional-edges
      name: 'add_conditional_edges'
      summary: 'Route at runtime with a function over state; return a node name, END, or a list for fan-out'
      lenses: [typing-dx, composability]
      signature: builder.add_conditional_edges(source, path, path_map=None)
      params:
      - {name: source, type: str, default: null, desc: 'Node whose exit triggers the routing function.'}
      - {name: path, type: 'Callable[..., Hashable | Sequence[Hashable]] | Runnable', default: null, desc: 'Returns the next node name(s); returning END stops the run.'}
      - {name: path_map, type: 'dict[Hashable, str] | list[str] | None', default: 'None', desc: 'Maps path outputs to node names; omit when path already returns node names.'}
      returns: 'Self, so calls chain'
      notes:
      - 'without a Literal return annotation on path or a path_map, visualization assumes the edge can go to any node'
      ref: reference:/python/langgraph/graph/state/StateGraph/add_conditional_edges
    - id: lg-toolnode
      name: 'ToolNode'
      summary: 'Prebuilt node that runs the tool calls of the last AIMessage in parallel; create_agent uses it internally'
      lenses: [reliability, reuse]
      import: langgraph.prebuilt
      signature: ToolNode(tools, *, name='tools', tags=None, handle_tool_errors=<default>, messages_key='messages', wrap_tool_call=None, awrap_tool_call=None)
      params:
      - {name: tools, type: 'Sequence[BaseTool | Callable]', default: null, desc: 'Tools to run; plain functions are converted with inferred schemas.'}
      - {name: handle_tool_errors, type: 'bool | str | Callable | type[Exception] | tuple', default: default handler, desc: 'Default turns invalid-argument errors into a ToolMessage and re-raises execution errors; False propagates everything.'}
      - {name: messages_key, type: str, default: messages, desc: 'State key holding the messages, also used for the output ToolMessages.'}
      - {name: wrap_tool_call, type: 'ToolCallWrapper | None', default: 'None', desc: 'Sync interceptor around each tool call; awrap_tool_call is the async twin.'}
      returns: 'Dict state input gives {"messages": [ToolMessage]}; a list input gives a list; Command-returning tools yield Commands'
      notes:
      - 'reference advises it only for custom workflows needing fine-grained control; standard ReAct agents use create_agent'
      ref: reference:/python/langgraph.prebuilt/tool_node/ToolNode
  - id: lg-fault-tolerance
    title: 'Retries, timeouts, error handlers (langgraph>=1.2)'
    level: intermediate
    requires: [lg-graph-core]
    ref: /oss/python/langgraph/fault-tolerance.md
    entries:
    - id: lg-retry-policy
      name: 'RetryPolicy'
      summary: 'Re-run a failed node attempt with exponential backoff, filtered by exception type or predicate'
      lenses: [reliability]
      import: langgraph.types
      signature: RetryPolicy(initial_interval=0.5, backoff_factor=2.0, max_interval=128.0, max_attempts=3, jitter=True, retry_on=default_retry_on)
      params:
      - {name: max_attempts, type: int, default: '3', desc: 'Maximum attempts including the first.'}
      - {name: initial_interval, type: float, default: '0.5', desc: 'Seconds before the first retry.'}
      - {name: backoff_factor, type: float, default: '2.0', desc: 'Interval multiplier after each retry.'}
      - {name: max_interval, type: float, default: '128.0', desc: 'Upper bound in seconds between retries.'}
      - {name: jitter, type: bool, default: 'True', desc: 'Add random jitter to the interval.'}
      - {name: retry_on, type: 'type[Exception] | Sequence[type[Exception]] | Callable[[Exception], bool]', default: 'default_retry_on', desc: 'Exceptions to retry, or a predicate returning True.'}
      returns: 'A NamedTuple passed to add_node(retry_policy=...) or set_node_defaults'
      notes:
      - 'default_retry_on retries any exception except ValueError, TypeError, ArithmeticError, ImportError, LookupError, NameError, SyntaxError, RuntimeError, OSError'
      - 'requests and httpx errors retry only on 5xx; NodeTimeoutError is retryable by default'
      - 'extend the default with `lambda e: not isinstance(e, MyErr) and default_retry_on(e)`; runtime.execution_info.node_attempt shows the attempt'
      ref: /oss/python/langgraph/fault-tolerance.md
    - id: lg-node-timeout
      name: 'Node timeouts'
      summary: 'Cap one node attempt by wall-clock (`run_timeout`) and/or inactivity (`idle_timeout`); raises `NodeTimeoutError`'
      lenses: [reliability, cost]
      import: langgraph.types
      signature: add_node(timeout=60 | timedelta | TimeoutPolicy(run_timeout=None, idle_timeout=None, refresh_on="auto"))
      params:
      - {name: run_timeout, type: 'float | timedelta | None', default: 'None', desc: 'Hard wall-clock cap per attempt; never refreshed.'}
      - {name: idle_timeout, type: 'float | timedelta | None', default: 'None', desc: 'Fires after this long without progress; the clock resets on progress signals.'}
      - {name: refresh_on, type: 'Literal["auto","heartbeat"]', default: '"auto"', desc: 'auto resets on state writes, stream output, callbacks; heartbeat only on runtime.heartbeat().'}
      returns: 'NodeTimeoutError(node, elapsed, kind "idle"|"run", idle_timeout, run_timeout); retryable, writes of the failed attempt are cleared'
      notes:
      - 'async nodes only; a sync node with timeout is rejected at compile time (wrap blocking I/O in asyncio.to_thread)'
      - 'works with retry_policy; the clock restarts each attempt; Send(..., timeout=) overrides it per push'
      ref: /oss/python/langgraph/fault-tolerance.md
    - id: lg-error-handler
      name: 'Error handlers'
      summary: 'A fallback node function that runs after retries are exhausted and may update state or route with `Command`'
      lenses: [reliability]
      import: langgraph.errors
      signature: 'add_node(error_handler=fn(state, error: NodeError[, config]) -> dict | Command)'
      params:
      - {name: NodeError.node, type: str, default: null, desc: 'Name of the node that failed.'}
      - {name: NodeError.error, type: BaseException, default: null, desc: 'The exception raised; a failed subgraph surfaces here too.'}
      returns: 'State update or Command(update, goto) for compensation flows'
      notes:
      - 'interrupt() is never routed to the handler (GraphBubbleUp bypasses retries and handlers)'
      - 'one handler per node; if the handler raises, the error propagates as if there were none'
      - 'failure provenance is checkpointed, so a resumed run sees the same NodeError'
      ref: /oss/python/langgraph/fault-tolerance.md
    - id: lg-node-defaults
      name: 'set_node_defaults'
      summary: 'Graph-wide default retry, timeout, cache and error handler; per-node arguments win'
      lenses: [reuse, best-practice]
      signature: builder.set_node_defaults(*, retry_policy=None, cache_policy=None, error_handler=None, timeout=None)
      returns: 'The builder (chainable); defaults resolve at compile(), so call order vs add_node does not matter'
      notes:
      - 'retry_policy and timeout also cover error-handler nodes; cache_policy and error_handler do not (handlers never catch themselves)'
      - 'defaults are not inherited by subgraphs'
      ref: /oss/python/langgraph/fault-tolerance.md
    - id: lg-graceful-drain
      name: 'Graceful shutdown'
      summary: 'Stop a run cleanly at the next superstep and save a resumable checkpoint, e.g. on SIGTERM'
      lenses: [reliability]
      import: langgraph.runtime
      signature: control = RunControl(); graph.invoke(x, config, control=control); control.request_drain(reason)
      returns: 'Raises GraphDrained(reason) when supersteps remain; resume with invoke(None, config) on the same thread_id'
      notes:
      - 'drains between supersteps only; a running node or retry loop finishes first; request_drain is thread-safe'
      - 'create a fresh RunControl per run; a drained control stays drained'
      - 'does not cancel asyncio tasks or threads; pair with a hard timeout'
      ref: /oss/python/langgraph/fault-tolerance.md
- title: 'Functional API'
  sections:
  - id: lg-functional
    title: 'Entrypoints and tasks'
    level: intermediate
    requires: [lg-choose-api]
    ref: /oss/python/langgraph/functional-api.md
    entries:
    - id: lg-entrypoint
      name: 'entrypoint'
      summary: 'Decorator turning one function into a durable workflow with checkpointer, store, retry and timeout'
      lenses: [composability]
      import: langgraph.func
      signature: '@entrypoint(checkpointer=None, store=None, cache=None, context_schema=None, cache_policy=None, retry_policy=None, timeout=None)'
      options:
      - {name: checkpointer, type: 'BaseCheckpointSaver | None', default: 'None', desc: 'Required for previous, interrupts and durable resume.'}
      - {name: store, type: 'BaseStore | None', default: 'None', desc: 'Cross-thread store exposed through runtime.store.'}
      - {name: timeout, type: 'float | timedelta | TimeoutPolicy | None', default: 'None', desc: 'Per-attempt cap; async workflows only.'}
      returns: 'A Pregel-like workflow; entrypoint.final(value=, save=) returns one value and checkpoints another'
      notes:
      - 'takes one input param; injectable params: config, previous (last return on the thread), runtime'
      ref: reference:/python/langgraph/func/entrypoint
    - id: lg-task
      name: 'task'
      summary: 'Checkpointed unit of work inside an entrypoint or node; calling it returns a future for parallel fan-out'
      lenses: [perf, reliability]
      import: langgraph.func
      signature: '@task(name=None, retry_policy=None, cache_policy=None, timeout=None)'
      returns: 'A future; `.result()` blocks for the value, and completed results are restored on resume'
      notes:
      - 'inputs and outputs must be serializable when a checkpointer is on; callable only inside an entrypoint or StateGraph node'
      ref: reference:/python/langgraph/func/task
    - id: lg-functional-pitfalls
      name: 'Determinism and idempotency'
      summary: 'Wrap side effects in tasks; keep control flow deterministic across a resume'
      lenses: [reliability, best-practice]
      ref: /oss/python/langgraph/functional-api.md
    - id: lg-functional-compose
      name: 'Compose entrypoints and graphs'
      summary: 'An entrypoint can invoke Graph API graphs and other entrypoints; a nested one inherits the parent checkpointer'
      lenses: [composability, reuse]
      signature: 'result = some_graph.invoke(...); other_entrypoint.invoke(...) inside @entrypoint(checkpointer=cp)'
      notes:
      - 'both APIs share one runtime; an inner @entrypoint() with no checkpointer uses the parent one automatically'
      - 'an entrypoint takes only its first argument as input: pass a dict for several values'
      ref: /oss/python/langgraph/use-functional-api.md
    - id: lg-functional-previous
      name: 'previous and entrypoint.final'
      summary: 'Short-term memory: `previous` holds the last return on the thread; `final(value=, save=)` splits return from saved'
      lenses: [best-practice]
      signature: 'def f(n: int, *, previous: int | None) -> entrypoint.final[int, int]: return entrypoint.final(value=previous or 0, save=n)'
      notes:
      - 'needs a checkpointer and a thread_id; call get_state and get_state_history on the entrypoint like a graph'
      ref: /oss/python/langgraph/use-functional-api.md
    - id: lg-functional-hitl
      name: 'interrupt inside tasks'
      summary: 'Pause for review inside a @task with interrupt(); resume with Command(resume=...) on the same thread'
      lenses: [reliability, security]
      signature: 'feedback = interrupt(payload) inside @task; entrypoint.stream_events(Command(resume=value), config, version="v3")'
      notes:
      - 'completed task results are restored on resume, so earlier tasks do not rerun'
      - 'review_tool_call pattern: interrupt per tool call, then accept, revise (edit args) or reject (append a ToolMessage)'
      ref: /oss/python/langgraph/use-functional-api.md
    - id: lg-functional-timeout-cache
      name: 'Task timeouts and caching'
      summary: '`timeout=` on @task or @entrypoint raises NodeTimeoutError (async only); `cache_policy=CachePolicy(ttl=)` caches a task'
      lenses: [reliability, perf]
      signature: '@task(timeout=1.0, retry_policy=RetryPolicy(retry_on=NodeTimeoutError)); @task(cache_policy=CachePolicy(ttl=120)); @entrypoint(cache=InMemoryCache())'
      notes:
      - 'timeout on a sync function raises when the task or entrypoint is declared; NodeTimeoutError subclasses TimeoutError'
      - 'the default RetryPolicy targets specific network errors; pass retry_on=ValueError (or similar) to retry your own'
      ref: /oss/python/langgraph/use-functional-api.md
- title: 'Persistence and memory'
  sections:
  - id: lg-persistence
    title: 'Checkpointers, threads, durability'
    level: basic
    requires: [lg-graph-core]
    ref: /oss/python/langgraph/checkpointers.md
    entries:
    - id: lg-thread-state
      name: 'Threads and state'
      summary: 'A thread_id keys the checkpoints; read, list and edit state through `StateSnapshot`s'
      lenses: [best-practice]
      signature: get_state(config, *, subgraphs=False); get_state_history(config, *, filter=None, before=None, limit=None); update_state(config, values, as_node=None)
      returns: 'StateSnapshot(values, next, config, metadata, created_at, parent_config, tasks); next == () means finished'
      notes:
      - 'config={"configurable": {"thread_id": "..."}} is mandatory with a checkpointer; add checkpoint_id to read an older snapshot'
      - 'update_state creates a new checkpoint (reducers apply), never edits history; history is newest first'
      - 'checkpoints are written at superstep boundaries; per-task writes survive a sibling failure (pending writes)'
      ref: /oss/python/langgraph/checkpointers.md
    - id: lg-inmemory-saver
      name: 'InMemorySaver'
      summary: 'In-process checkpointer for tests and debugging; lost on restart (`MemorySaver` is the older alias)'
      lenses: [testing]
      import: langgraph.checkpoint.memory
      signature: InMemorySaver(*, serde=None)
      notes:
      - 'with LangSmith Deployment / Agent Server no checkpointer is passed; the managed one is used'
      ref: reference:/python/langgraph.checkpoint/memory/InMemorySaver
    - id: lg-saver-backends
      name: 'Checkpointer libraries'
      summary: 'Base interface in langgraph-checkpoint; Sqlite, Postgres, MongoDB savers are separate installs'
      lenses: [reliability]
      import: langgraph.checkpoint.base
      signature: BaseCheckpointSaver; SqliteSaver / AsyncSqliteSaver; PostgresSaver / AsyncPostgresSaver
      notes:
      - 'async execution (ainvoke, astream) calls aput/aget_tuple/alist; use the Async* savers'
      - 'Postgres is the production choice; Sqlite suits local workflows'
      ref: /oss/python/langgraph/checkpointers.md
    - id: lg-durability
      name: 'Durability modes'
      summary: 'Trade checkpoint write cost for crash safety per call: exit, async (default), sync'
      lenses: [perf, reliability]
      signature: invoke/stream(..., durability="exit" | "async" | "sync")
      options:
      - {name: exit, type: mode, default: null, desc: 'Persist only when the run exits (success, error or interrupt); fastest, no mid-run crash recovery.'}
      - {name: async, type: mode, default: 'default', desc: 'Persist while the next step runs; small risk of a lost write on crash.'}
      - {name: sync, type: mode, default: null, desc: 'Persist before the next step starts; highest durability, some overhead.'}
      ref: /oss/python/langgraph/checkpointers.md
    - id: lg-delta-channel
      name: 'DeltaChannel (beta, >=1.2)'
      summary: 'Store only per-step deltas for append-heavy channels so checkpoint size stops growing with thread length'
      lenses: [perf, cost]
      import: langgraph.channels
      signature: Annotated[list[str], DeltaChannel(bulk_reducer, snapshot_frequency=None)]
      params:
      - {name: reducer, type: 'Callable[[state, Sequence[write]], state]', default: null, desc: 'Bulk reducer over all writes of a step; must be associative, pure and side-effect free.'}
      - {name: snapshot_frequency, type: 'int | None', default: 'None', desc: 'Write a full snapshot every K steps to bound read replay depth.'}
      notes:
      - 'beta: API and on-disk format may change; langgraph<1.2 cannot read delta checkpoints (no downgrade)'
      - 'the reducer runs on reconstruction, not write: no uuid4 or clock reads; do not switch an existing thread delta to non-delta'
      ref: /oss/python/langgraph/pregel.md
    - id: lg-persistence-pitfalls
      name: 'Troubleshooting'
      summary: 'Postgres `thread_id` too long, MemorySaver not durable, unbounded checkpoint growth'
      lenses: [reliability]
      ref: /oss/python/langgraph/persistence.md
    - id: lg-custom-checkpointer
      name: 'Custom checkpointer'
      summary: 'Implement `BaseCheckpointSaver` (put, put_writes, get_tuple, list, delete_thread) and validate with a conformance suite'
      lenses: [testing, reliability]
      signature: BaseCheckpointSaver
      notes:
      - 'pip install langgraph-checkpoint-conformance; validate(...) reports base and extended capabilities'
      - 'async graphs need the a* variants; delta channels need get_delta_channel_history (default provided)'
      ref: /oss/python/langgraph/checkpointers.md
  - id: lg-memory
    title: 'Stores and message-history control'
    level: intermediate
    requires: [lg-persistence]
    ref: /oss/python/langgraph/add-memory.md
    entries:
    - id: lg-store
      name: 'Stores'
      summary: 'Cross-thread key-value memory by namespace tuple, with optional semantic search; `runtime.store` in nodes'
      lenses: [composability]
      import: langgraph.store.memory
      signature: store.put(namespace, key, value, index=None); store.get(namespace, key); store.search(namespace_prefix, /, *, query=None, filter=None, limit=10, offset=0, refresh_ttl=None)
      params:
      - {name: namespace, type: 'tuple[str, ...]', default: null, desc: 'Hierarchical path, e.g. (user_id, "memories"); any length.'}
      - {name: index, type: 'list[str] | bool | None', default: 'None', desc: 'put only: which fields to embed; False stores without embedding.'}
      - {name: query, type: 'str | None', default: 'None', desc: 'Natural-language query; needs a store built with index={embed, dims, fields}.'}
      - {name: filter, type: 'dict | None', default: 'None', desc: 'Key-value match applied to item values.'}
      returns: 'search returns SearchItem list (value, key, namespace, created_at, updated_at)'
      notes:
      - 'the checkpointer is per-thread; the store spans threads; InMemoryStore is for dev, a database store for production'
      ref: /oss/python/langgraph/stores.md
    - id: lg-trim-summarize
      name: 'Short-term memory'
      summary: 'Keep history inside the context window: `trim_messages`, `RemoveMessage` deletes, or summarize old turns'
      lenses: [cost, perf]
      signature: trim_messages(messages, strategy="last", token_counter=count_tokens_approximately, max_tokens=..., start_on="human", end_on=("human","tool")); RemoveMessage(id=...)
      notes:
      - 'RemoveMessage needs a state key using the add_messages reducer; trim inside the model-calling node to leave stored history intact'
      ref: /oss/python/langgraph/add-memory.md
    - id: lg-store-ttl
      name: 'Thread and store TTL'
      summary: 'Expire threads, checkpoints and store items automatically via langgraph.json, with per-thread overrides'
      lenses: [cost, security]
      signature: '"checkpointer": {"ttl": {...}}, "store": {"ttl": {...}}'
      ref: /langsmith/configure-ttl.md
- title: 'Streaming'
  sections:
  - id: lg-streaming
    title: 'In-process streaming'
    level: intermediate
    requires: [lg-graph-core]
    ref: /oss/python/langgraph/event-streaming.md
    entries:
    - id: lg-event-streaming
      name: 'Event streaming (recommended)'
      summary: 'Typed projections (messages, tool_calls, values, subagents, subgraphs, interrupts) from one run object'
      lenses: [best-practice, ux-a11y]
      signature: graph.stream_events(input, config=None, *, version="v3", interrupt_before=None, interrupt_after=None, control=None, transformers=None)
      options:
      - {name: version, type: 'Literal["v1","v2","v3"]', default: '"v2"', desc: 'v3 returns a GraphRunStream with typed projections; v1/v2 yield raw StreamEvent dicts.'}
      - {name: transformers, type: 'Sequence[Callable[[scope], Any]] | None', default: 'None', desc: 'Extra stream transformers (v3 only), called as factory(scope) and propagated to subgraphs.'}
      returns: 'GraphRunStream: .messages, .values, .output, .tool_calls, .subagents, .subgraphs, .extensions, .interrupts/.interrupted, .interleave(...)'
      notes:
      - 'reference marks v3 experimental (may change) though the guides recommend it; stream_mode and subgraphs are not accepted with v3'
      - 'projections are concurrent: one read does not consume others; use astream_events + asyncio.gather or stream.interleave in sync code'
      - 'stream.subagents lists only named create_agent runs (name=); stream.subgraphs lists every nested graph (label with compile(name=))'
      ref: /oss/python/langgraph/event-streaming.md
    - id: lg-stream-modes
      name: 'Stream modes'
      summary: 'Classic `stream_mode` API: values, updates, messages, custom, checkpoints, tasks, debug'
      lenses: [composability, typing-dx]
      signature: graph.stream(input, config, *, stream_mode=["updates","custom"], subgraphs=False, version="v2")
      options:
      - {name: stream_mode, type: 'StreamMode | Sequence[StreamMode]', default: 'values', desc: 'values full state, updates per-node deltas, messages LLM tokens, custom, checkpoints, tasks, debug.'}
      - {name: version, type: 'Literal["v1","v2"]', default: '"v1"', desc: 'v2 (langgraph>=1.1) yields uniform StreamPart dicts {type, ns, data}; v1 shape varies with options.'}
      notes:
      - 'checkpoints and tasks modes need a checkpointer'
      ref: /oss/python/langgraph/streaming.md
    - id: lg-stream-v2-migrate
      name: 'v2 output'
      summary: '`invoke(version="v2")` returns `GraphOutput(.value, .interrupts)`; dict access and `__interrupt__` are deprecated'
      lenses: [best-practice]
      signature: invoke(..., version="v2") -> GraphOutput(value, interrupts)
      returns: 'GraphOutput; Pydantic or dataclass state is coerced to its class instead of a dict'
      notes:
      - 'result["key"] and result["__interrupt__"] still work but are deprecated; use .value and .interrupts'
      ref: /oss/python/langgraph/streaming.md
    - id: lg-custom-stream
      name: 'Custom data'
      summary: 'Emit progress from inside nodes with `get_stream_writer()`, or add projections with stream transformers'
      lenses: [observability, ux-a11y]
      import: langgraph.config
      signature: 'writer = get_stream_writer(); writer({"status": "..."})'
      returns: 'Chunks arrive under stream_mode="custom" (type "custom" on v2)'
      notes:
      - 'Python < 3.11 async: get_stream_writer does not work (contextvar propagation); take a writer param instead'
      - 'a middleware can declare `transformers = (Factory,)` (langchain>=1.3.2); built-in ToolCallTransformer runs first'
      ref: /oss/python/langgraph/event-streaming.md
    - id: lg-subgraph-stream
      name: 'Subgraph streaming'
      summary: 'Stream from nested graphs: `ns` namespace on StreamPart, `stream.subgraphs`, lifecycle channel'
      lenses: [observability]
      signature: stream(..., subgraphs=True); chunk["ns"]; stream.subgraphs
      ref: /oss/python/langgraph/streaming.md
    - id: lg-stream-transformer
      name: 'StreamTransformer and StreamChannel'
      summary: 'Custom stream projections: a transformer opens a named channel, pushes payloads, may mutate events in place'
      lenses: [observability, security]
      import: langgraph.stream
      signature: 'class T(StreamTransformer): init() -> {"key": StreamChannel("name")}; process(event) -> bool; create_agent(..., transformers=[factory])'
      params:
      - {name: StreamChannel.name, type: 'str | None', default: 'None', desc: 'Named channels are forwarded to clients as custom:<name>; None keeps the channel in-process.'}
      - {name: StreamTransformer.scope, type: 'tuple[str, ...]', default: '()', desc: 'Namespace the mux is scoped to; factories are called as factory(scope).'}
      notes:
      - 'needs langgraph>=1.2; process returns True to keep the event; override aprocess for async work, or self.schedule(coro) for decoupled work'
      - 'async-only transformers raise under sync stream(); a StreamChannel has exactly one subscriber (use tee/atee to fan out)'
      - 'process can redact event["params"]["data"] in place (PII scrubbing) while publishing stats on a side channel'
      ref: /oss/python/langgraph/frontend/custom-stream-channels.md
  - id: lg-frontend
    title: 'Frontend patterns for graphs'
    level: intermediate
    requires: [lg-streaming]
    ref: /oss/python/langgraph/frontend/overview.md
    entries:
    - id: lg-frontend-overview
      name: 'Render graphs in the UI'
      summary: 'useStream exposes stream.subgraphs (per-node cards) and stream.values; same API for createAgent and custom StateGraph'
      lenses: [ux-a11y, observability]
      signature: 'const stream = useStream<typeof graph>({apiUrl, assistantId}); [...stream.subgraphs.values()]'
      notes:
      - 'runtime concepts map to UI: nodes to cards, state keys to regions, checkpoints to inspect or resume, interrupts to approval, subgraphs to detail'
      - 'targets the v1 frontend SDK packages (@langchain/react, vue, svelte, angular); earlier versions need their migration guides'
      ref: /oss/python/langgraph/frontend/overview.md
    - id: lg-frontend-graph-execution
      name: 'Graph execution cards'
      summary: 'Discover nodes via stream.subgraphs, route tokens with useMessages(stream, node), read node.status'
      lenses: [ux-a11y]
      signature: 'useMessages(stream, node: SubgraphDiscoverySnapshot); node.nodeName; node.status'
      notes:
      - 'status is one of pending, running, complete, error; scoped messages avoid assuming node name equals state key'
      - 'use stream.values only for whole-graph state fields; a node card unmounting releases its scoped subscription'
      - 'streamed markdown can be partial (unclosed **), so the renderer must tolerate incomplete syntax'
      ref: /oss/python/langgraph/frontend/graph-execution.md
    - id: lg-frontend-custom-channels
      name: 'useExtension and useChannel'
      summary: 'Read a custom server channel: useExtension gives the latest typed payload, useChannel a bounded buffer of raw events'
      lenses: [observability, typing-dx]
      signature: 'useExtension<T>(stream, "name", target?); useChannel(stream, ["custom:name"], target?, {bufferSize, replay})'
      options:
      - {name: bufferSize, type: 'number | "default"', default: default, desc: 'Cap on buffered events; older ones drop.'}
      - {name: replay, type: bool, default: 'true', desc: 'Replay events already seen when the selector mounts.'}
      notes:
      - 'useExtension takes the bare channel name, useChannel the full custom:<name> id and unwraps event.params.data itself'
      - 'prefer the typed selectors (useMessages, useToolCalls, useValues) for common cases'
      ref: /oss/python/langgraph/frontend/custom-stream-channels.md
- title: 'Control flow'
  sections:
  - id: lg-control
    title: 'Interrupts, time travel, subgraphs'
    level: intermediate
    requires: [lg-persistence]
    ref: /oss/python/langgraph/interrupts.md
    entries:
    - id: lg-interrupt
      name: 'interrupt'
      summary: 'Pause inside a node and hand a JSON payload to the caller; `Command(resume=value)` continues on the same thread'
      lenses: [best-practice, reliability]
      import: langgraph.types
      signature: answer = interrupt(value, *, response_schema=None); graph.invoke(Command(resume=answer), config)
      params:
      - {name: value, type: Any, default: null, desc: 'JSON-serializable payload surfaced to the caller.'}
      - {name: response_schema, type: 'dict | type | None', default: 'None', desc: 'JSON Schema dict (not validated) or Pydantic/TypedDict/dataclass; typed ones validate the resume value.'}
      returns: 'On resume, the value from Command(resume=...) (validated against response_schema when typed)'
      notes:
      - 'needs a checkpointer and a thread_id; payloads surface on stream.interrupts (v3), GraphOutput.interrupts (v2) or __interrupt__ (v1)'
      - 'the node reruns from the top on resume; multiple interrupts in one node match resume values by order'
      ref: reference:/python/langgraph/types/interrupt
    - id: lg-interrupt-rules
      name: 'Rules of interrupts'
      summary: 'No bare try/except around it, stable call order, JSON payloads, idempotent side effects before it'
      lenses: [reliability, best-practice]
      ref: /oss/python/langgraph/interrupts.md
    - id: lg-static-interrupts
      name: 'Static breakpoints'
      summary: 'Pause before or after named nodes without code changes; for debugging and tests'
      lenses: [testing]
      signature: compile(interrupt_before=[...], interrupt_after=[...]) or invoke(..., interrupt_after="node")
      ref: /oss/python/langgraph/interrupts.md
    - id: lg-time-travel
      name: 'Replay and fork'
      summary: 'Re-run from a past checkpoint, or branch it with edited state via `update_state`'
      lenses: [testing, observability]
      signature: graph.invoke(None, snapshot.config); fork = graph.update_state(snapshot.config, values, as_node=None); graph.invoke(None, fork)
      notes:
      - 'replay re-executes later nodes (LLM calls, interrupts fire again); replaying the final checkpoint is a no-op'
      - 'give as_node for parallel branches, a fresh thread, or to skip nodes; update_state forks, it does not roll back'
      ref: /oss/python/langgraph/use-time-travel.md
    - id: lg-subgraphs
      name: 'Subgraphs'
      summary: 'Call a graph inside a node or `add_node(name, sub)`; `compile(checkpointer=None|True|False)` sets its persistence'
      lenses: [composability]
      signature: sub.compile(checkpointer=None | True | False)
      options:
      - {name: None, type: 'per-invocation', default: 'default', desc: 'Fresh state each call; inherits the parent checkpointer so interrupts and durable execution work within a call.'}
      - {name: 'True', type: 'per-thread', default: null, desc: 'State accumulates across calls on a thread; needed for subgraph multi-turn memory.'}
      - {name: 'False', type: stateless, default: null, desc: 'No checkpointing: no interrupts or durability; behaves like a plain function call.'}
      notes:
      - 'calling the same per-thread subgraph repeatedly in one node, or several per-thread ones, clashes on checkpoint namespace; use per-invocation'
      - 'get_state(config, subgraphs=True) inspects subgraph state; the parent needs a checkpointer for any of this'
      ref: /oss/python/langgraph/use-subgraphs.md
- title: 'Runtime internals, testing, production'
  sections:
  - id: lg-production
    title: 'Testing and operating graphs'
    level: intermediate
    requires: [lg-graph-core]
    ref: /oss/python/langgraph/test.md
    entries:
    - id: lg-testing
      name: 'Testing'
      summary: 'Build a fresh graph per test, compile with a new `InMemorySaver`, test nodes via `graph.nodes`, partial runs via `update_state`'
      lenses: [testing]
      signature: graph.compile(checkpointer=InMemorySaver()); graph.nodes["n"].invoke(state); update_state(cfg, values, as_node="prev"); invoke(None, cfg, interrupt_after="n")
      notes:
      - 'graph.nodes["n"].invoke bypasses the checkpointer'
      ref: /oss/python/langgraph/test.md
    - id: lg-pregel
      name: 'Pregel runtime'
      summary: 'Compiled graphs are `Pregel` instances over channels; the channel types decide how updates merge'
      lenses: [typing-dx]
      import: langgraph.pregel
      signature: Pregel; channels LastValue, Topic, BinaryOperatorAggregate, DeltaChannel
      notes:
      - 'LastValue keeps the latest write; Topic is a pub/sub queue; BinaryOperatorAggregate applies a reducer; DeltaChannel stores deltas'
      ref: /oss/python/langgraph/pregel.md
    - id: lg-backward-compat
      name: 'Backward compatibility'
      summary: 'Changing nodes and state while threads are in flight; resume uses saved state with the graph you compile now'
      lenses: [reliability]
      ref: /oss/python/langgraph/backward-compatibility.md
    - id: lg-app-structure
      name: 'Application structure'
      summary: 'Project layout, `langgraph.json`, dependency files, env vars for an Agent Server app'
      lenses: [best-practice]
      ref: /oss/python/langgraph/application-structure.md
    - id: lg-observability
      name: 'LangSmith tracing'
      summary: 'Set `LANGSMITH_TRACING=true`; one graph run is one trace, with child runs per node'
      lenses: [observability]
      signature: LANGSMITH_TRACING=true
      notes:
      - 'set thread_id on all runs in a conversation for thread filtering and evals'
      - 'LANGSMITH_TRACING=false sends no traces from a local dev Agent Server; Studio still connects (see /langsmith/faq)'
      ref: /oss/python/langgraph/observability.md
- title: 'Agent Server (langgraph-api)'
  sections:
  - id: lg-server-config
    title: 'langgraph.json and graph registration'
    level: basic
    requires: [lg-app-structure]
    ref: /langsmith/application-structure.md
    entries:
    - id: lg-json-config
      name: 'langgraph.json'
      summary: 'CLI config declaring dependencies, graphs, env, Python version, auth, store, checkpointer, http, webhooks'
      lenses: [best-practice, reuse]
      signature: '{"dependencies": ["."], "graphs": {"id": "./path.py:var"}, "env": ".env", "python_version": "3.13"}'
      options:
      - {name: dependencies, type: 'list[str]', default: null, desc: 'Required: "." for local packages, a dir with pyproject/requirements, or package names.'}
      - {name: graphs, type: 'dict[str, str]', default: null, desc: 'Required: graph id to "./file.py:variable" (CompiledStateGraph or factory).'}
      - {name: python_version, type: str, default: '3.11', desc: '3.11, 3.12 or 3.13.'}
      - {name: auth, type: object, default: null, desc: 'path to a langgraph_sdk.Auth instance, e.g. ./auth.py:auth.'}
      - {name: store, type: object, default: null, desc: 'index (embed, dims, fields) for semantic search and/or ttl for the BaseStore.'}
      - {name: checkpointer, type: object, default: null, desc: 'backend "default" (Postgres) | "mongo" | "custom", plus path and ttl.'}
      - {name: http, type: object, default: null, desc: 'app (custom Starlette/FastAPI), cors, configurable_headers, logging_headers, disable_* flags.'}
      - {name: api_version, type: str, default: 'latest', desc: 'Pin the server release, e.g. "0.3".'}
      notes:
      - 'schema: https://langgra.ph/schema.json (add as "$schema")'
      ref: /langsmith/cli.md
    - id: lg-graph-export
      name: 'Graph entry'
      summary: '`"graphs": {"id": "./path.py:var"}`; var is a `CompiledStateGraph` or a factory; the id is the assistant id'
      lenses: [best-practice]
      signature: '"graphs": {"id": "./path.py:var"}'
      ref: /langsmith/application-structure.md
    - id: lg-graph-factory
      name: 'Rebuild per run'
      summary: 'Graph factory that rebuilds the graph for each run, with an optional `ServerRuntime` argument (user, store, access_context)'
      lenses: [composability, security]
      notes:
      - 'beta; needs langgraph-api>=0.7.31 and langgraph-sdk>=0.3.5; prefer conditioning on config inside nodes when topology is the same'
      - 'also called for threads.update, threads.read and assistants.read; runtime.execution_runtime is None outside threads.create_run; topology must match'
      - 'an async context manager factory may wrap its yield in a context manager (e.g. tracing_context) to scope per-run tracing; see /langsmith/conditional-tracing'
      - 'signature may take (config: RunnableConfig), (runtime: ServerRuntime) or both; the server injects by type annotation'
      ref: /langsmith/graph-rebuild.md
    - id: lg-server-persistence
      name: 'Server persistence'
      summary: 'Postgres by default; `checkpointer.backend` can be `mongo` or `custom`; `langgraph dev` keeps state in memory and pickles it'
      lenses: [reliability]
      ref: /langsmith/configure-checkpointer.md
  - id: lg-server-api
    title: 'Threads, runs, streaming over HTTP'
    level: intermediate
    requires: [lg-server-config]
    ref: /langsmith/agent-server.md
    entries:
    - id: lg-server-threads
      name: 'Threads'
      summary: 'Create, get, update, delete, search, copy; read state and history; status idle, busy, interrupted, error'
      lenses: [best-practice, perf]
      signature: client.threads.search(*, metadata=None, values=None, ids=None, status=None, limit=10, offset=0, sort_by=None, sort_order=None, select=None, extract=None)
      options:
      - {name: metadata, type: Json, default: 'None', desc: 'Filter on thread metadata (used for titles and archive flags).'}
      - {name: status, type: 'Literal["idle","busy","interrupted","error"] | None', default: 'None', desc: 'Filter by thread status.'}
      - {name: select, type: 'list[str] | None', default: 'None', desc: 'Fields to return; without it search returns full state values (heavy).'}
      - {name: extract, type: 'dict[str, str] | None', default: 'None', desc: 'Alias to JSONB path, e.g. {"last": "values.messages[-1]"}; max 10 paths.'}
      - {name: limit, type: int, default: '10', desc: 'Page size; pair with offset.'}
      returns: 'list[Thread]'
      ref: reference:/python/langgraph-sdk/_async/threads/ThreadsClient/search
    - id: lg-server-runs
      name: 'Runs'
      summary: 'Create (background), stream, wait, join, cancel (interrupt or rollback); `on_disconnect="cancel"` frees abandoned runs'
      lenses: [reliability, cost]
      signature: client.runs.cancel(thread_id, run_id, *, wait=False, action="interrupt")
      options:
      - {name: action, type: 'Literal["interrupt","rollback"]', default: '"interrupt"', desc: 'interrupt keeps the run record and checkpoints; rollback deletes the run and its progress.'}
      - {name: wait, type: bool, default: 'False', desc: 'Block until the run has actually stopped.'}
      - {name: on_disconnect, type: 'Literal["cancel","continue"] | None', default: 'None', desc: 'On runs.stream/wait/join: cancel the run when the client disconnects.'}
      notes:
      - 'only pending or running runs can be cancelled; cancelling others errors'
      - 'runs.stream also takes stream_resumable, multitask_strategy, if_not_exists, durability, on_completion, webhook, version'
      ref: /langsmith/cancel-run.md
    - id: lg-multitask
      name: 'Double texting'
      summary: 'What happens when a run starts on a busy thread: `multitask_strategy` enqueue (default), reject, interrupt, rollback'
      lenses: [reliability, ux-a11y]
      signature: runs.create/stream(..., multitask_strategy="enqueue" | "reject" | "interrupt" | "rollback")
      options:
      - {name: enqueue, type: strategy, default: 'default', desc: 'Queue new runs; run them in order after the current one finishes.'}
      - {name: reject, type: strategy, default: null, desc: 'Refuse new runs while one is active.'}
      - {name: interrupt, type: strategy, default: null, desc: 'Halt the active run, keep its progress, continue from that state with the new input.'}
      - {name: rollback, type: strategy, default: null, desc: 'Halt the active run and revert everything including its input, then run the new input fresh.'}
      notes:
      - 'server feature only, absent from OSS langgraph'
      - 'interrupt can leave a tool call started but unanswered; the graph must tolerate or strip partial tool calls'
      ref: /langsmith/double-texting.md
    - id: lg-thread-stream
      name: 'Thread stream'
      summary: '`GET /threads/{id}/stream`, modes `run_modes|lifecycle|state_update`, resumable with `Last-Event-ID` (`-` replays)'
      lenses: [reliability, ux-a11y]
      signature: GET /threads/{id}/stream, run_modes|lifecycle|state_update, Last-Event-ID, -
      ref: /langsmith/streaming.md
    - id: lg-run-streaming
      name: 'Run streaming'
      summary: 'Server stream modes values, updates, messages-tuple, debug, custom, events; subgraphs; rejoin with `join_stream`'
      lenses: [ux-a11y]
      signature: runs.stream(thread_id, assistant_id, *, input, stream_mode="values", stream_subgraphs=False, stream_resumable=False, version="v1")
      returns: 'AsyncIterator of StreamPart (v1) or typed {type, ns, data} dicts (v2)'
      ref: /langsmith/streaming.md
    - id: lg-stateless-background
      name: 'Stateless and background runs'
      summary: '`/runs/stream` with `thread_id=None` makes a throwaway thread; `runs.create` then `join` for background work'
      lenses: [perf]
      signature: runs.stream(None, assistant_id, ..., on_completion="delete" | "keep"); runs.create(...); runs.join(thread_id, run_id)
      ref: /langsmith/stateless-runs.md
    - id: lg-crons
      name: 'Cron jobs'
      summary: 'Thread-bound or stateless schedules; delete threads left behind by stateless crons'
      lenses: [cost, reliability]
      ref: /langsmith/cron-jobs.md
    - id: lg-webhooks
      name: 'Webhooks'
      summary: 'Run-completion callbacks; `LG_WEBHOOK_` header templates, `webhooks.url` `allowed_domains` and `require_https`'
      lenses: [security, composability]
      ref: /langsmith/use-webhooks.md
    - id: lg-remote-graph
      name: 'RemoteGraph'
      summary: 'Use a deployed graph as a local graph, node or subgraph; same interface as a compiled graph'
      lenses: [composability]
      import: langgraph.pregel.remote
      signature: RemoteGraph(assistant_id, /, *, url=None, api_key=None, headers=None, client=None, sync_client=None, config=None, name=None, distributed_tracing=False)
      params:
      - {name: assistant_id, type: str, default: null, desc: 'Assistant id or graph name on the remote server.'}
      - {name: api_key, type: 'str | None', default: 'env', desc: 'Falls back to LANGGRAPH_API_KEY, LANGSMITH_API_KEY, then LANGCHAIN_API_KEY.'}
      - {name: distributed_tracing, type: bool, default: 'False', desc: 'Send LangSmith distributed-tracing headers so traces link across services.'}
      returns: 'A PregelProtocol object: invoke, stream, get_state, update_state; add_node(remote_graph) makes it a node'
      ref: reference:/python/langgraph/pregel/remote/RemoteGraph
    - id: lg-server-mcp-a2a
      name: 'MCP and A2A endpoints'
      summary: 'Graphs are exposed as MCP tools and A2A agents; `http.disable_mcp` and `disable_a2a` turn them off'
      lenses: [composability, security]
      ref: /langsmith/server-mcp.md
    - id: lg-python-sdk
      name: 'langgraph_sdk'
      summary: 'Async HTTP client for the Agent Server with assistants, threads, runs, crons and store sub-clients'
      lenses: [reuse]
      import: langgraph_sdk
      signature: get_client(*, url=None, api_key=NOT_PROVIDED, headers=None, timeout=None)
      params:
      - {name: url, type: 'str | None', default: 'None', desc: 'Server base URL; None connects in-process, only valid inside the Agent Server.'}
      - {name: api_key, type: 'str | None', default: 'env', desc: 'Auto-loads LANGGRAPH_API_KEY, LANGSMITH_API_KEY, LANGCHAIN_API_KEY; pass None to skip.'}
      - {name: timeout, type: 'TimeoutTypes | None', default: 'connect 5, read 300, write 300, pool 5', desc: 'httpx Timeout, float seconds, or (connect, read, write, pool).'}
      returns: 'LangGraphClient: client.threads, client.runs, client.assistants, client.crons, client.store'
      notes:
      - 'the TS twin is @langchain/langgraph-sdk'
      ref: reference:/python/langgraph-sdk/_async/client/get_client
  - id: lg-server-extend
    title: 'Auth and customization'
    level: advanced
    requires: [lg-server-config]
    ref: /langsmith/auth.md
    entries:
    - id: lg-custom-auth
      name: 'Custom auth'
      summary: 'Authenticate every request with `@auth.authenticate` on a `langgraph_sdk.Auth` instance named in `auth.path`'
      lenses: [security]
      import: langgraph_sdk
      signature: 'auth = Auth(); @auth.authenticate async def f(authorization: str) -> Auth.types.MinimalUserDict'
      returns: 'A user dict with identity and permissions; raise Auth.exceptions.HTTPException(401) to reject'
      notes:
      - 'authentication runs on every request before authorization handlers'
      ref: /langsmith/custom-auth.md
    - id: lg-resource-auth
      name: 'Resource authorization'
      summary: '`@auth.on` handlers per resource and action; return a metadata filter or mutate the value to scope access'
      lenses: [security]
      signature: '@auth.on; @auth.on.threads.create; @auth.on.threads.read -> {"owner": ctx.user.identity}'
      notes:
      - 'most specific handler wins: resource+action, then resource, then global @auth.on; with no global handler the request is accepted'
      - 'add a deny-all global handler for default-deny'
      ref: /langsmith/resource-auth.md
    - id: lg-custom-routes
      name: 'Custom HTTP'
      summary: '`http.app` (Starlette/FastAPI) adds routes; also `cors`, header passthrough, `enable_custom_route_auth`, `disable_*` flags'
      lenses: [composability, security]
      signature: http.app, cors, configurable_headers, logging_headers, enable_custom_route_auth, disable_*
      ref: /langsmith/custom-routes.md
    - id: lg-custom-middleware
      name: 'Server middleware'
      summary: 'ASGI middleware on `http.app`; `middleware_order` is `middleware_first` (default) or `auth_first`'
      lenses: [composability, security]
      ref: /langsmith/custom-middleware.md
    - id: lg-lifespan
      name: 'Lifespan events'
      summary: 'Startup and shutdown hooks on the custom app, for pools and clients'
      lenses: [reliability]
      ref: /langsmith/custom-lifespan.md
    - id: lg-server-env
      name: 'Environment variables'
      summary: 'Self-hosted server settings: DB and Redis URIs, workers, scaling'
      lenses: [perf, reliability]
      ref: /langsmith/env-var-self-hosted.md
- title: 'CLI, local development, deployment'
  sections:
  - id: lg-cli-flow
    title: 'Run and ship the server'
    level: basic
    requires: [lg-server-config]
    ref: /langsmith/cli.md
    entries:
    - id: lg-dev
      name: 'langgraph dev'
      summary: 'Lightweight in-memory hot-reload Agent Server on port 2024, no Docker; state pickled to a local dir'
      lenses: [testing, best-practice]
      signature: langgraph dev [-c FILE] [--host H] [--port 2024] [--no-reload] [--no-browser] [--allow-blocking] [--tunnel] [--debug-port N] [--wait-for-client]
      options:
      - {name: --port, type: int, default: '2024', desc: 'Port to bind; host defaults to 127.0.0.1.'}
      - {name: --allow-blocking, type: flag, default: 'False', desc: 'Do not raise on synchronous blocking I/O in async code (langgraph-cli>=0.2.6).'}
      - {name: --tunnel, type: flag, default: 'False', desc: 'Expose via Cloudflare tunnel for remote frontends or Safari.'}
      - {name: --no-browser, type: flag, default: 'False', desc: 'Do not open Studio on start.'}
      - {name: --studio-url, type: str, default: smith.langchain.com, desc: 'Studio instance to connect to.'}
      notes:
      - 'sync blocking calls inside async code raise unless --allow-blocking'
      ref: /langsmith/cli.md
    - id: lg-local-server
      name: 'Run a local server'
      summary: '`langgraph new` from a template, install editable, copy `.env.example`, `langgraph dev`, test in Studio or the SDK'
      lenses: [testing, reuse]
      signature: langgraph new PATH --template new-langgraph-project-python; uv sync; langgraph dev
      notes:
      - 'Studio URL is https://smith.langchain.com/studio/?baseUrl=<server>; Safari needs --tunnel'
      - 'threadless run: client.runs.stream(None, "agent", input={"messages": [...]}) with langgraph_sdk get_client (async) or get_sync_client'
      - 'the dev server is in-memory, for development and testing only'
      ref: /oss/python/langgraph/local-server.md
    - id: lg-up
      name: 'langgraph up'
      summary: 'Docker build with Postgres and Redis on port 8123; production-like check, `--watch` restarts on file changes'
      lenses: [testing, reliability]
      signature: langgraph up [-p 8123] [--wait] [--watch] [--image TEXT] [--postgres-uri TEXT] [--pull/--no-pull] [--recreate]
      notes:
      - 'custom auth under `up` needs a license key; needs Docker running'
      ref: /langsmith/cli.md
    - id: lg-build
      name: 'langgraph build / dockerfile'
      summary: 'Build the server image (`build -t tag [--platform]`) or emit its Dockerfile'
      lenses: [reuse]
      signature: langgraph build -t TAG [--platform P]; langgraph dockerfile PATH
      options:
      - {name: dockerfile_lines, type: 'list[str]', default: null, desc: 'langgraph.json: extra Dockerfile lines after the base image import.'}
      - {name: image_distro, type: str, default: debian, desc: 'langgraph.json: debian, wolfi, bookworm or bullseye (langgraph-cli>=0.2.11).'}
      - {name: pip_installer, type: str, default: auto, desc: 'langgraph.json: auto, pip or uv (uv pip is the default since 0.3).'}
      ref: /langsmith/cli.md
    - id: lg-deploy
      name: 'langgraph deploy'
      summary: 'Beta: build and push to LangSmith Deployment; subcommands list, logs, delete; `--deployment-type`'
      lenses: [reliability]
      signature: langgraph deploy [--image TEXT --push-to REGISTRY] | list | logs | delete
      notes:
      - 'beta; needs Docker (Buildx on Apple silicon); --image must target linux/amd64'
      ref: /langsmith/deployment-quickstart.md
    - id: lg-deploy-cloud
      name: 'Deploy to LangSmith Cloud'
      summary: 'Push the app to GitHub, create a deployment in LangSmith, test in Studio, call the API URL with an API key'
      lenses: [reliability]
      signature: 'langgraph_sdk.get_sync_client(url=DEPLOYMENT_URL, api_key=KEY).runs.stream(None, "agent", input=..., stream_mode="updates")'
      notes:
      - 'the repo (public or private) must be LangGraph-compatible first; first deployment takes about 15 minutes'
      - 'REST callers send an X-Api-Key header to POST <DEPLOYMENT_URL>/runs/stream'
      ref: /oss/python/langgraph/deploy.md
    - id: lg-standalone
      name: 'Self-host standalone server'
      summary: 'Docker, Compose or Kubernetes without the control plane; needs Postgres and Redis'
      lenses: [reliability, cost]
      ref: /langsmith/deploy-standalone-server.md
    - id: lg-cli-telemetry
      name: 'CLI analytics'
      summary: 'One event per command; opt out with `LANGGRAPH_CLI_NO_ANALYTICS=1`'
      lenses: [security]
      ref: /langsmith/data-storage-and-privacy.md
