stack: omniroute
version: "3.8.51"
docs_base: https://github.com/diegosouzapw/OmniRoute
source: github.com/diegosouzapw/OmniRoute at tag 3.8.51 (docs + src + open-sse, cloned)
fetched: 2026-10-05
verified: 2026-10-05
toc:
- index: 'https://api.github.com/repos/diegosouzapw/OmniRoute/git/trees/v3.8.51?recursive=1'
  match: '/blob/3\.8\.51/docs/.*\.md$'
  exclude: '/docs/i18n/'
  why: machine-translated copies of the English docs
  base: 'https://github.com/diegosouzapw/OmniRoute/blob/3.8.51'
groups:
- title: 'AI tooling'
  sections:
  - id: ai-tooling
    title: 'Repo-shipped AI tooling'
    level: basic
    requires: []
    ref: /blob/3.8.51/AGENTS.md
    entries:
    - id: mcp-server
      name: 'MCP server'
      summary: 'Built-in MCP server (110 tools) over stdio or HTTP; use it to let an agent drive routing, cache, memory and skills.'
      lenses: [composability, security]
      signature: 'omniroute --mcp'
      options:
      - {name: mcpEnabled, type: bool, default: 'false', desc: 'Setting that gates the HTTP transports; flip with `omniroute mcp enable [--transport stdio|sse|streamable-http]`.'}
      - {name: mcpTransport, type: 'sse|streamable-http', default: null, desc: 'Active HTTP transport: /api/mcp/sse or /api/mcp/stream (mcp-session-id header); switching closes the other''s sessions.'}
      notes: ['/api/mcp/* is loopback-only unless the Bearer key carries the `manage` scope', '`omniroute mcp status|enable|disable|restart` CLI parity arrived in 3.8.51']
      ref: /blob/3.8.51/docs/frameworks/MCP-SERVER.md
    - id: agent-skills
      name: 'Generated agent skills'
      summary: 'Generated SKILL.md catalog teaching agents the REST API and CLI; read it live from the API or the repo skills dir.'
      lenses: [reuse, composability]
      signature: 'GET /api/agent-skills?category=api|cli&area=<name>'
      params:
      - {name: category, type: 'api|cli', default: null, desc: 'Filter the catalog by skill kind.'}
      - {name: area, type: string, default: null, desc: 'Filter by functional area.'}
      returns: '`{skills, count, coverage}`; each skill maps to `skills/<id>/SKILL.md` (also fetchable from GitHub raw).'
      notes: [auto-generated; diff before locking, docs say 45 skills while the dir has more]
      ref: /blob/3.8.51/docs/frameworks/AGENT-SKILLS.md
    - id: agents-md
      name: 'AGENTS.md'
      summary: 'Contributor agent guide (plus CLAUDE.md, GEMINI.md) with 23 Hard Rules; not an integration manual.'
      lenses: [best-practice]
      notes: ['contributor rules, not integration docs']
      ref: /blob/3.8.51/AGENTS.md
    - id: openapi-spec
      name: 'OpenAPI spec'
      summary: 'Hand-maintained OpenAPI 3.1 file, also served parsed as a JSON catalog; verify routes against source.'
      lenses: [typing-dx, testing]
      signature: 'GET /api/openapi/spec'
      returns: 'Structured JSON catalog parsed from the repo OpenAPI yaml.'
      notes: ['file header says version 3.8.35 at tag 3.8.51 and lists ~200 paths: stale, trust route source']
      ref: /blob/3.8.51/public/openapi.yaml
    - id: a2a-server
      name: 'A2A server'
      summary: 'Agent-to-agent protocol server exposed at `/a2a` and `/api/a2a`.'
      lenses: [composability]
      ref: /blob/3.8.51/docs/frameworks/A2A-SERVER.md
    - id: no-llms-txt
      name: 'llms.txt'
      summary: 'No llms.txt shipped at the tag.'
      lenses: [best-practice]
      ref: /blob/3.8.51/docs/reference/API_REFERENCE.md
- title: 'Inference surface'
  sections:
  - id: inference-api
    title: 'OpenAI-compatible /v1'
    level: basic
    requires: []
    ref: /blob/3.8.51/docs/reference/API_REFERENCE.md
    entries:
    - id: chat-completions
      name: 'Chat completions'
      summary: 'OpenAI-compatible `POST /v1/chat/completions`, Bearer `sk-` key; model is a provider id, combo name or `auto`.'
      lenses: [reuse, composability]
      signature: 'POST /v1/chat/completions {model, messages, stream}'
      params:
      - {name: model, type: string, default: null, desc: '`<provider>/<id>`, a combo name, or `auto[/variant]`; bare provider ids misroute.'}
      - {name: messages, type: array, default: null, desc: 'OpenAI-format messages; tools and reasoning fields pass through to the upstream shape.'}
      - {name: stream, type: bool, default: null, desc: 'true returns SSE; the gateway sends an early keepalive so a slow upstream does not time clients out.'}
      returns: 'OpenAI-format completion or SSE; non-stream responses add X-OmniRoute-* routing and cost headers.'
      notes: [image sets `REQUIRE_API_KEY=true`]
      ref: /blob/3.8.51/docs/reference/API_REFERENCE.md
    - id: model-id-format
      name: 'Model ids'
      summary: 'Model ids are `<provider>/<id>`; the first segment is the provider alias, so bare ids misroute.'
      lenses: [reliability, typing-dx]
      signature: 'model: "<provider>/<id>"'
      notes: ['ids with their own slash (qwen/.., @cf/..) still need the provider prefix: openrouter/deepgram/nova-3']
      ref: /blob/3.8.51/src/lib/combos/steps.ts
    - id: models-prefix-mode
      name: 'Model id prefixes'
      summary: '`GET /v1/models?prefix=` picks alias, dual or canonical id forms; server default is the `MODELS_CATALOG_PREFIX_MODE` flag.'
      lenses: [ux-a11y, reuse]
      signature: 'GET /v1/models?prefix=<alias|dual|canonical>'
      params:
      - {name: prefix, type: 'alias|dual|canonical', default: dual, desc: 'dual lists both forms (mirrors carry `parent`); alias short prefix only; canonical full provider-id prefix.'}
      returns: 'OpenAI-format list of models and combos.'
      notes: ['`REQUIRE_API_KEY` does not gate GET /v1/models; it follows the dashboard login posture']
      ref: /blob/3.8.51/docs/reference/API_REFERENCE.md
    - id: request-headers
      name: 'Request headers'
      summary: 'Per-request switches for cache, memory injection, session tagging and 5-second idempotent dedup.'
      lenses: [cost, reliability]
      signature: 'X-OmniRoute-No-Cache: true'
      options:
      - {name: X-OmniRoute-No-Cache, type: bool, default: null, desc: 'true bypasses the semantic cache for this request.'}
      - {name: x-omniroute-no-memory, type: bool, default: null, desc: 'true skips memory and skills injection for this request.'}
      - {name: X-OmniRoute-Session-Id, type: string, default: null, desc: 'Caller session tag stored verbatim in call logs for per-session cost attribution.'}
      - {name: Idempotency-Key, type: string, default: null, desc: 'Dedup key with a 5 s window; X-Request-Id works as an alternative.'}
      notes: [first two sent always]
      ref: /blob/3.8.51/docs/reference/API_REFERENCE.md
    - id: response-headers
      name: 'Response headers'
      summary: 'Routing and cost telemetry on responses: decision trace, served model and provider, cost, tokens, fallback attempts.'
      lenses: [observability, cost]
      signature: 'X-OmniRoute-Decision: strategy=<name>; provider=<alias>; latency_ms=<n>'
      options:
      - {name: X-OmniRoute-Model, type: header, default: null, desc: 'Model actually served; with -Provider it shows which combo target answered.'}
      - {name: X-OmniRoute-Response-Cost, type: header, default: null, desc: 'USD, 10 decimals; 0 for free/unpriced models and cache hits.'}
      - {name: X-OmniRoute-Fallback-Attempts, type: header, default: null, desc: 'Present only when greater than 0.'}
      - {name: X-OmniRoute-Cache, type: 'HIT|MISS', default: null, desc: 'Semantic-cache result (non-streaming).'}
      notes: [non-stream only]
      ref: /blob/3.8.51/docs/reference/API_REFERENCE.md
    - id: compression-request-header
      name: 'Compression header'
      summary: '`x-omniroute-compression` overrides the compression plan for one request; highest precedence but cannot enable a disabled master switch.'
      lenses: [cost, perf]
      signature: 'x-omniroute-compression: <off|default|safe|allow-lossy|engine:<id>|<combo>>'
      returns: 'Echoed as `X-OmniRoute-Compression: <mode>; source=<source>`; unknown values are ignored, never rejected.'
      notes: [a combo named off or default must be referenced by id]
      ref: /blob/3.8.51/docs/reference/API_REFERENCE.md
    - id: auto-combo-controls
      name: 'Auto-combo controls'
      summary: '`X-OmniRoute-Mode`, `-Budget`, `-Budget-Fallback`, `-Effort` steer the `auto` strategy per request.'
      lenses: [cost, perf]
      signature: 'X-OmniRoute-Mode: <fast|balanced|quality|cheap|reliable|offline>'
      options:
      - {name: X-OmniRoute-Budget, type: number, default: null, desc: 'Max USD per request; costlier candidates are filtered out before selection.'}
      - {name: X-OmniRoute-Budget-Fallback, type: 'cheapest|strict', default: cheapest, desc: 'strict fails fast with HTTP 402 when every candidate exceeds the budget.'}
      - {name: X-OmniRoute-Effort, type: auto, default: null, desc: 'Adaptive reasoning_effort when the request has no reasoning field; OpenAI-shaped upstream targets only.'}
      ref: /blob/3.8.51/docs/routing/AUTO-COMBO.md
    - id: other-surfaces
      name: 'Other surfaces'
      summary: 'Embeddings, images, OCR, files, batches, search, WebSocket, Responses and `/v1/messages` endpoints.'
      lenses: [composability]
      ref: /blob/3.8.51/docs/reference/API_REFERENCE.md
- title: 'Combos and routing'
  sections:
  - id: combos
    title: 'Combos'
    level: intermediate
    requires: [inference-api]
    ref: /blob/3.8.51/docs/routing/AUTO-COMBO.md
    entries:
    - id: combo-strategies
      name: 'Strategies'
      summary: 'Combo `strategy` enum has 20 values (docs say 19); `priority` is the default ordered failover.'
      lenses: [best-practice, reliability]
      options:
      - {name: strategy, type: enum, default: priority, desc: 'priority, weighted, round-robin, fill-first, p2c, random, least-used, cost-optimized, auto, lkgp, fusion, pipeline and more.'}
      notes: ['`quota-weighted` is in the enum but absent from the docs table', 'fusion fans out to a panel then judges; pipeline threads each step output into the next']
      ref: /blob/3.8.51/src/shared/constants/routingStrategies.ts
    - id: combo-api
      name: 'Combo CRUD'
      summary: '`POST /api/combos` creates a named, ordered model list with a strategy; `PUT /api/combos/:id` edits it.'
      lenses: [reliability]
      signature: 'POST /api/combos {name, models, strategy, config}'
      params:
      - {name: name, type: string, default: null, desc: 'Required, max 100 chars of letters, digits, space and - _ / . [ ]; duplicate name returns 400.'}
      - {name: models, type: array, default: null, desc: 'Required, at least 1 entry: string, step object or `{kind: combo-ref, comboName}`.'}
      - {name: strategy, type: enum, default: priority, desc: 'Routing strategy for the targets.'}
      - {name: config, type: object, default: null, desc: 'Runtime config (retries, timeouts, attempts); non-strict, so unknown keys are kept.'}
      - {name: allowedProviders, type: array, default: null, desc: 'Create/update-time invariant on step providers only, not a runtime filter.'}
      returns: '201 combo record (adds `warning` if the name equals a real model id); `GET` returns `{combos,total}`.'
      notes: ['PUT merges over the stored record; null clears a field; models cannot be emptied']
      ref: /blob/3.8.51/src/app/api/combos/route.ts
    - id: combo-step-normalization
      name: 'Step shape'
      summary: 'Steps are normalized on store; the stored form has providerId and a full model string but no `provider` key.'
      lenses: [typing-dx, testing]
      signature: 'models: [{model: "<provider>/<id>", providerId, connectionId, weight}]'
      params:
      - {name: model, type: string, default: null, desc: 'Max 300 chars; kept verbatim if it contains "/", else prefixed with providerId.'}
      - {name: providerId, type: string, default: null, desc: 'Input alias `provider` is accepted and folded into providerId; never stored.'}
      - {name: connectionId, type: 'string|null', default: null, desc: 'Pins the step to one connection; null uses the whole active pool.'}
      - {name: weight, type: number, default: '0', desc: '0-100; used by the weighted strategy.'}
      returns: 'Stored step `{kind:"model", model, providerId, connectionId, id, weight}`; id is auto-built when absent.'
      notes: ['`provider/pattern*` strings become kind provider-wildcard steps', 'combo-ref steps nest combos up to maxComboDepth (default 3)', fakes must match]
      ref: /blob/3.8.51/src/lib/combos/steps.ts
    - id: combo-config
      name: 'Combo config'
      summary: '`config` tunes per-combo retries, per-target and whole-combo timeouts, attempt budget and zero-latency options.'
      lenses: [reliability, perf]
      signature: 'config: {maxRetries, targetTimeoutMs, comboTimeoutMs, maxGlobalAttempts}'
      options:
      - {name: maxRetries, type: 'int 0-10', default: '1', desc: 'Retries per target before failing over.'}
      - {name: retryDelayMs, type: int, default: '2000', desc: 'Delay between retries of one target.'}
      - {name: maxSetRetries, type: 'int 0-10', default: null, desc: 'Retries of the whole target set after every target failed.'}
      - {name: targetTimeoutMs, type: int, default: null, desc: 'Per-target timeout; 0 disables it.'}
      - {name: comboTimeoutMs, type: int, default: '0', desc: 'Whole-combo wall-clock budget; 0 is unlimited but a 10-minute loop safety stop still applies.'}
      - {name: maxGlobalAttempts, type: 'int 1-200', default: '30', desc: 'Shared per-request attempt budget across all targets.'}
      - {name: hedging, type: bool, default: null, desc: 'Race targets; auto-sets zeroLatencyOptimizationsEnabled when true.'}
      - {name: compressionMode, type: enum, default: null, desc: 'off, lite, standard, aggressive, ultra, rtk, stacked, codex-responses or omniglyph for this combo.'}
      ref: /blob/3.8.51/src/shared/validation/schemas/combo.ts
    - id: auto-combo
      name: 'Auto combo'
      summary: '`auto/<category>:<tier>` is zero-config routing over connected providers; filters fail open to the full pool.'
      lenses: [cost, perf]
      signature: 'model: "auto/<category>:<tier>"'
      params:
      - {name: category, type: 'coding|reasoning|vision|chat|multimodal', default: null, desc: 'Filters the candidate pool by capability.'}
      - {name: tier, type: 'fast|cheap|reliable|free|pro', default: null, desc: 'Picks scoring weights or a free/premium pool filter.'}
      returns: 'A virtual combo that scores candidates (16 factors, bandit exploration) per request.'
      notes: ['`GET /v1/auto-combo/{channel}/candidates` lists the live candidate pool read-only']
      ref: /blob/3.8.51/docs/routing/AUTO-COMBO.md
    - id: model-combo-mappings
      name: 'Model-to-combo mappings'
      summary: '`/api/model-combo-mappings` redirects a model id pattern to a combo so clients keep their model string.'
      lenses: [composability]
      signature: 'POST /api/model-combo-mappings {pattern, comboId}'
      params:
      - {name: pattern, type: string, default: null, desc: 'Model id pattern, max 500 chars.'}
      - {name: comboId, type: string, default: null, desc: 'Target combo id.'}
      - {name: priority, type: int, default: '0', desc: 'Ordering when several patterns match.'}
      - {name: enabled, type: bool, default: 'true', desc: 'Toggle without deleting.'}
      returns: '201 `{mapping}`; `GET` returns `{mappings,total}`.'
      ref: /blob/3.8.51/src/app/api/model-combo-mappings/route.ts
    - id: combo-test
      name: 'Combo live test'
      summary: '`POST /api/combos/test {comboName}` probes every target through the real dispatch path and reports which one answered.'
      lenses: [testing, observability]
      signature: 'POST /api/combos/test {comboName}'
      params:
      - {name: comboName, type: string, default: null, desc: 'Existing combo name; 404 if unknown, 400 if it has no models.'}
      returns: 'Per-target results (status, latency, error) plus `resolvedBy`.'
      notes: [uses an internally picked active API key; 60 s per target, 180 s total]
      ref: /blob/3.8.51/src/app/api/combos/test/route.ts
- title: 'Management API'
  sections:
  - id: management-api
    title: 'Management API (/api)'
    level: intermediate
    requires: []
    ref: /blob/3.8.51/docs/guides/MANAGEMENT-AUTH.md
    entries:
    - id: management-auth
      name: 'Management auth'
      summary: '`/api/*` accepts a login cookie, CLI token, `oma_live_` token or an `sk-` key with the `manage` scope.'
      lenses: [security]
      signature: 'Authorization: Bearer <sk- key with manage scope>'
      notes: [inference keys cannot manage]
      ref: /blob/3.8.51/docs/guides/MANAGEMENT-AUTH.md
    - id: admin-login
      name: 'Admin login'
      summary: '`POST /api/auth/login` exchanges the admin password for an `auth_token` cookie that authorizes `/api/*`.'
      lenses: [security]
      signature: 'POST /api/auth/login {password}'
      params:
      - {name: password, type: string, default: null, desc: '1-200 chars; the default CHANGEME is refused off-loopback.'}
      returns: '200 `{success:true}` + 30-day JWT cookie; 401 wrong password; 429 + Retry-After when locked; 403 if OIDC-only.'
      notes: [500 if JWT_SECRET is unset, image bootstraps it into server.env]
      ref: /blob/3.8.51/src/app/api/auth/login/route.ts
    - id: provider-connections
      name: 'Connections'
      summary: '`/api/providers` creates and lists provider connections (credentials); each starts inactive until a test passes.'
      lenses: [reliability]
      signature: 'POST /api/providers {provider, name, apiKey}'
      params:
      - {name: provider, type: string, default: null, desc: 'Provider id, 1-100 chars (e.g. mistral, openrouter).'}
      - {name: name, type: string, default: null, desc: 'Connection label, max 200 chars.'}
      - {name: apiKey, type: string, default: null, desc: 'Required unless the provider allows keyless use.'}
      - {name: priority, type: 'int 1-100', default: null, desc: 'Connection ordering within the provider.'}
      returns: '201 `{connection}` with `isActive:false`; `GET` returns `{connections,total}`; `POST /api/providers/:id/test` returns `{valid,...}`.'
      notes: ['`:id` in /api/providers/:id/* is the connection id, not the provider id', passing test activates]
      ref: /blob/3.8.51/src/app/api/providers/route.ts
    - id: sync-models
      name: 'Sync models'
      summary: '`POST /api/providers/:id/sync-models` refreshes a connection''s model list; degraded discovery returns 502, a freshness check.'
      lenses: [testing, reliability]
      signature: 'POST /api/providers/:id/sync-models?mode=sync|import'
      params:
      - {name: mode, type: 'sync|import', default: sync, desc: 'import merges discovered models instead of replacing the synced list.'}
      - {name: quiet, type: '1', default: null, desc: 'Skips chatty log lines (boot revalidation path).'}
      returns: '`{ok, syncedModels, availableModelsCount, models, importedModels}`; `models` holds custom rows only; 502 `{error,source,warning}` when degraded.'
      notes: [curated and search providers return `skipped` with empty models]
      ref: /blob/3.8.51/src/app/api/providers/[id]/sync-models/route.ts
    - id: provider-models-list
      name: 'Model ids list'
      summary: '`GET /api/providers/:id/models` lists the discovered model ids for a connection, optionally forcing a refresh.'
      lenses: [reliability]
      signature: 'GET /api/providers/:id/models?refresh=true'
      params:
      - {name: refresh, type: bool, default: 'false', desc: 'Bypass the cache and query the upstream.'}
      - {name: excludeCustom, type: bool, default: 'false', desc: 'Drop user-defined custom models from the list.'}
      - {name: excludeHidden, type: bool, default: 'false', desc: 'Drop models hidden in the dashboard.'}
      - {name: chatOnly, type: bool, default: 'false', desc: 'Only chat-capable models (header x-omniroute-model-surface: chat does the same).'}
      returns: '`{source:"api"|"cache"|"local_catalog", models:[{id}]}`, plus `warning` when degraded.'
      ref: /blob/3.8.51/src/app/api/providers/[id]/models/route.ts
    - id: api-keys
      name: 'API keys'
      summary: '`POST /api/keys` mints an inference key with scoped combo and connection access; the full key is shown once.'
      lenses: [security]
      signature: 'POST /api/keys {name, scopes, allowedCombos, allowedConnections}'
      params:
      - {name: name, type: string, default: null, desc: 'Required label, max 200 chars.'}
      - {name: scopes, type: 'string[]', default: '["self:usage"]', desc: 'Max 32; `manage` makes it a management key; lease:exclusive needs allowedConnections.'}
      - {name: allowedCombos, type: 'string[]', default: '["combo/*"]', desc: 'Combo names or globs the key may call.'}
      - {name: allowedConnections, type: 'uuid[]', default: null, desc: 'Connection ids the key may use; at least 1 when given on create.'}
      - {name: modelAccessMode, type: 'all|restricted', default: all, desc: 'restricted limits direct provider/model calls to allowedModels.'}
      returns: '201 with the full `key` once plus id and policy fields; `GET` returns `{keys (masked), total}`.'
      notes: ['`GET` masks the key']
      ref: /blob/3.8.51/src/app/api/keys/route.ts
    - id: key-access-policy
      name: 'Key policy'
      summary: '`PATCH /api/keys/:id` edits a key''s policy; `connectionAccessMode` is write-only and never read back.'
      lenses: [security]
      signature: 'PATCH /api/keys/:id {connectionAccessMode, allowedConnections, ...}'
      params:
      - {name: connectionAccessMode, type: 'all|restricted', default: null, desc: 'restricted needs non-empty allowedConnections; all clears them.'}
      - {name: compressionEnabled, type: bool, default: 'true', desc: 'Per-key switch for prompt compression.'}
      - {name: cacheDefaultMode, type: 'legacy|bypass', default: legacy, desc: 'bypass skips the semantic cache for the key.'}
      - {name: allowAutoCombos, type: bool, default: 'true', desc: 'false blocks the built-in auto/* routes for this key, applied on top of allowedCombos.'}
      returns: '200 `{message, ...changed fields echoed}`; 400 on inconsistent combinations, 404 for an unknown id.'
      notes: ['allowedCombos gates combos, not direct models']
      ref: /blob/3.8.51/src/app/api/keys/[id]/route.ts
    - id: feature-flags
      name: 'Feature flags'
      summary: '`PUT /api/settings/feature-flags` sets or removes a DB override of a runtime flag, no restart for most.'
      lenses: [best-practice, reliability]
      signature: 'PUT /api/settings/feature-flags {key, value}'
      params:
      - {name: key, type: string, default: null, desc: 'Known flag id; unknown keys return 400.'}
      - {name: value, type: string, default: null, desc: '"true"/"false" or an enum member; omit to remove the override.'}
      returns: '`{key, effectiveValue, source, previousValue, previousSource, requiresRestart}`; `GET` returns `{flags[], summary}`.'
      notes: ['values are strings; DB override beats env; DELETE clears every override']
      ref: /blob/3.8.51/src/app/api/settings/feature-flags/route.ts
    - id: resilience-settings
      name: 'Resilience'
      summary: '`PATCH /api/resilience` tunes request queue, cooldown waits and breakers; GET returns the resolved settings.'
      lenses: [reliability]
      signature: 'PATCH /api/resilience {waitForCooldown, comboCooldownWait}'
      options:
      - {name: waitForCooldown.enabled, type: bool, default: 'true', desc: 'Direct (non-combo) requests wait out a connection cooldown: up to 5 retries of 90 s, 300 s total.'}
      - {name: comboCooldownWait.enabled, type: bool, default: 'true', desc: 'Combos wait on short transient cooldowns before redispatch: 90 s each, 5 attempts, 300 s budget.'}
      - {name: comboCooldownWait.maxAttempts, type: int, default: '5', desc: 'Redispatch cycles per request.'}
      returns: 'Resolved requestQueue, connectionCooldown, providerBreaker, waitForCooldown, comboCooldownWait and more.'
      notes: [sync turns both off]
      ref: /blob/3.8.51/src/lib/resilience/settings.ts
    - id: usage-api
      name: 'Usage and cost API'
      summary: '`/api/usage/*` exposes history, request logs, per-model latency stats and per-key budgets or token limits.'
      lenses: [observability, cost]
      signature: 'GET /api/usage/model-latency-stats?windowHours=<n>'
      params:
      - {name: windowHours, type: int, default: null, desc: 'Latency stats window; also provider, model, minSamples, maxRows filters.'}
      returns: 'Rolling per-provider/model avg, p50, p95, p99 latency and success rate.'
      notes: ['also /api/usage/logs, /request-logs, /budget, /token-limits']
      ref: /blob/3.8.51/docs/reference/API_REFERENCE.md
- title: 'Resilience and prompt safety'
  sections:
  - id: resilience
    title: 'Resilience and rewrites'
    level: intermediate
    requires: [combos]
    ref: /blob/3.8.51/docs/architecture/RESILIENCE_GUIDE.md
    entries:
    - id: breaker-cooldown-lockout
      name: 'Breaker, cooldown, lockout'
      summary: 'Provider circuit breaker, connection cooldown and model lockout layers; reset them all with one management call.'
      lenses: [reliability]
      signature: 'POST /api/resilience/reset'
      returns: '`{ok, resetCount}` after resetting every breaker and clearing model lockouts; needs management auth.'
      notes: ['also GET /api/resilience/model-cooldowns', 'live breaker state in /api/monitoring/health']
      ref: /blob/3.8.51/docs/architecture/RESILIENCE_GUIDE.md
    - id: stream-keepalive
      name: 'Early stream keepalive'
      summary: 'Streams return 200 plus keepalive after about 1 s; a later failure arrives as an in-band error frame.'
      lenses: [reliability, ux-a11y]
      notes: [hides upstream status from clients]
      ref: /blob/3.8.51/open-sse/utils/earlyStreamKeepalive.ts
    - id: emergency-fallback
      name: 'Emergency fallback'
      summary: 'On HTTP 402 or budget-keyword errors, redirects to nvidia/openai/gpt-oss-120b unless `OMNIROUTE_EMERGENCY_FALLBACK` is false.'
      lenses: [cost, reliability]
      options:
      - {name: OMNIROUTE_EMERGENCY_FALLBACK, type: bool, default: 'true', desc: 'Env or feature-flag switch (DB beats env); the target model is a code constant.'}
      notes: [skipped for requests with tools; output capped at 4096 tokens, forced false]
      ref: /blob/3.8.51/open-sse/services/emergencyFallback.ts
    - id: context-handoff
      name: 'Context handoff'
      summary: 'When combo routing switches models, injects generated conversation summaries; disable via the flag.'
      lenses: [reliability]
      options:
      - {name: UNIVERSAL_CONTEXT_HANDOFF_ENABLED, type: bool, default: 'true', desc: 'false stops summary injection and the background handoff requests for all combos.'}
      notes: [forced false]
      ref: /blob/3.8.51/docs/reference/FEATURE_FLAGS.md
    - id: global-fallback-model
      name: 'Global fallback'
      summary: 'Setting `globalFallbackModel` reroutes to one model when a combo exhausts with 502 or 503.'
      lenses: [reliability]
      signature: 'PATCH /api/settings {globalFallbackModel: "<provider>/<id>"}'
      returns: 'A fallback success replaces the combo failure; non-502/503 failures are not rerouted.'
      notes: [sync asserts unset]
      ref: /blob/3.8.51/src/sse/handlers/chat.ts
    - id: semantic-cache
      name: 'Semantic cache'
      summary: 'Responses can be served from a semantic cache; opt out per key with `cacheDefaultMode` or per request with a header.'
      lenses: [cost, perf]
      signature: 'X-OmniRoute-No-Cache: true'
      options:
      - {name: cacheDefaultMode, type: 'legacy|bypass', default: legacy, desc: 'Per-key setting set through PATCH /api/keys/:id; bypass never reads the cache.'}
      returns: 'X-OmniRoute-Cache HIT|MISS; on a HIT the cost header is 0 and X-OmniRoute-Cost-Saved reports the avoided USD.'
      notes: [header sent on every call]
      ref: /blob/3.8.51/docs/reference/API_REFERENCE.md
    - id: prompt-compression
      name: 'Compression'
      summary: 'Global, per-key, per-combo and per-request prompt compression; the global master switch gates all of them.'
      lenses: [cost, perf]
      signature: 'PUT /api/settings/compression {enabled, defaultMode}'
      options:
      - {name: enabled, type: bool, default: null, desc: 'Master switch; when false no request header or combo mode can enable compression.'}
      - {name: defaultMode, type: enum, default: null, desc: 'off, lite, standard, aggressive, ultra, rtk, stacked, codex-responses or omniglyph.'}
      - {name: autoTriggerTokens, type: int, default: null, desc: 'Token count above which autoTriggerMode applies.'}
      returns: 'The settings object; `GET /api/settings/compression` returns the same shape.'
      notes: [sync asserts off]
      ref: /blob/3.8.51/docs/compression/COMPRESSION_GUIDE.md
    - id: memory-injection
      name: 'Memory and skills injection'
      summary: '`x-omniroute-no-memory: true` skips memory and skills injection for one request.'
      lenses: [cost, security]
      signature: 'x-omniroute-no-memory: true'
      ref: /blob/3.8.51/docs/reference/API_REFERENCE.md
    - id: guardrails
      name: 'Guardrails'
      summary: 'Prompt-injection and PII guards are feature flags; guardrails fail open if a guard throws.'
      lenses: [security]
      signature: 'PUT /api/settings/feature-flags {key: "INJECTION_GUARD_MODE", value: "off"}'
      options:
      - {name: INJECTION_GUARD_MODE, type: 'off|warn|block|redact', default: 'off', desc: 'Prompt-injection guard behavior.'}
      - {name: PII_REDACTION_ENABLED, type: bool, default: 'false', desc: 'Redact personal data from requests.'}
      notes: [sync asserts both off]
      ref: /blob/3.8.51/docs/security/GUARDRAILS.md
- title: 'Container and operations'
  sections:
  - id: container-ops
    title: 'Image, data, health'
    level: basic
    requires: []
    ref: /blob/3.8.51/docs/guides/DOCKER_GUIDE.md
    entries:
    - id: image-tags
      name: 'Image tags'
      summary: 'Image `diegosouzapw/omniroute:<version>` has no `v` prefix; also `latest`, `next`, `main` and a `-web` Chromium variant.'
      lenses: [reliability, security]
      signature: 'diegosouzapw/omniroute:<version>'
      notes: [pin exact version]
      ref: /blob/3.8.51/docs/guides/DOCKER_GUIDE.md
    - id: require-api-key
      name: 'Inference auth'
      summary: 'The image sets `REQUIRE_API_KEY=true`, so `/v1/*` needs a Bearer key (not `GET /v1/models`).'
      lenses: [security]
      options:
      - {name: REQUIRE_API_KEY, type: bool, default: 'false', desc: 'Source default is false; the Dockerfile ENV sets true.'}
      notes: [compose sets it explicitly]
      ref: /blob/3.8.51/Dockerfile
    - id: initial-password
      name: 'Initial password'
      summary: '`INITIAL_PASSWORD` seeds the admin password; the saved hash wins afterwards.'
      lenses: [security]
      options:
      - {name: INITIAL_PASSWORD, type: string, default: CHANGEME, desc: 'Seeds the admin dashboard password on first boot; change it before first use.'}
      notes: [default CHANGEME is refused off-loopback]
      ref: /blob/3.8.51/docs/reference/ENVIRONMENT.md
    - id: data-volume
      name: 'Data volume'
      summary: 'Mount a volume at `/app/data` (DB, keys, config); the unit of persistence for the gateway.'
      lenses: [reliability]
      options:
      - {name: DATA_DIR, type: path, default: '~/.omniroute/', desc: 'Image sets /app/data; must support durable file primitives or startup fails.'}
      ref: /blob/3.8.51/docs/guides/DOCKER_GUIDE.md
    - id: server-env-bootstrap
      name: 'Secret bootstrap'
      summary: 'First boot generates JWT_SECRET and STORAGE_ENCRYPTION_KEY into `DATA_DIR/server.env` (mode 0600); losing it orphans encrypted data.'
      lenses: [security, reliability]
      options:
      - {name: JWT_SECRET, type: string, default: null, desc: 'Signs dashboard cookies; docs call it required, bootstrap generates it when missing.'}
      - {name: API_KEY_SECRET, type: string, default: null, desc: 'AES key for API key values at rest in SQLite.'}
      notes: [env vars beat server.env; back up the volume as one unit]
      ref: /blob/3.8.51/scripts/build/bootstrap-env.mjs
    - id: stop-grace
      name: 'Stop grace'
      summary: 'A 40 s stop grace lets SQLite checkpoint the WAL on `docker stop`; use `--stop-timeout 40` with plain docker.'
      lenses: [reliability]
      signature: 'stop_grace_period: 40s'
      ref: /blob/3.8.51/docs/guides/DOCKER_GUIDE.md
    - id: storage-encryption
      name: 'DB encryption'
      summary: '`STORAGE_ENCRYPTION_KEY` encrypts SQLite at rest; bootstrap generates one, and losing it loses data.'
      lenses: [security]
      options:
      - {name: STORAGE_ENCRYPTION_KEY, type: hex string, default: null, desc: 'AES key; empty disables encryption. Generate with openssl rand -hex 32.'}
      - {name: STORAGE_ENCRYPTION_KEY_VERSION, type: string, default: v1, desc: 'Bump when rotating the key so old backups still decrypt.'}
      ref: /blob/3.8.51/docs/reference/ENVIRONMENT.md
    - id: health-checks
      name: 'Health checks'
      summary: 'Dockerfile HEALTHCHECK runs `node healthcheck.mjs` (30 s) against the in-memory `/healthz`; `/api/monitoring/health` is the deep check.'
      lenses: [observability, reliability]
      signature: 'GET /healthz'
      returns: 'Lifecycle status without DB access; the deep endpoint reports provider counts and breaker state.'
      notes: [compose waits on the image healthcheck, the deep probe can fail under event-loop load]
      ref: /blob/3.8.51/Dockerfile
    - id: single-replica
      name: 'Single replica'
      summary: 'Default SQLite is single-replica; scale-out means N independent processes, never shared storage.'
      lenses: [reliability]
      ref: /blob/3.8.51/docs/guides/DOCKER_GUIDE.md
    - id: free-tier-providers
      name: 'Free-tier providers'
      summary: 'API-key providers mistral, openrouter and cloudflare-ai; see the free-tier guide and provider reference.'
      lenses: [cost]
      ref: /blob/3.8.51/docs/getting-started/FREE-TIERS-GUIDE.md
- title: 'Routing policies and cost guards'
  sections:
  - id: routing-policies
    title: 'Auto variants, cost and exposure policies'
    level: intermediate
    requires: [combos]
    ref: /blob/3.8.51/docs/getting-started/AUTO-COMBO-GUIDE.md
    entries:
    - id: auto-variants
      name: 'auto model variants'
      summary: 'Send model auto or auto/coding|fast|cheap|smart|offline; OmniRoute scores all connections, picks one and falls through on failure.'
      lenses: [cost, reliability]
      signature: 'POST /v1/chat/completions {"model": "auto/coding"}'
      options:
      - {name: auto, type: model id, default: null, desc: 'Balanced weights: health 20%, quota 15%, cost 15%, speed 12%, task fit 8%.'}
      - {name: auto/coding, type: model id, default: null, desc: 'Quality-first (taskFit 37%, stability 15%).'}
      - {name: auto/fast, type: model id, default: null, desc: 'Latency 32%, health 28%.'}
      - {name: auto/cheap, type: model id, default: null, desc: 'Cost 37%.'}
      - {name: auto/smart, type: model id, default: null, desc: 'Quality-first plus 10% exploration (auto uses 5%).'}
      - {name: auto/offline, type: model id, default: null, desc: 'Quota 37%, health 28%: most available capacity.'}
      notes: ['each account of one provider is scored as a separate candidate', 'score < 0.2 excludes a connection 5 min; breaker-open is auto-excluded; >50% of providers down disables exploration', 'to pin a provider use a priority combo and send its exact name, not auto']
      ref: /blob/3.8.51/docs/getting-started/AUTO-COMBO-GUIDE.md
    - id: strict-zero-cost
      name: 'Strict zero-cost policy'
      summary: 'Setting `freeAccessPolicy: strict` keeps every `auto/*` pool to candidates that can never bill; new or uncurated models start excluded.'
      lenses: [cost, security]
      signature: 'PUT /api/settings {"freeAccessPolicy": "strict", "excludeTosAvoid": false}'
      options:
      - {name: freeAccessPolicy, type: 'off|strict', default: '"off"', desc: 'strict admits keyless no-auth candidates and free tiers marked hardStopGuaranteed that still have allowance.'}
      - {name: excludeTosAvoid, type: bool, default: 'false', desc: 'Independent ToS guard that also drops providers flagged to avoid.'}
      returns: '`GET /v1/auto-combo/{channel}/candidates` lists candidates with `freeAccessExclusion`: null, not-in-catalog, regime-not-free, no-hard-stop, contradictory-noauth or exhausted.'
      notes: ['only auto/* pools are filtered; an explicit provider/model id is never blocked', 'hidePaidModels only asks "is it catalogued free", strict also checks exhaustion and billing risk']
      ref: /blob/3.8.51/docs/routing/STRICT_ZERO_COST.md
    - id: subscription-ladder
      name: 'Subscription ladder'
      summary: 'auto/subscription uses only plan-included connections (fails closed); auto/thrifty steps up one paid rung at a time.'
      lenses: [cost]
      signature: '{"model": "auto/coding:thrifty"}'
      options:
      - {name: subscriptionLadder.exitCutoffPercent, type: number, default: null, desc: 'Remaining-quota percent at which a rung counts as exhausted (docs example 2).'}
      - {name: subscriptionLadder.reentryMinRemainingPercent, type: number, default: null, desc: 'Remaining percent needed to re-enter a rung after reset (anti-flap; example 5).'}
      - {name: subscriptionLadder.rungBudgetUsd, type: 'object', default: null, desc: 'Accepted by the schema but NOT enforced at 3.8.51; treat as reserved.'}
      notes: ['billing class (subscription|metered|keyless|unknown) comes from a curated per-connection catalog; unknown counts as metered', 'composes with categories: auto/coding:thrifty, auto/reasoning:subscription', 'deliberately has no enabled flag']
      ref: /blob/3.8.51/docs/routing/SUBSCRIPTION_LADDER.md
    - id: model-exposure-list
      name: 'Model exposure allow/deny list'
      summary: 'Settings arrays hide models from `/v1/models` and from `auto/*` candidate pools; they do not block an explicitly named model at dispatch.'
      lenses: [security, best-practice]
      signature: 'PUT /api/settings {"modelVisibilityAllowlist": ["openai/gpt-4*"]}'
      options:
      - {name: modelVisibilityDenylist, type: 'string[]', default: '[]', desc: 'Exact ids or `*`/`?` globs; denied entries are always hidden (up to 500 entries of 200 chars).'}
      - {name: modelVisibilityAllowlist, type: 'string[]', default: '[]', desc: 'When non-empty only matching entries stay exposed; the denylist wins on overlap.'}
      notes: ['ids may be bare (`gpt-4o`) or provider-prefixed (`openai/gpt-4o`)', 'composes AND-wise with hidePaidModels and hideAutoCombos']
      ref: /blob/3.8.51/docs/routing/MODEL_EXPOSURE_LIST.md
    - id: reasoning-routing
      name: 'Reasoning routing rules'
      summary: 'Rules rewrite reasoning effort and thinking budget per key, combo, model or globally; a simulate route previews them.'
      lenses: [cost, composability]
      signature: 'POST /api/settings/reasoning-routing-rules'
      params:
      - {name: sourceEffort, type: 'any|missing|none|low|medium|high|xhigh|max|ultra', default: null, desc: 'Which incoming effort the rule matches; missing means no effort or thinking signal at all.'}
      - {name: effortMode, type: 'inherit|default|force', default: null, desc: 'default sets targetEffort only when unset; force replaces it.'}
      - {name: budgetAction, type: 'preserve|remove|set', default: null, desc: 'Independent thinking-budget handling; force+none removes all effort and budget fields.'}
      - {name: requestTags, type: 'any|all', default: null, desc: 'Matched only against `metadata.tags`.'}
      notes: ['scope precedence apiKey > combo > model > global, then priority, then exact over glob', 'rules never widen API-key model or combo permissions', 'covers chat completions, responses and anthropic messages', 'routes: GET/POST /api/settings/reasoning-routing-rules, GET/PATCH/DELETE .../[id], POST .../simulate']
      ref: /blob/3.8.51/docs/routing/REASONING_ROUTING.md
    - id: reasoning-replay
      name: 'Reasoning replay cache'
      summary: 'Re-injects cached reasoning_content on follow-up turns for thinking models whose upstream 400s when clients strip it.'
      lenses: [reliability]
      signature: 'GET|DELETE /api/cache/reasoning[?provider=&model=&limit=&toolCallId=]'
      returns: 'GET returns stats plus paginated entries; DELETE clears all, one provider, or one tool-call id.'
      notes: ['2 h TTL, 200 memory entries, backed by a SQLite table', 'management-auth only', 'a cache miss sends empty reasoning_content as a legacy fallback']
      ref: /blob/3.8.51/docs/routing/REASONING_REPLAY.md
    - id: quota-share
      name: 'Quota sharing engine'
      summary: 'Fair-share a connection''s time-window quota across several API keys with hard, soft or burst policies and optional absolute caps.'
      lenses: [cost, reliability]
      signature: 'GET|POST /api/quota/pools; PUT /api/quota/plans/{connectionId}'
      options:
      - {name: QUOTA_STORE_DRIVER, type: 'sqlite|redis', default: sqlite, desc: 'Counter backend; redis for multi-instance via QUOTA_STORE_REDIS_URL.'}
      - {name: QUOTA_SATURATION_THRESHOLD, type: 'number 0..1', default: '0.5', desc: 'At or above this global use the engine enforces shares strictly instead of letting keys borrow.'}
      - {name: QUOTA_SOFT_DEPRIORITIZE_FACTOR, type: 'number 0..1', default: '0.7', desc: 'Score multiplier for soft-policy keys over their share.'}
      - {name: QUOTA_CONSUMPTION_RETENTION_DAYS, type: number, default: '14', desc: 'Days before old consumption buckets are garbage collected.'}
      notes: ['DB settings quotaStore.* override env vars', 'checked before dispatch in the chat hot path']
      ref: /blob/3.8.51/docs/routing/QUOTA_SHARE.md
    - id: deterministic-routing
      name: 'Deterministic strategy block'
      summary: 'Self-hosted strategy: YAML block filters and orders providers by rules; responses carry x-omniroute-route-decision.'
      lenses: [observability, reliability]
      signature: 'OMNIROUTE_SELF_HOSTED_STRATEGY[_FILE]'
      options:
      - {name: blacklist, type: 'string[]', default: '[]', desc: 'Provider ids never used.'}
      - {name: whitelist, type: 'string[]', default: '[]', desc: 'When non-empty only these ids are candidates.'}
      - {name: costPriority, type: bool, default: null, desc: 'Order by declared `costPer1MInput` ascending.'}
      - {name: latencyAware.enabled, type: bool, default: null, desc: 'Order by recent average latency; unsampled providers sort last.'}
      - {name: cooldown, type: '{consecutiveFailures, cooldownMs}', default: null, desc: 'Breaker window after N consecutive failures.'}
      - {name: fallbackChain, type: 'string[]', default: null, desc: 'Explicit order; wins over cost and latency ordering.'}
      notes: ['a pin (x-omniroute-provider header or provider/model prefix) excluded by a filter fails 400, never silently re-routes', 'no eligible candidate returns 503 with the full decision']
      ref: /blob/3.8.51/docs/routing/DETERMINISTIC_ROUTING.md
    - id: self-hosted-entry
      name: 'Self-hosted OpenAI entry'
      summary: 'Env-configured YAML provider list makes /v1/chat/completions a gateway over your own endpoints, picked by header or prefix.'
      lenses: [composability, security]
      signature: 'OMNIROUTE_SELF_HOSTED_PROVIDERS[_FILE]'
      options:
      - {name: OMNIROUTE_SELF_HOSTED_PROVIDERS, type: yaml string, default: null, desc: 'Inline providers document: id, kind (openai|anthropic|local), baseUrl, model, optional apiKey.'}
      - {name: OMNIROUTE_SELF_HOSTED_API_KEY, type: string, default: null, desc: 'When set, requests must send it as a Bearer key; unset leaves the route open.'}
      - {name: x-omniroute-provider, type: header, default: null, desc: 'Pins a provider id; otherwise the model prefix `provider/model` or `provider::model`, else the first provider.'}
      notes: ['unparseable config returns 500 and never falls through to cloud routing', 'prefix is stripped before forwarding']
      ref: /blob/3.8.51/docs/routing/SELF_HOSTED_OPENAI_ENTRY.md
- title: 'Providers and onboarding'
  sections:
  - id: onboarding
    title: 'Install, connect, first request'
    level: basic
    requires: []
    ref: /blob/3.8.51/docs/getting-started/QUICK-START.md
    entries:
    - id: quick-start
      name: 'Quick start'
      summary: 'Install via npm or Docker, connect a free provider in the dashboard, create a gateway key, then call `/v1` with model `auto`.'
      lenses: [best-practice]
      signature: 'omniroute | docker run -p 20128:20128 diegosouzapw/omniroute:<version>'
      notes: ['gateway keys (dashboard API Keys) are for tools to reach OmniRoute, not upstream providers; the key is shown once', '`omniroute launch-codex --model auto` and `omniroute run <claude|codex|aider|goose|opencode|qwen|gemini>` configure CLIs', ':latest is the highest published stable tag, not git main']
      ref: /blob/3.8.51/docs/getting-started/QUICK-START.md
    - id: self-host-compose
      name: 'Self-host compose flow'
      summary: 'From 3.8.51 a selfhost compose file plus env example runs the gateway; ports 20128, 20129 and 20132 bind loopback only.'
      lenses: [security, reliability]
      signature: 'docker compose -f docker-compose.selfhost.yml up -d'
      options:
      - {name: OMNIROUTE_MEMORY_MB, type: int, default: '1024 (image), 2048 (selfhost env example)', desc: 'V8 heap ceiling; coding agents on /v1/responses can abort near 12 GiB, size the container a few hundred MB above it.'}
      notes: ['20128 dashboard plus /v1 proxy, 20129 server API, 20132 live websocket', 'Redis is not published to the host', 'npm install keeps data in ~/.omniroute (DATA_DIR overrides)']
      ref: /blob/3.8.51/docs/getting-started/SELF_HOST_GUIDE.md
    - id: provider-types
      name: 'Provider types'
      summary: 'Providers are free/no-auth, API key, OAuth, web cookie or local; add them in the dashboard, then they join combos and auto pools.'
      lenses: [best-practice, cost]
      notes: ['first-run wizard offers an explicit free-provider setup card and never creates connections silently', 'local MLX models run via mlx-lm.server as OpenAI-compatible providers; OmniRoute does not manage their processes']
      ref: /blob/3.8.51/docs/getting-started/PROVIDERS-GUIDE.md
    - id: provider-reference
      name: 'Provider reference'
      summary: 'Generated catalog of 358 providers by category (no-auth 10, OAuth 25, web cookie 33, API key 241, local 14, search 17, audio 12).'
      lenses: [reuse]
      notes: ['regenerate with npm run gen:provider-reference; counts are as of 2026-09-24']
      ref: /blob/3.8.51/docs/reference/PROVIDER_REFERENCE.md
    - id: free-tiers-reference
      name: 'Free-tier budgets and ToS flags'
      summary: 'Per-model free quota catalog (about 1.62B tokens/month deduped) plus advisory ToS caution flags per provider.'
      lenses: [cost, security]
      signature: 'GET /api/free-tier/summary?excludeTosAvoid=true'
      notes: ['the ToS flag is advisory, not a routing gate', 'counting reads the Radar-overlaid catalog while routing decisions read the shipped catalog only', 'many free providers carry caution flags for personal-use or proxy clauses (fireworks, kiro, opencode, ai21, modal, ...)']
      ref: /blob/3.8.51/docs/reference/FREE_TIERS.md
    - id: csv-import
      name: 'Provider import from file'
      summary: 'Dashboard import makes API-key connections from CSV (provider,name,apiKey,baseUrl?,priority?) or JSON; partial failure is allowed.'
      lenses: [reuse]
      params:
      - {name: provider, type: string, default: null, desc: 'Existing provider id or an already registered compatible-node id.'}
      - {name: priority, type: 'int 1-100', default: null, desc: 'Optional connection priority.'}
      notes: ['does not create OpenAI/Anthropic-compatible nodes; create them first (dashboard or `omniroute nodes add`)']
      ref: /blob/3.8.51/docs/providers/CSV-IMPORT.md
    - id: removed-providers
      name: 'Removed providers register'
      summary: 'Providers dropped at their operator''s request must not return; explicit requests fail with a retired-provider error.'
      lenses: [best-practice]
      notes: ['chatgpt-web and cgpt-web ids return HTTP 410 PROVIDER_RETIRED']
      ref: /blob/3.8.51/docs/reference/REMOVED_PROVIDERS.md
  - id: provider-specific
    title: 'Provider-specific setup'
    level: intermediate
    requires: [onboarding]
    ref: /blob/3.8.51/docs/getting-started/WEB-COOKIE-GUIDE.md
    entries:
    - id: web-cookie-providers
      name: 'Web cookie providers'
      summary: 'Providers that reuse a browser session; copy credentials from a live network request, never DevTools cookie storage; no tool calling.'
      lenses: [security, best-practice]
      notes: ['not supported: function or tool calling, file editing, agentic IDE flows (use an API-key provider)', 'Test Connection only checks credential format, not that auth will succeed (issue 7857)']
      ref: /blob/3.8.51/docs/getting-started/WEB-COOKIE-GUIDE.md
    - id: claude-web
      name: 'Claude Web provider'
      summary: '`claude-web` bridges OpenAI-format chat to a claude.ai session; seven static model ids and no dynamic discovery.'
      lenses: [security]
      notes: ['static ids include claude-opus-4-8, claude-sonnet-5, claude-haiku-4-5-20251001']
      ref: /blob/3.8.51/docs/providers/CLAUDE_WEB.md
    - id: chatgpt-web-codex
      name: 'ChatGPT Web (Codex)'
      summary: 'Bridges Codex Responses turns through a ChatGPT browser session; needs Chromium and, for tool turns, a tunnel plus connector.'
      lenses: [security, reliability]
      notes: ['the raw cookie is replaced by verified Playwright storage state after save', 'Docker needs the `web` profile Chromium service', 'tool-capable setups need a connector named exactly `OmniRoute Codex v2`']
      ref: /blob/3.8.51/docs/providers/CHATGPT_WEB.md
    - id: copilot-m365
      name: 'Microsoft 365 Copilot'
      summary: '`copilot-m365-web` uses a WebSocket URL query parameter and path segment from DevTools as its credential, not a cookie; unofficial.'
      lenses: [security]
      notes: ['token lifetime is about 75 minutes unless a refreshToken is supplied', 'HAR import is an alternative capture path']
      ref: /blob/3.8.51/docs/providers/COPILOT-M365.md
    - id: agentrouter-provider
      name: 'AgentRouter'
      summary: 'Built-in agentrouter provider ships the Claude Code wire image the relay requires; a CC-compatible type is the advanced path.'
      lenses: [reliability]
      notes: ['relay only accepts traffic matching Claude Code user-agent, anthropic-beta and Stainless headers', 'per-connection toggles add redact-thinking beta or summarized thinking display']
      ref: /blob/3.8.51/docs/providers/AGENTROUTER.md
    - id: alibaba-qwen-families
      name: 'Alibaba and Qwen families'
      summary: 'Four ids (alibaba, bailian-coding-plan, qwen-cloud, qwen-cloud-token-plan); region is connection data in `providerSpecificData.region`.'
      lenses: [best-practice]
      options:
      - {name: providerSpecificData.region, type: 'global-sg|china-beijing', default: null, desc: 'Selects the preset endpoint; key and endpoint must belong to the same product and region.'}
      notes: ['bailian-coding-plan speaks the Anthropic wire format, the others OpenAI', 'alibaba-cn stays a runtime alias for saved connections', 'a non-preset providerSpecificData.baseUrl overrides the preset']
      ref: /blob/3.8.51/docs/providers/ALIBABA-QWEN-PROVIDER-FAMILIES.md
    - id: cursor-api
      name: 'Cursor API and CLI passthrough'
      summary: 'API-key provider `cursor-api` (alias `cua`) exposes Cursor models as `cursor-api/<model>`; the Cursor CLI can be pointed at OmniRoute.'
      lenses: [composability]
      signature: 'CURSOR_API_ENDPOINT=http://localhost:20128/api/cursor-cli'
      notes: ['CLI needs `network.useHttp1ForAgent: true` in ~/.cursor/cli-config.json', 'exact live-catalog model ids (including suffixes like -low) are preserved']
      ref: /blob/3.8.51/docs/providers/CURSOR-API-KEY-AND-CLI.md
    - id: cursor-docker
      name: 'Cursor in Docker'
      summary: 'IDE import fails in containers; use the Login with Cursor PKCE flow, which stores access and refresh tokens.'
      lenses: [reliability]
      notes: ['official images ship no cursor-agent binary', 'manual token import is the fallback']
      ref: /blob/3.8.51/docs/providers/CURSOR-DOCKER.md
    - id: cursor-image
      name: 'Cursor image generation'
      summary: '`POST /v1/images/generations` with `cursor/auto`, `cursor/composer-2` or `cursor/composer-2.5`; spawns the agent CLI.'
      lenses: [security]
      signature: 'POST /v1/images/generations'
      notes: ['only image format that spawns a child process; concurrency gate is per instance']
      ref: /blob/3.8.51/docs/providers/CURSOR_IMAGE.md
    - id: zed-docker
      name: 'Zed in Docker'
      summary: 'Keychain import fails in containers; import a token manually through the dashboard tab or `POST /api/providers/zed/manual-import`.'
      lenses: [reliability]
      signature: 'POST /api/providers/zed/manual-import {provider, token, label?}'
      notes: ['needs a manage-scoped Bearer key']
      ref: /blob/3.8.51/docs/providers/ZED-DOCKER.md
  - id: provider-infra
    title: 'Embeddings, proxies and relays'
    level: advanced
    requires: [onboarding]
    ref: /blob/3.8.51/docs/reference/EMBEDDINGS.md
    entries:
    - id: embeddings-runbook
      name: 'Embeddings runbook'
      summary: 'POST /v1/embeddings works with OpenRouter-prefixed Gemini ids and Jina omni ids; native gemini-embedding-2 400s without a key.'
      lenses: [reliability]
      signature: 'POST /v1/embeddings {"model": "openrouter/google/gemini-embedding-2", "input": [...]}'
      notes: ['Gemini embedding ids via OpenRouter return 3072 dims, jina omni small 1024, nano 768 (different vector spaces)', 'google/ prefix returns Unknown embedding provider unless a custom node uses it']
      ref: /blob/3.8.51/docs/reference/EMBEDDINGS.md
    - id: free-proxies-api
      name: 'Free proxies pool API'
      summary: 'Curated free proxy pool synced from external sources; list, add-to-pool, sync and stats routes under /api/settings/free-proxies.'
      lenses: [reuse]
      signature: 'GET /api/settings/free-proxies?protocol=&country=&minQuality='
      notes: ['sync pulls each source independently; failures land in syncErrors without wiping prior data']
      ref: /blob/3.8.51/docs/reference/FREE_PROXIES_API.md
    - id: relay-backend
      name: 'Relay backend strategy'
      summary: 'Relay chat endpoint runs in `ts`, `bifrost` or `auto` mode; auto prefers the Bifrost sidecar and falls back to TypeScript.'
      lenses: [reliability, perf]
      signature: 'OMNIROUTE_RELAY_BACKEND=auto BIFROST_ENABLED=1'
      notes: ['route is /api/v1/relay/chat/completions', 'API key, allowlist and rate-limit checks always run before forwarding']
      ref: /blob/3.8.51/docs/reference/RELAY_BACKEND_STRATEGY.md
    - id: relay-troubleshooting
      name: 'Relay troubleshooting'
      summary: 'Serverless relay auth is stored under STORAGE_ENCRYPTION_KEY; rotation breaks it and a repair route re-derives it.'
      lenses: [reliability, security]
      signature: 'POST /api/settings/proxies/{id}/repair-relay'
      returns: '`{repaired: true, mode: recovered}` or `{repaired: false, mode: noop}`.'
      ref: /blob/3.8.51/docs/reference/RELAY_TROUBLESHOOTING.md
    - id: provider-plugin-manifest
      name: 'Provider plugin manifest'
      summary: 'JSON-safe provider contract for out-of-process sidecars, served with ETag at `/api/v1/provider-plugin-manifest`.'
      lenses: [composability]
      signature: 'GET /api/v1/provider-plugin-manifest'
      options:
      - {name: OMNIROUTE_PROVIDER_MANIFEST_URL, type: url, default: null, desc: 'Public or container-network manifest URL advertised to sidecars.'}
      notes: ['Cache-Control max-age 60; send If-None-Match to get 304']
      ref: /blob/3.8.51/docs/reference/PROVIDER_PLUGIN_MANIFEST.md
    - id: opencode-session-identity
      name: 'OpenCode conversation identity'
      summary: 'Session continuity for OpenCode providers resolves from `x-opencode-session` and related headers; opaque user ids never count.'
      lenses: [reliability]
      notes: ['empty, control-character or over-256-char ids are ignored', 'headers are preserved only for OpenCode providers']
      ref: /blob/3.8.51/docs/reference/OPENCODE-SESSION-IDENTITY.md
- title: 'Agent protocols and frameworks'
  sections:
  - id: agent-surfaces
    title: 'A2A, ACP, cloud agents, evals'
    level: advanced
    requires: [ai-tooling]
    ref: /blob/3.8.51/docs/frameworks/AGENT_PROTOCOLS_GUIDE.md
    entries:
    - id: a2a-methods
      name: 'A2A JSON-RPC methods'
      summary: 'A2A v0.3 at `POST /a2a` with message/send, message/stream, tasks/get and tasks/cancel plus six built-in routing skills.'
      lenses: [composability]
      signature: 'POST /a2a'
      options:
      - {name: message/send, type: method, default: null, desc: 'Submit a message, receive a synchronous response.'}
      - {name: message/stream, type: method, default: null, desc: 'Submit and receive SSE progress events.'}
      - {name: tasks/get, type: method, default: null, desc: 'Read a task by id.'}
      - {name: tasks/cancel, type: method, default: null, desc: 'Cancel a running task.'}
      notes: ['built-in skills: smart-routing, quota-management, provider-discovery, cost-analysis, health-report, list-capabilities']
      ref: /blob/3.8.51/docs/frameworks/AGENT_PROTOCOLS_GUIDE.md
    - id: acp-registry
      name: 'ACP CLI agents'
      summary: 'ACP spawns installed CLI agents (codex, claude, goose, aider, gemini, ...) as stdio child processes; list at GET /api/acp/agents.'
      lenses: [composability]
      signature: 'GET /api/acp/agents'
      notes: ['15 built-in agents; custom agents can be added in settings', 'reuses the CLI authentication so no API key is needed']
      ref: /blob/3.8.51/docs/frameworks/ACP.md
    - id: cloud-agent-tasks
      name: 'Cloud agent tasks'
      summary: 'Durable long-running tasks on Codex Cloud, Cursor, Devin or Jules via `/api/v1/agents/tasks` with approve, message and cancel actions.'
      lenses: [composability, reliability]
      signature: 'POST /api/v1/agents/tasks {providerId, prompt, source, options}'
      options:
      - {name: options.autoCreatePr, type: bool, default: null, desc: 'Ask the agent to open a pull request.'}
      - {name: options.planApprovalRequired, type: bool, default: null, desc: 'Gate execution on an approve action.'}
      notes: ['management auth required on every route', 'POST /api/v1/agents/tasks/{id} actions: approve, message, cancel; DELETE removes the record without cancelling upstream', 'GET lazily syncs status from upstream']
      ref: /blob/3.8.51/docs/frameworks/CLOUD_AGENT.md
    - id: evals
      name: 'Evals'
      summary: 'Benchmark a combo, provider or model against built-in or custom suites with scoring rubrics; REST under `/api/evals`.'
      lenses: [testing, reliability]
      signature: 'POST /api/evals {suiteId, target: {type, id}, apiKeyId?}'
      options:
      - {name: outputs, type: 'Record<caseId,string>', default: null, desc: 'Pre-computed outputs; skips dispatch and only scores.'}
      - {name: compareTarget, type: object, default: null, desc: 'Second target run in parallel for head-to-head comparison.'}
      - {name: apiKeyId, type: string, default: null, desc: 'Gateway key used for dispatched chat calls; required when REQUIRE_API_KEY is on.'}
      notes: ['custom suites: POST/PUT/DELETE /api/evals/suites[/{id}]']
      ref: /blob/3.8.51/docs/frameworks/EVALS.md
    - id: embedded-services
      name: 'Embedded services'
      summary: 'OmniRoute installs and supervises loopback sidecars (9Router, CLIProxyAPI, Mux, Bifrost, open-wa) as routing targets via `/api/services/*`.'
      lenses: [composability, reliability]
      signature: 'POST /api/services/9router/{install|start|stop|restart|update|rotate-key}'
      notes: ['lifecycle is a state machine with an operation lock', 'also GET status and logs, POST auto-start per service']
      ref: /blob/3.8.51/docs/frameworks/EMBEDDED-SERVICES.md
    - id: open-sse-architecture
      name: 'open-sse engine'
      summary: 'Core streaming engine published as @omniroute/open-sse: pipeline stages route (combo.ts), translate, execute, stream, record.'
      lenses: [best-practice]
      notes: ['chatCore.ts is the central request handler', 'no Next.js dependency, usable from CLI or serverless']
      ref: /blob/3.8.51/docs/frameworks/OPEN_SSE_ARCHITECTURE.md
  - id: platform-features
    title: 'Memory, skills, webhooks, log export'
    level: intermediate
    requires: [management-api]
    ref: /blob/3.8.51/docs/frameworks/MEMORY.md
    entries:
    - id: memory-system
      name: 'Memory system'
      summary: 'Per-API-key memory extracted from responses and injected as a system message; off by default; SQLite FTS plus optional Qdrant.'
      lenses: [best-practice, security]
      signature: 'PUT /api/settings/memory {"memoryEnabled": false}'
      options:
      - {name: memoryEnabled, type: bool, default: 'false', desc: 'Off by default since 3.8.30.'}
      - {name: memoryMaxTokens, type: 'int 0-16000', default: '2000', desc: 'Injection token budget.'}
      - {name: memoryRetentionDays, type: 'int 1-365', default: '30', desc: 'Retention window.'}
      - {name: memoryStrategy, type: 'recent|semantic|hybrid', default: hybrid, desc: 'Retrieval strategy; recent maps to chronological exact retrieval.'}
      - {name: skillsEnabled, type: bool, default: 'false', desc: 'Per-key Omni skill injection.'}
      notes: ['settings live in the DB, not env; embedding cache and local model env vars are MEMORY_* optional', 'other routes: /api/memory/{engine-status,health,reindex,retrieve-preview,summarize}']
      ref: /blob/3.8.51/docs/frameworks/MEMORY.md
    - id: omni-skills
      name: 'Omni skills framework'
      summary: 'Skills injected as tools into outbound requests; OmniRoute intercepts tool calls and runs handlers, optionally in a Docker sandbox.'
      lenses: [composability, security]
      signature: 'POST /api/skills/install; POST /api/skills/executions'
      options:
      - {name: SKILLS_SANDBOX_NETWORK_ENABLED, type: bool, default: 'false', desc: 'Master egress gate for sandboxed commands.'}
      - {name: SKILLS_SANDBOX_TIMEOUT_MS, type: ms, default: '10000', desc: 'Default sandbox timeout, capped at 60 s.'}
      - {name: SKILLS_ALLOWED_SANDBOX_IMAGES, type: csv, default: 'alpine:3.20,node:22-alpine,python:3.12-alpine', desc: 'Extra allowed Docker images merged with the defaults.'}
      - {name: SKILLS_MAX_FILE_BYTES, type: bytes, default: '1048576', desc: 'Cap for file_read and file_write.'}
      notes: ['distinct from generated Agent Skills (SKILL.md files for coding agents)']
      ref: /blob/3.8.51/docs/frameworks/SKILLS.md
    - id: webhooks
      name: 'Webhooks'
      summary: 'HMAC-signed callbacks for request.completed, request.failed, quota.exceeded and test.ping; retried, auto-disabled on repeated failure.'
      lenses: [observability, reliability]
      signature: 'POST /api/webhooks {url, secret?, events: ["quota.exceeded"], description}'
      options:
      - {name: X-Webhook-Signature, type: header, default: null, desc: '`sha256=<hex HMAC-SHA256(secret, raw body)>`; verify against the raw body.'}
      notes: ['events accept "*"; 10 s timeout, up to 3 retries on 5xx or network error, 10 failures disable the hook', 'secret defaults to generated whsec_<hex>; GET list masks it', 'some non-test events lack production call sites at 3.8.51']
      ref: /blob/3.8.51/docs/frameworks/WEBHOOKS.md
    - id: log-export
      name: 'Log export'
      summary: 'Scheduled incremental export of call logs to an external store (BigQuery first) through `/api/log-export/destinations`.'
      lenses: [observability]
      signature: 'POST /api/log-export/destinations; POST .../{id}/run'
      notes: ['secret-bearing destinations require STORAGE_ENCRYPTION_KEY or the write returns 400', 'stored secrets read back as `__stored__`', 'GET /api/log-export/status shows cron state and backlog']
      ref: /blob/3.8.51/docs/frameworks/LOG-EXPORT.md
    - id: radar
      name: 'Radar free-model catalog'
      summary: 'Optional signed free-model catalog overlaid on the shipped baseline; gated by `RADAR_ENABLED` plus a separate data-sync opt-in.'
      lenses: [cost, security]
      options:
      - {name: RADAR_ENABLED, type: bool, default: 'false', desc: 'Enables the signed catalog client; data sync is a separate opt-in.'}
      notes: ['Ed25519 signature over exact bytes with a pinned key', 'payments and the research agent are private service, not in the OSS client']
      ref: /blob/3.8.51/docs/frameworks/RADAR.md
  - id: context-sources
    title: 'Context sources, plugins, tooling UIs'
    level: advanced
    requires: [mcp-server]
    ref: /blob/3.8.51/docs/frameworks/NOTION_CONTEXT.md
    entries:
    - id: notion-context
      name: 'Notion context source'
      summary: 'Save a Notion integration token at `/api/settings/notion` to expose six MCP tools for searching and editing pages.'
      lenses: [composability, security]
      signature: 'POST /api/settings/notion {"token": "ntn_..."}'
      notes: ['POST validates with a 1-result search and clears the token on failure', 'scoped MCP tools']
      ref: /blob/3.8.51/docs/frameworks/NOTION_CONTEXT.md
    - id: obsidian-context
      name: 'Obsidian context source'
      summary: 'Connect a vault via the Obsidian Local REST API (22 MCP tools, read:obsidian and write:obsidian scopes) or WebDAV sync.'
      lenses: [composability, security]
      signature: 'POST /api/settings/obsidian {"token": "...", "baseUrl": "http://127.0.0.1:27123"}'
      notes: ['URLs on port 27124 are rejected']
      ref: /blob/3.8.51/docs/frameworks/OBSIDIAN_CONTEXT.md
    - id: local-corpus-context
      name: 'Local corpus context source'
      summary: 'Expose one approved directory of text files to the MCP server through three read-only tools (read:local-corpus scope).'
      lenses: [composability, security]
      signature: 'POST /api/settings/local-corpus {"rootPath": "/absolute/dir"}'
      notes: ['only the root path is stored; search returns up to 20 bounded snippets with relative paths']
      ref: /blob/3.8.51/docs/frameworks/LOCAL_CORPUS_CONTEXT.md
    - id: plugins-runtime
      name: 'Request-pipeline plugins'
      summary: 'Plugins with a plugin.json manifest hook onRequest, onResponse and onError, run in a sandboxed VM, and are managed via `/api/plugins`.'
      lenses: [composability, security]
      options:
      - {name: OMNIROUTE_PLUGINS_DIR, type: path, default: '~/.omniroute/plugins', desc: 'Plugin tree location, set explicitly for Docker and Kubernetes bind mounts.'}
      notes: ['plugin routes are loopback-only; marketplace registry URL has an SSRF guard']
      ref: /blob/3.8.51/docs/frameworks/PLUGIN_MARKETPLACE.md
    - id: plugin-sdk
      name: 'Plugin SDK'
      summary: '`definePlugin` with blockRequest, modifyBody and addMetadata helpers; globals are unavailable without declared permissions.'
      lenses: [composability, security]
      import: 'import { definePlugin } from "omniroute/plugins/sdk"'
      signature: 'definePlugin({name, priority, onRequest, onResponse, onError})'
      options:
      - {name: permissions, type: 'network|file-read|file-write|env|exec', default: null, desc: 'Each grants the matching sandbox globals; absent means unavailable.'}
      ref: /blob/3.8.51/docs/frameworks/PLUGIN_SDK.md
    - id: cli-plugins
      name: 'CLI plugins'
      summary: 'Extend the `omniroute` CLI with `omniroute-cmd-*` packages installed through `omniroute plugin install|list`.'
      lenses: [composability]
      signature: 'omniroute plugin install <npm-name|./path>'
      ref: /blob/3.8.51/docs/frameworks/PLUGINS.md
    - id: opencode-provider
      name: 'OpenCode integration'
      summary: 'Generate the OpenCode provider config with a CLI generator or the @omniroute/opencode-provider npm package.'
      lenses: [composability]
      notes: ['writes ~/.config/opencode/opencode.json']
      ref: /blob/3.8.51/docs/frameworks/OPENCODE.md
    - id: agentbridge
      name: 'AgentBridge MITM'
      summary: 'TLS-intercepting proxy that reroutes ten IDE agents (Antigravity, Kiro, Copilot, Codex and more) through OmniRoute without agent changes.'
      lenses: [security, composability]
      notes: ['needs a trusted CA cert and DNS routing; Electron IDEs ignore the OS trust store (set NODE_EXTRA_CA_CERTS)', 'the docs carry a risk notice']
      ref: /blob/3.8.51/docs/frameworks/AGENTBRIDGE.md
    - id: traffic-inspector
      name: 'Traffic Inspector'
      summary: 'LLM-aware HTTPS traffic debugger with five capture modes, including an explicit HTTP_PROXY listener on port 8080.'
      lenses: [observability]
      options:
      - {name: INSPECTOR_HTTP_PROXY_PORT, type: port, default: '8080', desc: 'Explicit proxy listener port; a conflict returns 409.'}
      notes: ['HTTPS CONNECT bodies are metadata only unless the decrypt toggle is enabled']
      ref: /blob/3.8.51/docs/frameworks/TRAFFIC_INSPECTOR.md
    - id: playground-studio
      name: 'Playground Studio'
      summary: 'Dashboard workspace with chat, compare, API and build tabs; prompt-improver and preset routes under `/api/playground`.'
      lenses: [testing, ux-a11y]
      signature: 'POST /api/playground/improve-prompt; /api/playground/presets'
      ref: /blob/3.8.51/docs/frameworks/PLAYGROUND_STUDIO.md
    - id: search-tools-studio
      name: 'Search Tools Studio'
      summary: 'Dashboard workspace unifying web search, scraping and provider comparison, backed by an extended `GET /api/search/providers`.'
      lenses: [composability]
      signature: 'GET /api/search/providers'
      ref: /blob/3.8.51/docs/frameworks/SEARCH_TOOLS_STUDIO.md
- title: 'Client and CLI integration'
  sections:
  - id: cli-clients
    title: 'Pointing coding tools at the gateway'
    level: intermediate
    requires: [inference-api]
    ref: /blob/3.8.51/docs/guides/CLI-INTEGRATIONS.md
    entries:
    - id: cli-setup-commands
      name: 'setup-* commands'
      summary: 'omniroute setup-codex|claude|opencode|cline|kilo|continue|crush|goose|aider|qwen read the live catalog and write each tool''s own config.'
      lenses: [reuse, composability]
      signature: 'omniroute setup-<tool> [--remote <url> --api-key <key>] [--only <patterns>] [--dry-run]'
      options:
      - {name: --remote, type: url, default: null, desc: 'Fetch the catalog from a remote OmniRoute; overrides --port and the active context.'}
      - {name: --only, type: csv, default: null, desc: 'Keep only model ids containing one of the substrings.'}
      - {name: --dry-run, type: flag, default: null, desc: 'Print what would be written (all except setup-cursor, which never writes).'}
      notes: ['`omniroute run <target>`, `omniroute launch` (Claude Code) and `launch-codex` spawn the CLI with env injected and write nothing', 'the API key is referenced by env var where the tool supports it']
      ref: /blob/3.8.51/docs/guides/CLI-INTEGRATIONS.md
    - id: cli-tools-reference
      name: 'CLI tools catalog'
      summary: 'Dashboard catalogs 26 coding CLIs and 10 agents pointed at OmniRoute, plus ACP agents OmniRoute spawns; apply route `/api/cli-tools/apply`.'
      lenses: [reuse]
      notes: ['legacy /dashboard/cli-tools redirects 308 to /dashboard/cli-code']
      ref: /blob/3.8.51/docs/reference/CLI-TOOLS.md
    - id: claude-code-config
      name: 'Claude Code config'
      summary: 'Claude Code uses the Anthropic Messages API via ANTHROPIC_BASE_URL (no /v1 suffix) and ANTHROPIC_AUTH_TOKEN; env is read once at startup.'
      lenses: [composability]
      signature: 'ANTHROPIC_BASE_URL=http://localhost:20128 ANTHROPIC_AUTH_TOKEN=<key> claude'
      options:
      - {name: CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY, type: '0|1', default: null, desc: 'Lists claude*/anthropic* models from /v1/models in the /model picker.'}
      - {name: ANTHROPIC_MODEL, type: string, default: null, desc: 'Force a model, overriding the picker default.'}
      notes: ['ANTHROPIC_AUTH_TOKEN wins over ANTHROPIC_API_KEY', 'profiles via CLAUDE_CONFIG_DIR']
      ref: /blob/3.8.51/docs/guides/CLAUDE-CODE-CONFIGURATION.md
    - id: codex-cli-config
      name: 'Codex CLI config'
      summary: 'Codex reads only ~/.codex/config.toml; point a model_providers entry at /v1 with wire_api responses and the key in an env var.'
      lenses: [composability]
      signature: '[model_providers.omniroute] base_url="http://host:20128/v1" env_key="OMNIROUTE_API_KEY" wire_api="responses"'
      notes: ['old config.yaml is silently ignored', 'cx/ model prefix routes to the Codex provider', 'reasoning effort and context window keys live in the same TOML']
      ref: /blob/3.8.51/docs/guides/CODEX-CLI-CONFIGURATION.md
    - id: codex-app-server
      name: 'Codex app-server provider'
      summary: '`codex-app-server` drives the Codex CLI''s own app-server over JSON-RPC so OmniRoute never replays an OAuth token.'
      lenses: [security]
      notes: ['needs a reachable Codex CLI; the plain codex provider replays the ChatGPT OAuth token and carries a usage caveat']
      ref: /blob/3.8.51/docs/guides/CODEX-APP-SERVER-PROVIDER.md
    - id: cli-companion
      name: 'CLI companion'
      summary: 'Copy-only dashboard helper; detection status describes the OmniRoute server machine, not the browser''s machine.'
      lenses: [ux-a11y]
      ref: /blob/3.8.51/docs/guides/CLI-COMPANION.md
    - id: cli-manual-models
      name: 'CLI model catalog'
      summary: '`omniroute models` reads the public catalog (json/jsonl output returns all rows) and supports manual model metadata.'
      lenses: [reuse]
      signature: 'omniroute models --output json'
      notes: ['legacy /api/models fallback only on 404, 405 or 501']
      ref: /blob/3.8.51/docs/guides/CLI-MANUAL-MODELS.md
    - id: cli-smoke-tests
      name: 'CLI smoke harness'
      summary: 'Optional script runs installed Aider, Goose, OpenCode, Qwen Code or Codex against the gateway; exit 1 on FAIL, 2 on HOLD.'
      lenses: [testing]
      signature: 'node scripts/cli/smoke-cli-integrations.mjs --targets qwen,codex --json'
      ref: /blob/3.8.51/docs/guides/CLI-SMOKE-TESTS.md
    - id: remote-mode
      name: 'Remote mode'
      summary: '`omniroute connect <host>` stores a scoped token so every CLI command targets a remote server; scopes read, write, admin.'
      lenses: [security, composability]
      signature: 'omniroute connect <host>'
      notes: ['scopes are hierarchical admin > write > read', 'routes that spawn processes (/api/services, /api/mcp) stay loopback-only for any token', 'insufficient scope returns 403']
      ref: /blob/3.8.51/docs/guides/REMOTE-MODE.md
    - id: opencode-v2-plugin
      name: 'OpenCode v2 plugin'
      summary: '@omniroute/opencode-plugin-v2 puts models, combos and auto-combos into the OpenCode v2 picker; separate from the v1 plugin.'
      lenses: [composability]
      notes: ['uses a management token distinct from the inference key']
      ref: /blob/3.8.51/docs/guides/OPENCODE-V2-PLUGIN.md
    - id: vscode-copilot
      name: 'OmniCopilot (VS Code)'
      summary: 'VS Code extension that lists every OmniRoute model in the native Copilot Chat picker.'
      lenses: [composability]
      ref: /blob/3.8.51/docs/guides/VSCODE-COPILOT.md
  - id: operator-guides
    title: 'Operator guides'
    level: intermediate
    requires: [container-ops]
    ref: /blob/3.8.51/docs/guides/USER_GUIDE.md
    entries:
    - id: user-guide
      name: 'User guide'
      summary: 'Provider setup, combos, deployment (npm, PM2, Docker), custom OpenAI-compatible nodes, sticky sessions and wildcard aliases.'
      lenses: [best-practice]
      notes: ['custom node prefixes cannot be built-in provider ids or aliases (reserved)', 'send X-Session-Id for external session affinity; the effective key returns in X-OmniRoute-Session-Id', 'wildcard model aliases support * and ? (claude-sonnet-* maps to a target)']
      ref: /blob/3.8.51/docs/guides/USER_GUIDE.md
    - id: setup-guide
      name: 'Setup guide and timeouts'
      summary: 'Install methods, MCP and A2A setup, split-port mode and the shared timeout variables.'
      lenses: [reliability]
      options:
      - {name: REQUEST_TIMEOUT_MS, type: ms, default: '600000', desc: 'Baseline for upstream response-start, hidden Undici and bridge timeouts.'}
      - {name: STREAM_IDLE_TIMEOUT_MS, type: ms, default: inherits REQUEST_TIMEOUT_MS, desc: 'Max gap between streaming chunks before the SSE stream aborts.'}
      - {name: FETCH_CONNECT_TIMEOUT_MS, type: ms, default: '30000', desc: 'Undici TCP connect timeout.'}
      - {name: DASHBOARD_PORT, type: port, default: null, desc: 'With PORT, serves dashboard and API on separate ports (split-port mode).'}
      notes: ['reverse proxy timeouts must exceed OmniRoute stream and fetch timeouts', 'for streams FETCH_TIMEOUT_MS only covers waiting for the first response']
      ref: /blob/3.8.51/docs/guides/SETUP_GUIDE.md
    - id: features-gallery
      name: 'Dashboard features gallery'
      summary: 'Tour of dashboard sections and headline features; lists auto prefixes lkgp and chaos and 19 public combo strategies.'
      lenses: [best-practice]
      ref: /blob/3.8.51/docs/guides/FEATURES.md
    - id: troubleshooting
      name: 'Troubleshooting'
      summary: 'Runbook for 429s, circuit breakers stuck OPEN, cooldowns, proxies, Docker and chat admission 503s.'
      lenses: [reliability]
      signature: 'DELETE /api/resilience/model-cooldowns'
      notes: ['chat_admission_busy is a retryable 503 with Retry-After; inspect GET /api/monitoring/health chatAdmission before tuning', 'heavy means 200+ messages, 64+ tools or 32000+ estimated tokens', 'admission knobs: OMNIROUTE_CHAT_ADMISSION_QUEUE_MS, OMNIROUTE_CHAT_MAX_INFLIGHT_BYTES, OMNIROUTE_CHAT_MAX_HEAVY_IN_FLIGHT (count cap only when set)']
      ref: /blob/3.8.51/docs/guides/TROUBLESHOOTING.md
    - id: local-ollama-docker
      name: 'Local Ollama behind Docker'
      summary: 'Containerized OmniRoute reaching host Ollama via host.docker.internal; slow local models need longer response-start and idle timeouts.'
      lenses: [reliability]
      options:
      - {name: OMNIROUTE_LOCAL_DIRECT_HEADERS_TIMEOUT_MS, type: ms, default: '300000 (auto for local targets from 3.8.51)', desc: 'Response-start floor for localhost and private-network targets.'}
      - {name: RATE_LIMIT_EXECUTION_MAX_WAIT_MS, type: ms, default: null, desc: 'Raise with RATE_LIMIT_MAX_WAIT_MS when queued streams hit RATE_LIMIT_EXECUTION_TIMEOUT.'}
      ref: /blob/3.8.51/docs/guides/LOCAL_OLLAMA_DOCKER.md
    - id: kiro-setup
      name: 'Kiro multi-account'
      summary: 'Each Kiro OIDC client registration holds one session, so accounts need separate registrations; API-key import at `/api/oauth/kiro/api-key`.'
      lenses: [reliability]
      signature: 'POST /api/oauth/kiro/api-key {apiKey, region}'
      ref: /blob/3.8.51/docs/guides/KIRO_SETUP.md
    - id: antigravity-onboarding
      name: 'Antigravity onboarding'
      summary: 'Google One AI Pro quota via Antigravity needs a projectId (auto or via the agy CLI) and an OAuth redirect workaround.'
      lenses: [best-practice]
      ref: /blob/3.8.51/docs/guides/ANTIGRAVITY-ONBOARDING.md
  - id: cost-and-reasoning
    title: 'Cost, quota and reasoning controls'
    level: intermediate
    requires: [management-api]
    ref: /blob/3.8.51/docs/guides/COST_TRACKING.md
    entries:
    - id: cost-tracking
      name: 'Cost tracking'
      summary: 'Per-request USD cost from token counts times pricing; a savings tracker, not a bill; analytics, budgets and pricing routes.'
      lenses: [cost, observability]
      signature: 'GET /api/usage/analytics?range=; POST /api/usage/budget'
      returns: 'Budget GET returns dailyLimitUsd, weeklyLimitUsd, monthlyLimitUsd, warningThreshold and running totals.'
      notes: ['pricing: GET/PATCH/DELETE /api/pricing, POST /api/pricing/sync pulls LiteLLM rates', 'CLI: omniroute cost, usage, pricing', 'budget is scoped per API key (apiKeyId)']
      ref: /blob/3.8.51/docs/guides/COST_TRACKING.md
    - id: usage-quota
      name: 'Usage and quota enforcement'
      summary: 'Records tokens and cost per request and enforces per-API-key quota with a warning level, hard limit and day/week/month/all window.'
      lenses: [cost, reliability]
      options:
      - {name: quotaLimit, type: money, default: null, desc: 'Hard stop for the key.'}
      - {name: quotaWarnAt, type: money, default: null, desc: 'Warning level.'}
      - {name: quotaWindow, type: 'day|week|month|all', default: null, desc: 'Window the limits apply to.'}
      ref: /blob/3.8.51/docs/guides/USAGE_QUOTA_GUIDE.md
    - id: thinking-budget
      name: 'Thinking budget setting'
      summary: 'Global setting that passes through, strips (auto), fixes (custom) or scales (adaptive) client reasoning and thinking fields.'
      lenses: [cost, composability]
      signature: 'PUT /api/settings/thinking-budget {"mode": "passthrough"}'
      options:
      - {name: mode, type: 'passthrough|auto|custom|adaptive', default: passthrough, desc: 'auto deletes reasoning, thinking and thinking_config fields before upstream.'}
      - {name: customBudget, type: int, default: null, desc: 'Fixed thinking-token budget for custom mode.'}
      - {name: effortLevel, type: string, default: null, desc: 'Base effort for adaptive mode.'}
      notes: ['also baseBudget and complexityMultiplier', 'keep passthrough for clients that need visible reasoning']
      ref: /blob/3.8.51/docs/guides/THINKING_BUDGET.md
    - id: tiers
      name: 'Provider tiers'
      summary: 'Providers grouped into subscription, cheap and free tiers tried in order, assignable in the dashboard.'
      lenses: [cost]
      ref: /blob/3.8.51/docs/guides/TIERS.md
    - id: chaos-mode
      name: 'Chaos mode'
      summary: 'Fans one task to several providers in parallel or collaborative mode via `auto/chaos` or `POST /api/skills/collect/chaos`.'
      lenses: [composability, cost]
      signature: 'POST /api/skills/collect/chaos {"task": "...", "mode": "parallel"}'
      notes: ['disabled by default; the API key needs the chaosModeEnabled permission', 'does not affect normal /v1/chat/completions traffic']
      ref: /blob/3.8.51/docs/guides/CHAOS-MODE.md
    - id: free-provider-rankings
      name: 'Free provider rankings'
      summary: 'Arena-ELO ranking of free providers by task category via a public read endpoint.'
      lenses: [cost]
      signature: 'GET /api/free-provider-rankings?category=coding&limit=20'
      params:
      - {name: category, type: 'default|coding|review|documentation|debugging', default: null, desc: 'Omit for the combined ranking.'}
      ref: /blob/3.8.51/docs/guides/FREE_PROVIDER_RANKINGS.md
- title: 'Prompt compression'
  sections:
  - id: compression
    title: 'Compression engines and rules'
    level: advanced
    requires: [prompt-compression]
    ref: /blob/3.8.51/docs/compression/COMPRESSION_ENGINES.md
    entries:
    - id: compression-engines
      name: 'Compression modes and routes'
      summary: 'Modes off, lite, standard, aggressive, ultra, rtk, omniglyph, stacked over Caveman, RTK or LLMLingua-2 engines; routes under /api/context.'
      lenses: [cost, perf]
      signature: 'POST /api/compression/preview'
      options:
      - {name: defaultMode, type: 'off|lite|standard|aggressive|ultra|rtk|omniglyph|stacked', default: null, desc: 'stacked defaults to session-dedup then lite; rtk then caveman is opt-in.'}
      - {name: stackedPipeline, type: 'array of {engine, intensity}', default: null, desc: 'Ordered engine pipeline for stacked mode.'}
      notes: ['routes: /api/settings/compression, /api/compression/language-packs, /api/context/rtk/{config,filters,test}, /api/context/combos[/{id}/assignments], /api/context/analytics', 'five MCP tools omniroute_compression_* with read:compression and write:compression scopes']
      ref: /blob/3.8.51/docs/compression/COMPRESSION_ENGINES.md
    - id: rtk-compression
      name: 'RTK engine'
      summary: 'Command-aware compression of terminal, test and build output with filters, dedup, grouping, comment stripping and 3 intensity levels.'
      lenses: [cost]
      signature: 'PUT /api/context/rtk/config'
      options:
      - {name: rtkConfig.applyToToolResults, type: bool, default: null, desc: 'Compress tool result messages.'}
      - {name: rtkConfig.maxLinesPerResult, type: int, default: null, desc: 'Cap per tool result (docs example 120 lines, 12000 chars).'}
      - {name: autoTriggerTokens, type: int, default: null, desc: 'Token count above which autoTriggerMode applies (example 32000).'}
      notes: ['raw output is recoverable through an authenticated redacted route', 'RTK reports 60-90% savings on command output']
      ref: /blob/3.8.51/docs/compression/RTK_COMPRESSION.md
    - id: compression-language-packs
      name: 'Caveman language packs'
      summary: 'Language-specific Caveman rule packs chosen by a lightweight detector; configured through `languageConfig`.'
      lenses: [best-practice]
      options:
      - {name: languageConfig.autoDetect, type: bool, default: null, desc: 'Infer language from the prompt; only selects rule packs.'}
      - {name: languageConfig.enabledPacks, type: 'string[]', default: null, desc: 'Packs loaded (docs example en, pt-BR, es, id, de, fr, ja).'}
      ref: /blob/3.8.51/docs/compression/COMPRESSION_LANGUAGE_PACKS.md
    - id: compression-rules-format
      name: 'Compression rule JSON'
      summary: 'Data-only JSON packs for Caveman replacements and RTK filters, validated against `_schema.json`.'
      lenses: [typing-dx]
      ref: /blob/3.8.51/docs/compression/COMPRESSION_RULES_FORMAT.md
    - id: extending-compression
      name: 'Extending compression'
      summary: 'Three extension points: custom CompressionEngine implementations, new language packs and stacked pipelines.'
      lenses: [composability]
      ref: /blob/3.8.51/docs/compression/EXTENDING_COMPRESSION.md
    - id: context-editing
      name: 'Delegated context editing'
      summary: 'Claude-only `contextEditing.enabled` makes OmniRoute send `context_management.edits[]` so Anthropic clears stale tool results itself.'
      lenses: [cost]
      options:
      - {name: contextEditing.enabled, type: bool, default: 'false', desc: 'Part of the compression config; scoped to Claude and Claude Code compatible relays with a 400 fallback.'}
      ref: /blob/3.8.51/docs/compression/CONTEXT_EDITING.md
- title: 'Security and access control'
  sections:
  - id: security-posture
    title: 'Auth posture, CORS, route guard, audit'
    level: intermediate
    requires: [container-ops]
    ref: /blob/3.8.51/docs/security/INFERENCE_AUTH_POSTURE.md
    entries:
    - id: inference-auth-posture
      name: 'Inference auth posture'
      summary: 'Catalog and inference routes use different gates; probe POST /v1/chat/completions, where 401 means REQUIRE_API_KEY enforces.'
      lenses: [security, testing]
      signature: 'curl -X POST http://host:20128/v1/chat/completions -d {...}  # expect 401'
      options:
      - {name: requireAuthForModels, type: bool, default: null, desc: 'Per-instance override for the catalog endpoint.'}
      notes: ['with REQUIRE_API_KEY=false an invalid bearer degrades to anonymous, so a junk key is not a valid probe']
      ref: /blob/3.8.51/docs/security/INFERENCE_AUTH_POSTURE.md
    - id: cors-config
      name: 'CORS allowlist'
      summary: 'Fail-closed origin allowlist; set CORS_ALLOWED_ORIGINS and never CORS_ALLOW_ALL=true in production.'
      lenses: [security]
      options:
      - {name: CORS_ALLOWED_ORIGINS, type: csv, default: null, desc: 'Explicit browser origins allowed to read cross-origin responses.'}
      - {name: CORS_ALLOW_ALL, type: bool, default: null, desc: 'Wildcard; dashboard shows a persistent warning banner while live.'}
      notes: ['API keys are unaffected by CORS (non-browser clients)', 'do not forge X-Forwarded-For to bypass the loopback guard']
      ref: /blob/3.8.51/docs/security/CORS.md
    - id: route-guard-tiers
      name: 'Route guard tiers'
      summary: 'Static three-tier classification: LOCAL_ONLY loopback routes that spawn processes, ALWAYS_PROTECTED, and MANAGEMENT default.'
      lenses: [security]
      notes: ['loopback check runs before any auth branch, so a leaked token over a tunnel cannot reach spawn routes', 'narrow carve-out for keys carrying the `manage` scope on selected prefixes', 'fresh-install bootstrap is loopback-only by real peer address']
      ref: /blob/3.8.51/docs/security/ROUTE_GUARD_TIERS.md
    - id: cli-token
      name: 'CLI machine-id token'
      summary: 'CLI authenticates to the local management API with an HMAC of the machine id in `x-omniroute-cli-token`, sent only to loopback URLs.'
      lenses: [security]
      options:
      - {name: x-omniroute-cli-token, type: header, default: null, desc: 'HMAC-SHA256(machine-id, salt) hex; requests use redirect:error so it cannot be forwarded.'}
      ref: /blob/3.8.51/docs/security/CLI_TOKEN.md
    - id: cli-config-routes
      name: 'CLI config preview routes'
      summary: 'The /api/cli-tools/config and /apply routes return redacted previews and reject unknown fields and credentialed URLs.'
      lenses: [security]
      notes: ['batch preview takes the key from the x-omniroute-config-api-key header, never the query string']
      ref: /blob/3.8.51/docs/security/CLI-CONFIGURATION.md
    - id: compliance-audit
      name: 'Audit log and no-log keys'
      summary: 'Admin, auth and MCP tool events go to audit tables; per-key `noLog` stops call logging; retention env vars bound table size.'
      lenses: [security, observability]
      signature: 'POST /api/keys {"name": "Privacy key", "noLog": true}'
      options:
      - {name: APP_LOG_RETENTION_DAYS, type: int, default: '7', desc: 'Retention for audit_log and mcp_tool_audit.'}
      - {name: CALL_LOG_RETENTION_DAYS, type: int, default: '7', desc: 'Retention for usage_history, call_logs, proxy_logs and request_detail_logs.'}
      - {name: CALL_LOGS_TABLE_MAX_ROWS, type: int, default: '100000', desc: 'Row cap for call_logs (PROXY_LOGS_TABLE_MAX_ROWS caps proxy_logs).'}
      - {name: NO_LOG_API_KEY_IDS, type: csv, default: null, desc: 'Preloads no-log key ids.'}
      notes: ['query with GET /api/compliance/audit-log', 'audit writes never throw']
      ref: /blob/3.8.51/docs/security/COMPLIANCE.md
    - id: ban-detection
      name: 'Account ban detection'
      summary: 'Upstream error bodies matching banned signals mark a connection permanently banned (1-year cooldown); custom keywords add to built-ins.'
      lenses: [reliability, security]
      signature: 'PATCH /api/settings {"customBannedSignals": ["account permanently banned"]}'
      options:
      - {name: autoDisableBannedAccounts, type: bool, default: null, desc: 'Also sets isActive false; scope via autoDisableBannedScope (all or subscription).'}
      notes: ['raw substring match: broad words like quota or error ban healthy connections', 'each keyword max 200 chars']
      ref: /blob/3.8.51/docs/security/BAN_DETECTION.md
    - id: egress-policy
      name: 'Egress IP family policy'
      summary: 'Per-proxy `family` of auto, ipv4 or ipv6 pins outbound connections to one IP family, failing closed.'
      lenses: [security, reliability]
      signature: 'POST /api/v1/management/proxies {name, type, host, port, family: "ipv6"}'
      ref: /blob/3.8.51/docs/security/EGRESS_POLICY.md
    - id: error-sanitization
      name: 'Error message sanitization'
      summary: 'Contributor rule: every client-facing error goes through public builders in error.ts that redact paths and secrets.'
      lenses: [security]
      notes: ['covers HTTP routes, SSE streams, executors and MCP handlers']
      ref: /blob/3.8.51/docs/security/ERROR_SANITIZATION.md
  - id: stealth-and-capture
    title: 'Client fingerprints and TLS capture'
    level: advanced
    requires: [security-posture]
    ref: /blob/3.8.51/docs/security/STEALTH_GUIDE.md
    entries:
    - id: stealth-guide
      name: 'Stealth and CLI compat'
      summary: 'TLS and header fingerprinting so official-account CLIs work through the gateway; user-agent env overrides and CLI_COMPAT_* toggles.'
      lenses: [reliability]
      options:
      - {name: CLI_COMPAT_ALL, type: '0|1', default: null, desc: 'Enable every CLI wire-image fingerprint (CLI_COMPAT_CODEX, _CLAUDE, _GITHUB, _KIRO, _CURSOR, ...).'}
      - {name: CLAUDE_USER_AGENT, type: string, default: 'claude-cli/2.1.258 (external, cli)', desc: 'Override; stale values get rejected, bump when the CLI releases.'}
      notes: ['toggles reshape the wire image only; provider egress IP is unchanged', 'ANTIGRAVITY_CREDITS=always is an account-ban risk']
      ref: /blob/3.8.51/docs/security/STEALTH_GUIDE.md
    - id: agentrouter-waf
      name: 'AgentRouter WAF'
      summary: 'Upstream keyword filter returns 400 content-blocked; OmniRoute spaces requests 500 ms and retries twice with backoff.'
      lenses: [reliability]
      notes: ['burst-sensitive, partly probabilistic']
      ref: /blob/3.8.51/docs/security/AGENTROUTER_WAF.md
    - id: mitm-tproxy
      name: 'TPROXY transparent decrypt'
      summary: 'Linux capture mode 5: kernel TPROXY plus a per-SNI dynamic CA, started via `POST /api/tools/agent-bridge/tproxy`; needs root.'
      lenses: [security, observability]
      signature: 'POST /api/tools/agent-bridge/tproxy {dport, mark, onPort, routeTable, bypassMark}'
      notes: ['no environment variables; defaults dport 443, onPort 8443', 'firewall rules apply transactionally and flush on reboot']
      ref: /blob/3.8.51/docs/security/MITM-TPROXY-DECRYPT.md
- title: 'Operations and observability'
  sections:
  - id: ops-runtime
    title: 'Health, storage, networking, deployment'
    level: intermediate
    requires: [container-ops]
    ref: /blob/3.8.51/docs/ops/MONITORING_GUIDE.md
    entries:
    - id: monitoring-guide
      name: 'Monitoring and probes'
      summary: 'Light `/healthz` for readiness and deep `/api/monitoring/health` for dashboards; provider and combo health autopilots and quota monitors.'
      lenses: [observability, reliability]
      signature: 'GET /healthz | GET /livez | GET /api/monitoring/health'
      returns: 'Deep health: status, version, uptime, checks (database, integrity, heap_pressure, providers) and credentialHealth probe-cache gauge.'
      notes: ['deep health is too heavy for kubelet liveness; use /livez or TCP on PORT', 'all probes share the event loop with request handling', 'MCP tool observability_snapshot returns the full matrices']
      ref: /blob/3.8.51/docs/ops/MONITORING_GUIDE.md
    - id: adaptive-routing-events
      name: 'Routing events and OTLP export'
      summary: 'Routing outcome events feed auto-combo quality scoring, explain via `GET /v1/explain/routing`, and can export GenAI-convention OTLP spans.'
      lenses: [observability]
      signature: 'GET /v1/explain/routing'
      options:
      - {name: OMNIROUTE_OTEL_ENDPOINT, type: url, default: null, desc: 'Enables the dependency-free OTLP/HTTP trace exporter (POSTs to {endpoint}/v1/traces); OTEL_EXPORTER_OTLP_ENDPOINT is a fallback.'}
      - {name: OTEL_SERVICE_NAME, type: string, default: omniroute, desc: 'service.name resource attribute.'}
      notes: ['events carry routing metadata only, never prompts or credentials', 'per-invocation combo trace header X-OmniRoute-Combo-Trace']
      ref: /blob/3.8.51/docs/architecture/ADAPTIVE_ROUTING.md
    - id: chat-admission-lanes
      name: 'Chat admission lanes'
      summary: 'Byte-budget admission sheds heavy chat bodies (413 body_exceeds_budget, 503 chat_admission_busy); optional virtual lanes per tenant key.'
      lenses: [reliability, perf]
      options:
      - {name: OMNIROUTE_CHAT_MAX_INFLIGHT_BYTES, type: bytes, default: auto from memory ceiling, desc: 'Ingest byte budget (25% of heap or cgroup limit over 8, clamped 8 MiB to 2 GiB).'}
      - {name: OMNIROUTE_CHAT_VIRTUAL_LANES, type: bool, default: 'false', desc: 'Opt-in adaptive per-tenant lanes; report under health adaptiveAdmission.'}
      notes: ['a body that cannot fit the budget fails immediately with 413; contention queues up to OMNIROUTE_CHAT_ADMISSION_QUEUE_MS', 'one process-global controller; the key hash is only a fairness key']
      ref: /blob/3.8.51/docs/architecture/admission-lanes.md
    - id: database-guide
      name: 'Database and backups'
      summary: 'SQLite WAL store with AES-256-GCM field encryption; versioned migrations and backup create or restore through CLI or `/api/db-backups`.'
      lenses: [reliability, security]
      signature: 'omniroute backup create --name <n> | PUT /api/db-backups {"name": "<n>"}'
      notes: ['backup includes settings and secrets (encrypted), plugin config and optional call-log artifacts']
      ref: /blob/3.8.51/docs/ops/DATABASE_GUIDE.md
    - id: sqlite-runtime
      name: 'SQLite driver resolution'
      summary: 'Five-step fallback from bundled to runtime-installed better-sqlite3; single-writer, so no HA and restarts drop in-flight SSE.'
      lenses: [reliability]
      notes: ['never attach two replicas to one storage.sqlite', 'prefer TCP liveness plus /healthz readiness']
      ref: /blob/3.8.51/docs/ops/SQLITE_RUNTIME.md
    - id: redis-config
      name: 'Redis configuration'
      summary: 'Optional soft dependency (rate limiter, quota, breaker stores); key prefix and URL env vars, in-memory fallback when absent.'
      lenses: [reliability, perf]
      options:
      - {name: REDIS_URL, type: url, default: null, desc: 'Optional Redis for shared limiter state.'}
      - {name: REDIS_KEY_PREFIX, type: string, default: 'omniroute:', desc: 'Prefix applied to every key.'}
      ref: /blob/3.8.51/docs/ops/REDIS_PRODUCTION_CONFIG.md
    - id: proxy-guide
      name: 'Upstream proxies'
      summary: 'HTTP, HTTPS or SOCKS5 proxy registry resolved per connection, then provider, combo, then global; includes a free proxy marketplace.'
      lenses: [security, reliability]
      notes: ['first match wins, so a global fallback can be overridden per provider or connection']
      ref: /blob/3.8.51/docs/ops/PROXY_GUIDE.md
    - id: tunnels-guide
      name: 'Tunnels'
      summary: 'Expose the local server through Cloudflare (quick or named), ngrok or Tailscale Funnel via `/api/tunnels`; needed for OAuth callbacks.'
      lenses: [security]
      options:
      - {name: CLOUDFLARED_CONFIG, type: path, default: null, desc: 'Runs a named persistent tunnel instead of a quick tunnel.'}
      - {name: CLOUDFLARED_PROTOCOL, type: 'http2|quic|auto', default: http2, desc: 'Tunnel transport.'}
      notes: ['tunnel URL changes break OAuth redirect URIs']
      ref: /blob/3.8.51/docs/ops/TUNNELS_GUIDE.md
    - id: vm-deployment
      name: 'VM deployment with Cloudflare'
      summary: 'VPS install with Docker, nginx reverse proxy and Cloudflare origin certificates and DNS.'
      lenses: [security]
      ref: /blob/3.8.51/docs/ops/VM_DEPLOYMENT_GUIDE.md
    - id: flyio-deployment
      name: 'Fly.io deployment'
      summary: 'Verified Fly.io recipe: create the app, set INITIAL_PASSWORD and secrets, deploy, then post-deploy checks.'
      lenses: [reliability]
      ref: /blob/3.8.51/docs/ops/FLY_IO_DEPLOYMENT_GUIDE.md
  - id: platform-api
    title: 'Gateway control-plane API and architecture'
    level: advanced
    requires: [management-api]
    ref: /blob/3.8.51/docs/architecture/AUTHZ_GUIDE.md
    entries:
    - id: authz-guide
      name: 'Authorization pipeline'
      summary: 'Fail-closed route classes; Bearer keys with `manage` scope or session cookies reach management routes; MCP scopes opt-in enforced.'
      lenses: [security]
      options:
