stack: react
version: "19.2.8"
docs_base: https://react.dev
source: https://react.dev/llms.txt (live ToC; docs track React 19.3, released 2026-09-09; installed 19.2.8)
  + per-page .md fetches
fetched: 2026-10-05
verified: 2026-10-05
toc:
- index: 'https://react.dev/llms.txt'
  match: '^https://react\.dev/(reference|learn)/'
groups:
- title: AI tooling
  sections:
  - id: ai-docs
    title: Machine-readable docs and lint guards
    level: basic
    requires: []
    ref: /llms.txt
    entries:
    - id: llms-txt
      name: react.dev llms.txt + page Markdown
      summary: '/llms.txt index, append `.md` to any react.dev page (no llms-full.txt: 404 on 2026-10-05)'
      lenses: [reuse]
      notes: [docs describe the latest (19.3); check the installed version before using 19.3-only APIs]
      ref: /llms.txt
      returns: Markdown index of react.dev pages; each page fetchable as `<path>.md` for agent-readable
        reference
    - id: hooks-lint
      name: eslint-plugin-react-hooks
      summary: 'ESLint plugin enforcing the Rules of React: rules-of-hooks, exhaustive-deps and the compiler-derived
        lints'
      lenses: [best-practice, reliability]
      signature: recommended
      notes: [v7.1.1 via eslint-config-next]
      ref: /reference/eslint-plugin-react-hooks
      options:
      - {name: recommended, type: preset, default: —, desc: 'rules-of-hooks, exhaustive-deps, purity,
          refs, immutability, set-state-in-effect, set-state-in-render, static-components, error-boundaries'}
      - {name: compiler lints, type: rules, default: on in recommended, desc: 'compiler diagnostics (purity,
          immutability, refs, ...) also flag code the compiler would skip'}
    - id: react-devtools-cli
      name: React DevTools via agent-browser
      summary: Inspect the live component tree (incl. pending Suspense) from an agent via agent-browser
        instead of the DevTools extension
      lenses: [observability, testing]
      signature: agent-browser open --enable react-devtools, react tree
      notes: [workflow from nextjs.org/docs/app/guides/ai-agents]
      ref: /learn/react-developer-tools
    - id: perf-tracks
      name: React Performance tracks
      summary: Dev-build custom tracks in the browser Performance panel showing React scheduler lanes,
        renders and Effects
      lenses: [observability, perf]
      ref: /reference/dev-tools/react-performance-tracks
      notes: [dev builds only by default; production needs a profiling build]
- title: Learn React
  sections:
  - id: get-started
    title: Get started and setup
    level: basic
    requires: []
    ref: /learn
    entries:
    - id: quick-start
      name: Quick Start and Thinking in React
      summary: component model, UI as a tree
      lenses: [best-practice]
      ref: /learn/thinking-in-react
    - id: installation
      name: Installation / Creating a React App
      summary: frameworks (Next.js) over from-scratch builds
      lenses: [best-practice]
      ref: /learn/creating-a-react-app
    - id: typescript
      name: Using TypeScript
      summary: Type props, state, events and context with `@types/react`; keep types at component boundaries
      lenses: [typing-dx]
      signature: 'function Comp({ children }: { children: ReactNode })'
      ref: /learn/typescript
    - id: editor-devtools
      name: Editor setup and React Developer Tools
      summary: extension, profiler
      lenses: [observability]
      ref: /learn/react-developer-tools
    - id: learn-editor-setup
      name: Editor setup
      summary: Lint with ESLint plus all eslint-plugin-react-hooks rules, format with Prettier (eslint-config-prettier)
      lenses:
      - best-practice
      - typing-dx
      ref: /learn/editor-setup
    - id: learn-from-scratch
      name: Build a React app from scratch
      summary: Pick a build tool (Vite, Parcel, Rsbuild) and add routing and data fetching yourself; frameworks
        are recommended for SSR, SSG and RSC
      lenses:
      - composability
      ref: /learn/build-a-react-app-from-scratch
    - id: learn-existing-project
      name: Add React to an existing project
      summary: React for a whole subroute (framework base path plus proxy) or for parts of a page via createRoot
      lenses:
      - composability
      ref: /learn/add-react-to-an-existing-project
  - id: react-compiler-guide
    title: React Compiler guide
    level: intermediate
    requires: [get-started]
    ref: /learn/react-compiler
    entries:
    - id: compiler-intro
      name: React Compiler
      summary: build-time auto-memoization, `infer` mode default; 1.0 stable since 2025-10-07
      lenses: [perf, best-practice]
      notes: [NOT enabled here; manual useMemo in assistant.tsx would become redundant]
      ref: /learn/react-compiler/introduction
      returns: Auto-memoized components/hooks at build time; no manual useMemo/useCallback/memo needed
        for most code
    - id: compiler-install
      name: Compiler installation
      summary: 'Install `babel-plugin-react-compiler` as a devDependency and enable it (Next: `reactCompiler:
        true`)'
      lenses: [perf]
      signature: babel-plugin-react-compiler@latest
      notes: [supports React 17/18 via `target`; best on 19; see next outline `react-compiler`]
      ref: /learn/react-compiler/installation
    - id: compiler-adoption
      name: Incremental adoption
      summary: Babel overrides, `"use memo"` opt-in, `"use no memo"` opt-out, gating
      lenses: [reliability, perf]
      notes: ['compilationMode infer (default), annotation, syntax, all']
      ref: /learn/react-compiler/incremental-adoption
    - id: compiler-debug
      name: Debugging and troubleshooting the compiler
      summary: panicThreshold, logger, skipped components
      lenses: [observability, reliability]
      ref: /learn/react-compiler/debugging
  - id: describing-ui
    title: Describing the UI
    level: basic
    requires: [get-started]
    ref: /learn/describing-the-ui
    entries:
    - id: components-jsx
      name: Components, JSX, props, conditional rendering, lists
      summary: keys, import/export
      lenses: [best-practice]
      ref: /learn/describing-the-ui
    - id: keeping-pure
      name: Keeping components pure
      summary: same inputs, same output; no mutation during render
      lenses: [best-practice, reliability]
      ref: /learn/keeping-components-pure
    - id: learn-first-component
      name: Your first component
      summary: Components are JavaScript functions with a capitalized name that return JSX
      lenses:
      - best-practice
      ref: /learn/your-first-component
      notes:
      - do not define components inside other components; lowercase tags are treated as built-in elements
    - id: learn-import-export
      name: Importing and exporting components
      summary: Root component file, default versus named exports, several components per file
      lenses:
      - composability
      ref: /learn/importing-and-exporting-components
    - id: learn-jsx-markup
      name: Writing markup with JSX
      summary: JSX groups rendering logic with markup; stricter than HTML (closed tags, one root, camelCase
        attributes)
      lenses:
      - best-practice
      ref: /learn/writing-markup-with-jsx
    - id: learn-jsx-curly
      name: JavaScript in JSX with curly braces
      summary: Curly braces embed JS values and expressions in content and attributes; double braces pass
        an object
      lenses:
      - best-practice
      ref: /learn/javascript-in-jsx-with-curly-braces
      notes:
      - '`{{ }}` is a plain object inside braces, not special syntax'
    - id: learn-props
      name: Passing props to a component
      summary: Props flow down as read-only snapshots; destructure with defaults; nested JSX arrives as children
      lenses:
      - best-practice
      - typing-dx
      - composability
      ref: /learn/passing-props-to-a-component
      notes:
      - defaults apply to missing and undefined props; spread forwarding with ...props should not be overused;
        props cannot be changed
      - use state
    - id: learn-conditional
      name: Conditional rendering
      summary: Branch with plain JavaScript (if, ternary, &&) returning JSX or null
      lenses:
      - best-practice
      ref: /learn/conditional-rendering
    - id: learn-lists
      name: Rendering lists
      summary: map and filter arrays into elements; every item needs a stable key so React tracks it across
        reorders
      lenses:
      - best-practice
      - perf
      ref: /learn/rendering-lists
    - id: learn-ui-tree
      name: Understanding your UI as a tree
      summary: Render tree (components in one render) versus module dependency tree (bundling and bundle size)
      lenses:
      - perf
      ref: /learn/understanding-your-ui-as-a-tree
  - id: interactivity
    title: Adding interactivity and managing state
    level: basic
    requires: [describing-ui]
    ref: /learn/adding-interactivity
    entries:
    - id: state-snapshot
      name: State as a snapshot and update queueing
      summary: updater functions, immutable updates
      lenses: [best-practice]
      ref: /learn/state-as-a-snapshot
    - id: state-structure
      name: State structure
      summary: choosing structure, sharing state, preserving and resetting state with keys
      lenses: [composability, best-practice]
      notes: [global stores live in zustand (see zustand outline)]
      ref: /learn/choosing-the-state-structure
    - id: reducer-context
      name: Reducer and Context
      summary: '`useReducer` with `createContext` at scale'
      lenses: [composability]
      signature: useReducer, createContext
      ref: /learn/scaling-up-with-reducer-and-context
    - id: learn-events
      name: Responding to events
      summary: Pass handler functions (never call them) to event props; events bubble, so use stopPropagation
        and preventDefault
      lenses:
      - best-practice
      ref: /learn/responding-to-events
      notes:
      - define custom event props on your components with application-specific names; calling a parent handler
        explicitly is an alternative to propagation
    - id: learn-state-memory
      name: State, a component's memory
      summary: useState persists values between renders; hooks run unconditionally at top level; state is
        private per rendered instance
      lenses:
      - best-practice
      ref: /learn/state-a-components-memory
      notes:
      - React matches several state variables by call order; rendering a component twice gives each copy its
        own state
    - id: learn-render-commit
      name: Render and commit
      summary: Every update is trigger, render, commit; React touches the DOM only if the render output changed;
        Strict Mode surfaces mistakes
      lenses:
      - perf
      - best-practice
      ref: /learn/render-and-commit
    - id: learn-queue-updates
      name: Queueing a series of state updates
      summary: Updates are batched after handlers finish; use an updater function (n => n + 1) for several
        updates to one value
      lenses:
      - best-practice
      - reliability
      ref: /learn/queueing-a-series-of-state-updates
      notes:
      - setting state requests a new render and does not change the variable in the current render
    - id: learn-update-objects
      name: Updating objects in state
      summary: Treat state as immutable; copy with spread (shallow) up the path to nested values; Immer reduces
        boilerplate
      lenses:
      - best-practice
      - reliability
      ref: /learn/updating-objects-in-state
      notes:
      - mutating does not trigger renders and corrupts earlier render snapshots
    - id: learn-update-arrays
      name: Updating arrays in state
      summary: Replace arrays with new ones via spread, filter and map rather than mutating; Immer is optional
      lenses:
      - best-practice
      - reliability
      ref: /learn/updating-arrays-in-state
  - id: learn-managing-state
    title: Managing state
    level: intermediate
    requires:
    - interactivity
    ref: /learn/managing-state
    entries:
    - id: learn-input-state
      name: Reacting to input with state
      summary: Describe UI per visual state declaratively; identify states and triggers, model with useState,
        drop redundant state
      lenses:
      - best-practice
      ref: /learn/reacting-to-input-with-state
    - id: learn-lift-state
      name: Sharing state between components
      summary: Lift state to the closest common parent and pass values and handlers down; controlled versus
        uncontrolled components
      lenses:
      - composability
      ref: /learn/sharing-state-between-components
    - id: learn-preserve-state
      name: Preserving and resetting state
      summary: State belongs to a tree position; a different key resets a subtree; nested component definitions
        reset state by accident
      lenses:
      - best-practice
      - reliability
      ref: /learn/preserving-and-resetting-state
    - id: learn-reducer
      name: Extracting state logic into a reducer
      summary: Move useState updates into a pure reducer where each action describes one user interaction
      lenses:
      - best-practice
      - testing
      ref: /learn/extracting-state-logic-into-a-reducer
      notes:
      - Immer enables mutating-style reducers; reducers ease debugging and testing
    - id: learn-context
      name: Passing data deeply with context
      summary: createContext, useContext and a provider avoid prop drilling; try props or children first
      lenses:
      - composability
      ref: /learn/passing-data-deeply-with-context
      notes:
      - provide with <MyContext value={...}> in React 19; context passes through intermediate components
  - id: escape-hatches
    title: Escape hatches
    level: intermediate
    requires: [interactivity]
    ref: /learn/escape-hatches
    entries:
    - id: refs-dom
      name: Refs and DOM manipulation
      summary: '`useRef`, ref as a prop'
      lenses: [best-practice]
      signature: useRef
      notes: ['React 19: `ref` is a plain prop; forwardRef no longer needed']
      ref: /learn/referencing-values-with-refs
    - id: effects
      name: Synchronizing with Effects and lifecycle
      summary: An Effect connects a component to an external system with setup/cleanup that mirrors it;
        StrictMode runs an extra setup+cleanup in dev
      lenses: [best-practice, reliability]
      ref: /learn/synchronizing-with-effects
    - id: no-effect
      name: You Might Not Need an Effect
      summary: derive in render, events not effects, key to reset state
      lenses: [best-practice, perf]
      notes: [compiler lint `set-state-in-effect` flags the anti-pattern]
      ref: /learn/you-might-not-need-an-effect
    - id: effect-events
      name: Separating events from Effects
      summary: '`useEffectEvent`, removing dependencies'
      lenses: [best-practice]
      signature: useEffectEvent
      notes: [only call Effect Events inside Effects; never to dodge dependency arrays]
      ref: /learn/separating-events-from-effects
    - id: custom-hooks
      name: Custom hooks
      summary: reuse stateful logic across components
      lenses: [reuse, composability]
      ref: /learn/reusing-logic-with-custom-hooks
    - id: learn-dom-refs
      name: Manipulating the DOM with refs
      summary: Refs hold DOM nodes for focus, scroll and measurement; components expose nodes only via the
        ref prop; avoid mutating React-managed DOM
      lenses:
      - best-practice
      ref: /learn/manipulating-the-dom-with-refs
      notes:
      - use ref callbacks to manage lists of refs; modify only DOM parts React has no reason to update
    - id: learn-effect-lifecycle
      name: Lifecycle of reactive effects
      summary: Each Effect is an independent start/stop synchronization process; reactive values must be dependencies,
        verified by the linter
      lenses:
      - best-practice
      - reliability
      ref: /learn/lifecycle-of-reactive-effects
      notes:
      - think per Effect rather than per component mount or unmount; an empty array means no reactive values;
        every linter error is legitimate
    - id: learn-remove-deps
      name: Removing Effect dependencies
      summary: Fix code, not the dependency list; move logic to handlers, split Effects, use updater functions
        or Effect Events
      lenses:
      - best-practice
      - reliability
      ref: /learn/removing-effect-dependencies
      notes:
      - never suppress the linter; avoid object and function dependencies by moving them outside the component
        or inside the Effect; extract non-reactive reads into an Effect Event
- title: API Reference
  sections:
  - id: api-hooks
    title: React Hooks
    level: intermediate
    requires: [interactivity]
    ref: /reference/react/hooks
    entries:
    - id: use-state
      name: useState / useReducer
      summary: Local component state; pass an initializer function for expensive initial values and an
        updater function for derived updates
      lenses: [best-practice]
      ref: /reference/react/useState
      import: react
      signature: useState(initialState)
      params:
      - {name: initialState, type: S | (() => S), default: null, desc: 'initial value, or pure no-arg
          initializer; ignored after first render'}
      returns: '[state, setState]; setState accepts a value or a pure updater `(prev) => next` and bails
        out on Object.is equality'
    - id: use-effect
      name: useEffect / useLayoutEffect / useInsertionEffect
      summary: Synchronize a component with an external system; setup returns cleanup, which StrictMode
        exercises on mount
      lenses: [best-practice, reliability]
      ref: /reference/react/useEffect
      import: react
      signature: useEffect(setup, dependencies?)
      params:
      - {name: setup, type: () => void | (() => void), default: null, desc: effect body; optional returned
          cleanup runs before re-run and on unmount}
      - {name: dependencies, type: 'unknown[]', default: omitted = every render, desc: 'all reactive values
          read inside setup; [] = once on mount'}
      returns: undefined; effects never run during server rendering
    - id: use-effect-event
      name: useEffectEvent
      summary: Wrap non-reactive logic called from an Effect so it reads latest props/state without becoming
        a dependency
      lenses: [best-practice, typing-dx]
      ref: /reference/react/useEffectEvent
      import: react
      signature: useEffectEvent(callback)
      params:
      - {name: callback, type: (...args) => any, default: null, desc: logic that always sees latest committed
          render values when called}
      returns: Effect Event function (same type as callback, identity changes every render); call only
        inside Effects or other Effect Events
    - id: use-sync-external-store
      name: useSyncExternalStore
      summary: Subscribe to a non-React store (or browser API) tear-free; also the idiom for hydration-safe
        client-only values
      lenses: [reliability, composability]
      signature: useSyncExternalStore(subscribe, getSnapshot, getServerSnapshot?)
      notes: [snapshot must be immutable and cached; a fresh object per call loops forever, store updates
          cannot be Transitions; avoid suspending on store values]
      ref: /reference/react/useSyncExternalStore
      import: react
      params:
      - {name: subscribe, type: (callback) => unsubscribe, default: null, desc: registers callback with
          the store; declare outside the component or React re-subscribes each render}
      - {name: getSnapshot, type: () => T, default: null, desc: returns the current snapshot; must return
          the same immutable value while the store is unchanged}
      - {name: getServerSnapshot, type: () => T, default: null, desc: 'optional; snapshot for server render
          and hydration, must match between server and client'}
      returns: current snapshot of the store; re-renders when subscribe callback fires and snapshot changes
        (Object.is)
    - id: use-memo
      name: useMemo / useCallback / memo
      summary: Cache a pure computation between renders as a perf hint; React may discard it, and the
        Compiler makes most uses redundant
      lenses: [perf, best-practice]
      notes: [compiler makes manual memo redundant]
      ref: /reference/react/useMemo
      import: react
      signature: useMemo(calculateValue, dependencies)
      params:
      - {name: calculateValue, type: () => T, default: null, desc: 'pure, no arguments; called on initial
          render and when dependencies change'}
      - {name: dependencies, type: 'unknown[]', default: null, desc: every reactive value read in calculateValue}
      returns: cached value from last render, or fresh calculateValue() result when dependencies changed
    - id: use-ref
      name: useRef / useImperativeHandle / useId / useDebugValue
      summary: Hold a mutable value that does not trigger re-render (DOM node, timer id); never read or
        write `.current` during render
      lenses: [best-practice]
      ref: /reference/react/useRef
      import: react
      signature: useRef(initialValue)
      params:
      - {name: initialValue, type: T, default: null, desc: initial `current`; ignored after first render}
      returns: stable `{ current }` object; assigned to a DOM node when passed as a `ref` prop
    - id: use-id
      name: useId
      summary: Generate a stable unique id string for accessibility attributes; not for list keys or cache
        keys
      lenses: [ux-a11y]
      signature: useId()
      returns: unique id string, consistent between server and client
      ref: /reference/react/useId
      import: react
    - id: use-context
      name: useContext / createContext
      summary: Read a context value (nearest provider above, else the default); re-renders when the value
        changes by Object.is
      lenses: [composability]
      signature: useContext(SomeContext)
      ref: /reference/react/useContext
      import: react
      params:
      - {name: SomeContext, type: Context<T>, default: null, desc: object from createContext}
      returns: context value of the closest provider; `use(Context)` is the conditional-capable alternative
    - id: use-transition
      name: useTransition / startTransition / useDeferredValue
      summary: Mark state updates as non-blocking Transitions and expose a pending flag; async Actions
        are supported
      lenses: [perf, ux-a11y]
      ref: /reference/react/useTransition
      import: react
      signature: useTransition()
      returns: '[isPending, startTransition(action)]; updates after an await inside the action must be
        re-wrapped in startTransition'
      notes: [Transitions are interruptible and keep already-revealed Suspense content on screen]
    - id: use-deferred-value
      name: useDeferredValue
      summary: 'Defer re-rendering a slow subtree: returns the old value first, then re-renders in background
        with the new one'
      lenses: [perf, ux-a11y]
      import: react
      signature: useDeferredValue(value, initialValue?)
      params:
      - {name: value, type: T, default: null, desc: primitive or object created outside render (a fresh
          object per render defeats deferral)}
      - {name: initialValue, type: T, default: value, desc: optional first-render value; lets the first
          paint show a placeholder before deferring}
      returns: deferred copy of value; inside a Transition it equals the new value (no extra render)
      ref: /reference/react/useDeferredValue
    - id: use-action-state
      name: useActionState / useOptimistic / react-dom `useFormStatus`
      summary: State driven by an (async) Action, with pending flag; the form-submit counterpart of useReducer
      lenses: [ux-a11y, best-practice]
      ref: /reference/react/useActionState
      import: react
      signature: useActionState(reducerAction, initialState, permalink?)
      params:
      - {name: reducerAction, type: '(prev, payload) => S | Promise<S>', default: null, desc: may be async
          and perform side effects; queued calls run sequentially}
      - {name: initialState, type: S, default: null, desc: state before first dispatch; must serialize
          with Server Functions}
      - {name: permalink, type: string, default: null, desc: optional URL for progressive-enhancement
          form posts with Server Functions}
      returns: '[state, dispatchAction, isPending]; dispatchAction must run inside an Action (form action
        or startTransition)'
    - id: use-optimistic
      name: useOptimistic
      summary: Show a temporary optimistic value while an Action is pending; reverts to the real value
        when it settles
      lenses: [ux-a11y, best-practice]
      signature: useOptimistic(value, reducer?)
      params:
      - {name: value, type: T, default: null, desc: value returned when no Action is pending}
      - {name: reducer, type: '(current, action) => T', default: null, desc: optional pure reducer; otherwise
          set() takes the next value directly}
      returns: '[optimisticState, setOptimistic]; setOptimistic must be called inside an Action'
      ref: /reference/react/useOptimistic
    - id: use-reducer
      name: useReducer
      summary: State with a pure reducer and dispatch; centralizes complex update logic and has a stable dispatch
        identity
      lenses:
      - best-practice
      - composability
      ref: /reference/react/useReducer
      import: react
      signature: useReducer(reducer, initialArg, init?)
      params:
      - name: reducer
        type: (state, action) => state
        default: null
        desc: pure function returning the next state
      - name: initialArg
        type: S
        default: null
        desc: initial state or the input to init
      - name: init
        type: (initialArg) => S
        default: null
        desc: optional initializer; initial state is init(initialArg)
      returns: '[state, dispatch]; dispatch(action) takes the only arg, has stable identity, and bails out
        on Object.is equal state'
      notes:
      - Strict Mode calls reducer and initializer twice in development to expose impurities; dispatch only
        changes the next render's state
    - id: use-callback
      name: useCallback
      summary: Cache a function definition between renders as a perf hint; the Compiler makes most manual
        uses redundant
      lenses:
      - perf
      - best-practice
      ref: /reference/react/useCallback
      import: react
      signature: useCallback(fn, dependencies)
      params:
      - name: fn
        type: (...args) => any
        default: null
        desc: function to cache; returned, not called
      - name: dependencies
        type: unknown[]
        default: null
        desc: every reactive value referenced inside fn
      returns: fn from the first render, then the cached fn while dependencies are unchanged
      notes:
      - React Compiler memoizes functions automatically; React may discard the cache
      - so use only as a performance hint
    - id: use-imperative-handle
      name: useImperativeHandle
      summary: Customize the handle a component exposes through a ref prop (React 19 passes ref as a plain
        prop)
      lenses:
      - composability
      - typing-dx
      ref: /reference/react/useImperativeHandle
      import: react
      signature: useImperativeHandle(ref, createHandle, dependencies?)
      params:
      - name: ref
        type: Ref<T>
        default: null
        desc: the ref received as a prop
      - name: createHandle
        type: () => T
        default: null
        desc: no-arg function returning the exposed handle, usually an object of methods
      - name: dependencies
        type: unknown[]
        default: null
        desc: optional; reactive values read in createHandle
      returns: undefined
    - id: use-layout-effect
      name: useLayoutEffect
      summary: Effect that fires before the browser repaints, for layout measurement; blocks painting so prefer
        useEffect
      lenses:
      - perf
      - reliability
      ref: /reference/react/useLayoutEffect
      import: react
      signature: useLayoutEffect(setup, dependencies?)
      params:
      - name: setup
        type: () => void | (() => void)
        default: null
        desc: runs after commit and before repaint; optional cleanup
      - name: dependencies
        type: unknown[]
        default: omitted = every render
        desc: reactive values read in setup
      returns: undefined
      notes:
      - client-only
      - does not run during server rendering; a state update inside it flushes remaining effects immediately
    - id: use-insertion-effect
      name: useInsertionEffect
      summary: Effect that fires before layout effects, meant for CSS-in-JS libraries injecting styles
      lenses:
      - perf
      ref: /reference/react/useInsertionEffect
      import: react
      signature: useInsertionEffect(setup, dependencies?)
      params:
      - name: setup
        type: () => void | (() => void)
        default: null
        desc: runs before any layout effect; optional cleanup
      - name: dependencies
        type: unknown[]
        default: omitted = every render
        desc: reactive values read in setup
      returns: undefined
      notes:
      - cannot update state; refs are not attached yet; client-only; for library authors
      - application code should use useEffect or useLayoutEffect
    - id: use-debug-value
      name: useDebugValue
      summary: Label a custom hook value in React DevTools, with an optional lazy formatter
      lenses:
      - observability
      - typing-dx
      ref: /reference/react/useDebugValue
      import: react
      signature: useDebugValue(value, format?)
      params:
      - name: value
        type: any
        default: null
        desc: value displayed in DevTools
      - name: format
        type: (value) => any
        default: null
        desc: optional formatter called only when the component is inspected
      returns: undefined
  - id: api-components
    title: React components
    level: intermediate
    requires: [api-hooks]
    ref: /reference/react/components
    entries:
    - id: strict-mode
      name: '`<StrictMode>`'
      summary: dev-only extra renders and Effect re-runs to expose impurity
      lenses: [reliability, testing]
      ref: /reference/react/StrictMode
    - id: suspense
      name: '`<Suspense>`'
      summary: Show a fallback until children finish loading (lazy code, `use(promise)`, framework data);
        pairs with error boundaries
      lenses: [ux-a11y, perf]
      ref: /reference/react/Suspense
      signature: <Suspense fallback={...}>children</Suspense>
      options:
      - {name: fallback, type: ReactNode, default: null, desc: lightweight placeholder shown while children
          suspend}
      - {name: defer, type: boolean, default: 'false', desc: 'experimental: may show fallback first and
          stream children later even when nothing suspends'}
      notes: [does not detect fetches done in Effects or event handlers, revealed content batches at most
          once per 300ms]
    - id: activity
      name: '`<Activity mode="visible|hidden">`'
      summary: Hide UI while preserving state and unmounting its Effects; hidden children re-render at
        low priority
      lenses: [ux-a11y, perf]
      ref: /reference/react/Activity
      signature: <Activity mode="visible" | "hidden">
      options:
      - {name: mode, type: '"visible" | "hidden"', default: '"visible"', desc: 'hidden sets display:none,
          destroys Effects, keeps state; visible restores both'}
    - id: view-transition
      name: '`<ViewTransition>` / `addTransitionType`'
      summary: Animate enter/exit/update/shared-element changes caused by Transitions, Suspense or useDeferredValue
        via the browser View Transition API
      lenses: [ux-a11y]
      notes: ['only updates inside a Transition, Suspense or useDeferredValue activate it; plain setState
          does not', always honor prefers-reduced-motion in CSS; React does not]
      ref: /reference/react/ViewTransition
      signature: <ViewTransition name? default? enter? exit? update? share?>
      options:
      - {name: name, type: string, default: auto-unique, desc: set only for shared-element transitions
          between two mounts}
      - {name: enter / exit / update / share / default, type: string | object, default: browser cross-fade,
        desc: View Transition Class mapped to each trigger; "none" disables}
      - {name: onEnter / onExit / onUpdate / onShare, type: '(instance, types) => cleanup?', default: null,
        desc: imperative animation callbacks using Web Animations API}
    - id: fragment-profiler
      name: Fragment and Profiler
      summary: Fragment with a ref exposes a FragmentInstance for observing/measuring its first-level
        DOM children; Profiler reports render timings
      lenses: [composability, observability]
      signature: <Fragment ref={ref}> / <Profiler id onRender>
      notes: [Fragment refs need React >= 19.3]
      ref: /reference/react/Fragment
      options:
      - {name: Fragment ref, type: RefObject | callback, default: null, desc: 'FragmentInstance: addEventListener,
          observeUsing(IntersectionObserver|ResizeObserver), focus, getRootNode, ...'}
      - {name: Profiler onRender, type: '(id, phase, actualDuration, baseDuration, startTime, commitTime)
          => void', default: null, desc: called per commit of the profiled subtree; disabled in production
          builds}
    - id: profiler
      name: Profiler
      summary: Measure render cost of a subtree programmatically via an onRender callback; disabled in production
        builds by default
      lenses:
      - observability
      - perf
      ref: /reference/react/Profiler
      import: react
      signature: <Profiler id onRender>
      options:
      - name: id
        type: string
        default: null
        desc: identifies the profiled UI part
      - name: onRender
        type: (id, phase, actualDuration, baseDuration, startTime, commitTime) => void
        default: null
        desc: called on every commit within the tree; phase is mount, update or nested-update
      notes:
      - needs a profiling build to run in production; adds overhead
  - id: api-apis
    title: React APIs
    level: intermediate
    requires: [api-hooks]
    ref: /reference/react/apis
    entries:
    - id: use-api
      name: use
      summary: Read a Promise (suspends) or context during render; unlike Hooks it may be called in loops
        and conditionals
      lenses: [composability, perf]
      ref: /reference/react/use
      import: react
      signature: use(resource)
      params:
      - {name: resource, type: Promise<T> | Context<T>, default: null, desc: Promise must be cached (stable
          instance across renders); try/catch is not allowed around use}
      returns: resolved Promise value or the context value; rejection goes to the nearest Error Boundary
      notes: ['`use(Context)` is not supported in Server Components', '`use(browser())` is the 19.3 browser-only
          render marker']
    - id: use-browser
      name: use(browser())
      summary: 'Mark a Client Component browser-only during SSR: leaves the nearest Suspense fallback
        in the HTML, renders normally in the browser'
      lenses: [reliability, ux-a11y]
      signature: use(browser(reason?))
      params:
      - {name: reason, type: string | (() => string), default: null, desc: becomes the error cause reported
          via onBrowserBailout}
      returns: opaque value for use(); use() returns undefined in the browser
      notes: [requires React 19.3 (docs are 19.3); needs a Suspense boundary and a Client Component]
      ref: /reference/react-dom/browser
      import: react-dom
    - id: cache-api
      name: cache / cacheSignal
      summary: Memoize a function per server request in Server Components; `cacheSignal()` yields an AbortSignal
        for that cache lifetime
      lenses: [perf, reliability]
      ref: /reference/react/cache
      import: react
      signature: cache(fn)
      params:
      - {name: fn, type: (...args) => T, default: null, desc: function to memoize by argument identity}
      returns: memoized fn with the same signature; cache is invalidated each server request and errors
        are cached too
      notes: [call cache() once at module scope; each call creates an independent cache, Server Components
          only]
    - id: act-api
      name: act
      summary: Flush React updates and Effects before assertions in tests; always `await` it with an async
        callback
      lenses: [testing]
      notes: [imported via @testing-library/react]
      ref: /reference/react/act
      import: react
      signature: await act(async actFn)
      params:
      - {name: actFn, type: () => Promise<void>, default: null, desc: wraps renders and interactions;
          updates are queued and flushed together}
      returns: Promise resolving after updates flush; sync form is slated for deprecation
    - id: lazy-start
      name: lazy and startTransition
      summary: '`lazy` defers component code until first render (suspends); standalone `startTransition`
        marks updates as Transitions outside components'
      lenses: [perf]
      signature: lazy(load) / startTransition(action)
      ref: /reference/react/lazy
      import: react
      params:
      - {name: load, type: '() => Promise<{ default: Component }>', default: null, desc: 'lazy: called
          on first render; call lazy() at module scope, not inside components'}
      - {name: action, type: () => void | Promise<void>, default: null, desc: 'startTransition: runs immediately;
          set* calls inside become Transitions; no pending flag (use useTransition)'}
      returns: lazy returns a component that suspends until loaded; startTransition returns nothing
    - id: taint-apis
      name: experimental_taintObjectReference / experimental_taintUniqueValue
      summary: stop secrets reaching the client
      lenses: [security]
      ref: /reference/react/experimental_taintObjectReference
    - id: owner-stack
      name: captureOwnerStack
      summary: Dev-only string of the component owner stack at the current render, for richer error reports
      lenses: [observability]
      ref: /reference/react/captureOwnerStack
      import: react
      signature: captureOwnerStack()
      returns: string | null; null in production or when called outside render/error callbacks
    - id: start-transition
      name: startTransition
      summary: Standalone function marking state updates in its action as a Transition, without a pending
        flag
      lenses:
      - perf
      - ux-a11y
      ref: /reference/react/startTransition
      import: react
      signature: startTransition(action)
      params:
      - name: action
        type: () => void | Promise<void>
        default: null
        desc: called immediately; set functions called synchronously inside become Transitions
      returns: undefined
      notes:
      - no pending indicator (use useTransition); updates after an await need another startTransition; cannot
        drive text inputs; setTimeout updates are not Transitions
    - id: memo-api
      name: memo
      summary: Skip re-rendering a component when props are unchanged; a perf hint the Compiler applies automatically
      lenses:
      - perf
      ref: /reference/react/memo
      import: react
      signature: memo(Component, arePropsEqual?)
      params:
      - name: Component
        type: ComponentType
        default: null
        desc: component to memoize; returns a new memoized component
      - name: arePropsEqual
        type: (prevProps, nextProps) => boolean
        default: null
        desc: optional custom comparison; default is shallow Object.is per prop
      returns: a memoized component that React may still re-render
      notes:
      - React Compiler applies the equivalent to all components
    - id: create-context
      name: createContext
      summary: Create a context object to provide and read; React 19 renders the context itself as the provider
      lenses:
      - composability
      - typing-dx
      ref: /reference/react/createContext
      import: react
      signature: createContext(defaultValue)
      params:
      - name: defaultValue
        type: T
        default: null
        desc: value when no provider is above; use null if there is no meaningful default; never changes
      returns: context object; render <SomeContext value={...}> as provider (React 19; older versions use
        SomeContext.Provider); SomeContext.Consumer is legacy, prefer useContext
      notes:
      - call outside any component
    - id: create-element
      name: createElement
      summary: Create a React element without JSX; elements and props are immutable
      lenses:
      - composability
      ref: /reference/react/createElement
      import: react
      signature: createElement(type, props, ...children)
      params:
      - name: type
        type: string | ComponentType
        default: null
        desc: tag name string, component, Fragment, Suspense or Activity
      - name: props
        type: object | null
        default: null
        desc: element props; ref and key are lifted out of props
      - name: children
        type: ReactNode
        default: null
        desc: optional children as rest args; pass a dynamic array as one argument
      returns: element object { type, props, ref, key }
    - id: is-valid-element
      name: isValidElement
      summary: Type guard for React elements (JSX or createElement results; not numbers, strings or arrays)
      lenses:
      - typing-dx
      ref: /reference/react/isValidElement
      import: react
      signature: isValidElement(value)
      params:
      - name: value
        type: unknown
        default: null
        desc: value to check
      returns: boolean
    - id: add-transition-type
      name: addTransitionType
      summary: Tag the current Transition with a cause string, consumed by ViewTransition to choose animations
      lenses:
      - ux-a11y
      ref: /reference/react/addTransitionType
      import: react
      signature: addTransitionType(type)
      params:
      - name: type
        type: string
        default: null
        desc: cause of the transition; multiple types accumulate
      returns: undefined
      notes:
      - types reset after each commit
      - so a Suspense fallback gets them but the later content reveal does not; call inside startTransition
    - id: cache-signal
      name: cacheSignal
      summary: AbortSignal aborted when the cache() lifetime ends, to cancel in-flight work; Server Components
        only
      lenses:
      - reliability
      - perf
      ref: /reference/react/cacheSignal
      import: react
      signature: cacheSignal()
      returns: AbortSignal during rendering in an RSC (aborted when render completes, aborts or fails); null
        in Client Components and outside render
    - id: taint-unique-value
      name: experimental_taintUniqueValue
      summary: Experimental; block high-entropy secrets (tokens, keys, hashes) from reaching Client Components
      lenses:
      - security
      ref: /reference/react/experimental_taintUniqueValue
      signature: taintUniqueValue(message, lifetime, value)
      params:
      - name: message
        type: string
        default: null
        desc: error text thrown if the value reaches a Client Component
      - name: lifetime
        type: object
        default: null
        desc: value stays tainted while this object exists, e.g. globalThis
      - name: value
        type: string | bigint | TypedArray
        default: null
        desc: unique high-entropy value
      returns: undefined
      notes:
      - only in react@experimental and RSC; derived values (uppercase or base64) are not tainted; useless
        for low-entropy values like PINs
  - id: api-react-dom
    title: React DOM
    level: intermediate
    requires: [api-components]
    ref: /reference/react-dom
    entries:
    - id: dom-components
      name: react-dom components
      summary: '`<form action>` plus hoisted `<title>`/`<meta>`/`<link>`/`<script>`/`<style>` (with precedence)'
      lenses: [best-practice, ux-a11y]
      signature: <form action>, <input>, <img>, <link>, <meta>, <title>, <script>, <style>
      ref: /reference/react-dom/components
    - id: dom-apis
      name: react-dom APIs
      summary: createPortal, flushSync, preload/preinit/preconnect/prefetchDNS
      lenses: [perf]
      ref: /reference/react-dom
    - id: client-apis
      name: createRoot / hydrateRoot
      summary: Root-level error reporting hooks on createRoot/hydrateRoot; Next owns the root so use Next
        error boundaries instead
      lenses: [reliability, observability]
      signature: createRoot(domNode, options?)
      ref: /reference/react-dom/client
      import: react-dom/client
      options:
      - {name: onCaughtError, type: '(error, errorInfo) => void', default: console.error, desc: called
          when an Error Boundary catches; errorInfo.componentStack}
      - {name: onUncaughtError, type: '(error, errorInfo) => void', default: reportError, desc: errors
          no boundary caught}
      - {name: onRecoverableError, type: '(error, errorInfo) => void', default: reportError, desc: errors
          React recovered from automatically (e.g. hydration mismatch)}
      - {name: identifierPrefix, type: string, default: '""', desc: prefix for useId ids; avoids collisions
          with multiple roots}
      returns: root with render(node) and unmount()
    - id: server-static-apis
      name: Server and Static APIs
      summary: Server render/prerender APIs (renderToPipeableStream, renderToReadableStream, resume, prerender);
        Next calls these itself
      lenses: [perf]
      ref: /reference/react-dom/server
    - id: create-root
      name: createRoot
      summary: Create a client-rendered root with render and unmount; first render clears existing DOM content
      lenses:
      - reliability
      - observability
      ref: /reference/react-dom/client/createRoot
      import: react-dom/client
      signature: createRoot(domNode, options?)
      options:
      - name: onCaughtError
        type: (error, errorInfo) => void
        default: console.error
        desc: called when an Error Boundary catches; errorInfo.componentStack
      - name: onUncaughtError
        type: (error, errorInfo) => void
        default: reportError
        desc: errors no boundary caught
      - name: onRecoverableError
        type: (error, errorInfo) => void
        default: reportError
        desc: automatically recovered errors; may carry error.cause
      - name: identifierPrefix
        type: string
        default: '""'
        desc: prefix for useId ids; avoids collisions with several roots
      returns: root with render(reactNode) and unmount(); render on an unmounted root throws
      notes:
      - not supported for server-rendered HTML (use hydrateRoot); root.render is async so DOM and effects
        are not yet updated on the next line; use createPortal for modals instead of extra roots
    - id: hydrate-root
      name: hydrateRoot
      summary: Attach React to server-rendered HTML; mismatches are bugs and the markup must match the client
        render
      lenses:
      - reliability
      ref: /reference/react-dom/client/hydrateRoot
      import: react-dom/client
      signature: hydrateRoot(domNode, reactNode, options?)
      options:
      - name: onCaughtError
        type: (error, errorInfo) => void
        default: console.error
        desc: Error Boundary caught
      - name: onUncaughtError
        type: (error, errorInfo) => void
        default: reportError
        desc: no boundary caught
      - name: onRecoverableError
        type: (error, errorInfo) => void
        default: reportError
        desc: automatic recovery, e.g. hydration mismatch
      - name: identifierPrefix
        type: string
        default: '""'
        desc: must equal the prefix used on the server
      - name: formState
        type: ReactFormState | null
        default: null
        desc: form state from a Server Function submission using useActionState with a permalink
      returns: root with render(reactNode) and unmount(); render before hydration finishes discards server
        HTML and switches to client rendering
      notes:
      - attribute mismatches are not patched up in production
    - id: create-portal
      name: createPortal
      summary: Render children into a different DOM node while keeping React context and event bubbling through
        the React tree
      lenses:
      - composability
      - ux-a11y
      ref: /reference/react-dom/createPortal
      import: react-dom
      signature: createPortal(children, domNode, key?)
      params:
      - name: children
        type: ReactNode
        default: null
        desc: anything renderable
      - name: domNode
        type: Element
        default: null
        desc: existing DOM node; changing it recreates the content
      - name: key
        type: string | number
        default: null
        desc: optional portal key
      returns: React node to place in JSX
      notes:
      - events propagate along the React tree
      - not the DOM tree
    - id: flush-sync
      name: flushSync
      summary: Force synchronous DOM update for updates inside a callback; last resort that hurts performance
      lenses:
      - perf
      ref: /reference/react-dom/flushSync
      import: react-dom
      signature: flushSync(callback)
      params:
      - name: callback
        type: () => void
        default: null
        desc: called immediately; its updates are flushed synchronously
      returns: undefined
      notes:
      - may re-show Suspense fallbacks and flush pending effects and unrelated pending updates
    - id: use-form-status
      name: useFormStatus
      summary: Read status of the parent form submission from a child component (pending, data, method, action)
      lenses:
      - ux-a11y
      - composability
      ref: /reference/react-dom/hooks/useFormStatus
      import: react-dom
      signature: useFormStatus()
      returns: '{ pending: boolean, data: FormData | null, method: get | post, action: function | null }'
      notes:
      - must be called from a component rendered inside the form; reports only the parent form
      - not one rendered in the same component
    - id: preconnect
      name: preconnect
      summary: Hint the browser to open a connection to a server hosting expected resources
      lenses:
      - perf
      ref: /reference/react-dom/preconnect
      import: react-dom
      signature: preconnect(href)
      params:
      - name: href
        type: string
        default: null
        desc: server URL
      returns: undefined
      notes:
      - idempotent; on the server only effective during component render; useless for the page's own origin
    - id: prefetch-dns
      name: prefetchDNS
      summary: Hint the browser to resolve the IP of a server early; cheaper than preconnect for many domains
      lenses:
      - perf
      ref: /reference/react-dom/prefetchDNS
      import: react-dom
      signature: prefetchDNS(href)
      params:
      - name: href
        type: string
        default: null
        desc: server URL
      returns: undefined
      notes:
      - idempotent; on the server only effective during component render
    - id: preinit
      name: preinit
      summary: Eagerly fetch and evaluate a stylesheet or external script
      lenses:
      - perf
      ref: /reference/react-dom/preinit
      import: react-dom
      signature: preinit(href, options)
      options:
      - name: as
        type: '''script'' | ''style'''
        default: null
        desc: required resource type
      - name: precedence
        type: '''reset'' | ''low'' | ''medium'' | ''high'''
        default: null
        desc: required for stylesheets; insertion order versus other sheets
      - name: crossOrigin
        type: '''anonymous'' | ''use-credentials'''
        default: null
        desc: CORS policy
      - name: integrity
        type: string
        default: null
        desc: subresource integrity hash
      - name: nonce
        type: string
        default: null
        desc: CSP nonce
      - name: fetchPriority
        type: '''auto'' | ''high'' | ''low'''
        default: auto
        desc: relative fetch priority
      returns: undefined
      notes:
      - frameworks usually handle resource loading; idempotent per href
    - id: preinit-module
      name: preinitModule
      summary: Eagerly fetch and evaluate an ESM module
      lenses:
      - perf
      ref: /reference/react-dom/preinitModule
      import: react-dom
      signature: preinitModule(href, options)
      options:
      - name: as
        type: '''script'''
        default: null
        desc: required, must be script
      - name: crossOrigin
        type: '''anonymous'' | ''use-credentials'''
        default: null
        desc: CORS policy
      - name: integrity
        type: string
        default: null
        desc: subresource integrity hash
      - name: nonce
        type: string
        default: null
        desc: CSP nonce
      returns: undefined
    - id: preload
      name: preload
      summary: Eagerly fetch a stylesheet, font, image, script or other resource without evaluating it
      lenses:
      - perf
      ref: /reference/react-dom/preload
      import: react-dom
      signature: preload(href, options)
      options:
      - name: as
        type: string
        default: null
        desc: required; audio, document, embed, fetch, font, image, object, script, style, track, video or
          worker
      - name: crossOrigin
        type: '''anonymous'' | ''use-credentials'''
        default: null
        desc: required when as is fetch
      - name: referrerPolicy
        type: string
        default: no-referrer-when-downgrade
        desc: Referer header policy
      - name: integrity
        type: string
        default: null
        desc: subresource integrity hash
      - name: type
        type: string
        default: null
        desc: MIME type
      - name: nonce
        type: string
        default: null
        desc: CSP nonce
      - name: fetchPriority
        type: '''auto'' | ''high'' | ''low'''
        default: auto
        desc: relative fetch priority
      - name: imageSrcSet
        type: string
        default: null
        desc: only with as image
      - name: imageSizes
        type: string
        default: null
        desc: only with as image
      returns: undefined
      notes:
      - calls are deduplicated by href (image also by imageSrcSet and imageSizes); on the server only effective
        during component render
    - id: preload-module
      name: preloadModule
      summary: Eagerly fetch an ESM module without evaluating it
      lenses:
      - perf
      ref: /reference/react-dom/preloadModule
      import: react-dom
      signature: preloadModule(href, options)
      options:
      - name: as
        type: '''script'''
        default: null
        desc: required, must be script
      - name: crossOrigin
        type: '''anonymous'' | ''use-credentials'''
        default: null
        desc: CORS policy
      - name: integrity
        type: string
        default: null
        desc: subresource integrity hash
      - name: nonce
        type: string
        default: null
        desc: CSP nonce
      returns: undefined
    - id: dom-common
      name: Common props, ref callbacks and event objects
      summary: Props all built-in elements accept (ref, style, dangerouslySetInnerHTML), ref callback cleanup, event object, handlers
      lenses:
      - best-practice
      - security
      - ux-a11y
      ref: /reference/react-dom/components/common
      signature: <div ref={(node) => cleanup?} style={...} onClick={(e) => ...} />
      options:
      - name: children
        type: ReactNode
        default: null
        desc: content; cannot be combined with dangerouslySetInnerHTML
      - name: dangerouslySetInnerHTML
        type: '{ __html: string | TrustedHTML }'
        default: null
        desc: raw HTML; XSS risk if untrusted
      - name: ref
        type: RefObject | (node) => void | (() => void)
        default: null
        desc: ref object or callback; React 19 callbacks may return a cleanup, else called with null on detach
      - name: style
        type: CSSProperties
        default: null
        desc: camelCase CSS object; bare numbers get px unless unitless
      - name: suppressHydrationWarning
        type: boolean
        default: 'false'
        desc: silences mismatch warnings one level deep; escape hatch for timestamps
      - name: suppressContentEditableWarning
        type: boolean
        default: 'false'
        desc: silences the children plus contentEditable warning
      notes:
      - every event has a Capture variant; handlers receive a React event object (nativeEvent
      - preventDefault
      - stopPropagation
      - isDefaultPrevented
      - isPropagationStopped); onAbort and onLoad bubble in React; a new ref callback each render is cleaned
        up and re-called every render so keep it stable
    - id: dom-form
      name: <form>
      summary: Function-valued action runs the submission in a Transition (POST regardless of method); pairs
        with useActionState and useFormStatus
      lenses:
      - best-practice
      - ux-a11y
      ref: /reference/react-dom/components/form
      signature: <form action={string | (formData) => void | Promise<void>}>
      options:
      - name: action
        type: 'string | (formData: FormData) => void | Promise<void>'
        default: null
        desc: URL behaves like HTML; a function handles the submit as an Action
      notes:
      - formAction on inputs and buttons overrides the form action; method is forced to POST when a function
        is passed
    - id: dom-input
      name: <input>
      summary: Controlled via value or checked plus onChange, uncontrolled via defaultValue or defaultChecked;
        cannot switch between modes
      lenses:
      - best-practice
      - ux-a11y
      ref: /reference/react-dom/components/input
      signature: <input type value | checked onChange />
      options:
      - name: value
        type: string
        default: null
        desc: controlled text; requires onChange
      - name: checked
        type: boolean
        default: null
        desc: controlled checkbox or radio; requires onChange
      - name: defaultValue
        type: string
        default: null
        desc: initial value for uncontrolled inputs
      - name: defaultChecked
        type: boolean
        default: null
        desc: initial state for uncontrolled checkbox or radio
      - name: formAction
        type: string | function
        default: null
        desc: overrides the form action for submit and image inputs
      - name: onChange
        type: (e) => void
        default: null
        desc: fires on every change like onInput; must update the value synchronously
      notes:
      - checkboxes use checked not value; a string value prop makes a text input controlled; no children
    - id: dom-select
      name: <select> and <option>
      summary: Controlled via value plus onChange or uncontrolled via defaultValue; React ignores option selected
        in favour of select value
      lenses:
      - best-practice
      - ux-a11y
      ref: /reference/react-dom/components/select
      signature: <select value | defaultValue multiple onChange>
      options:
      - name: value
        type: string | string[]
        default: null
        desc: controlled selection; array for multiple; requires onChange
      - name: defaultValue
        type: string | string[]
        default: null
        desc: initial selection for uncontrolled use
      - name: multiple
        type: boolean
        default: 'false'
        desc: allow multiple selection
      notes:
      - cannot switch between controlled and uncontrolled; accepts option
      - optgroup and datalist children
    - id: dom-option
      name: <option>
      summary: Option inside select; selected is unsupported, set select value or defaultValue instead
      lenses:
      - ux-a11y
      ref: /reference/react-dom/components/option
      signature: <option value label disabled>
      options:
      - name: value
        type: string
        default: null
        desc: submitted value when chosen
      - name: label
        type: string
        default: null
        desc: meaning of the option; defaults to its text
      - name: disabled
        type: boolean
        default: 'false'
        desc: not selectable
    - id: dom-textarea
      name: <textarea>
      summary: Multiline input, controlled via value plus onChange or uncontrolled via defaultValue; children
        are not allowed
      lenses:
      - best-practice
      - ux-a11y
      ref: /reference/react-dom/components/textarea
      signature: <textarea value | defaultValue onChange rows cols>
      options:
      - name: value
        type: string
        default: null
        desc: controlled text; requires onChange
      - name: defaultValue
        type: string
        default: null
        desc: initial text for uncontrolled use
      - name: rows
        type: number
        default: '2'
        desc: default height in lines
      - name: cols
        type: number
        default: '20'
        desc: default width in characters
      notes:
      - passing children throws; cannot switch controlled to uncontrolled
    - id: dom-progress
      name: <progress>
      summary: Native progress indicator; value null renders indeterminate
      lenses:
      - ux-a11y
      ref: /reference/react-dom/components/progress
      signature: <progress value max>
      options:
      - name: value
        type: number | null
        default: null
        desc: between 0 and max; null = indeterminate
      - name: max
        type: number
        default: '1'
        desc: maximum value
    - id: dom-img
      name: <img>
      summary: Image element; React preloads server-rendered images unless loading is lazy or fetchPriority
        is low
      lenses:
      - perf
      - ux-a11y
      ref: /reference/react-dom/components/img
      signature: <img src alt width height loading fetchPriority srcSet sizes>
      options:
      - name: alt
        type: string
        default: null
        desc: alternative text; empty string for decorative images
      - name: loading
        type: '''eager'' | ''lazy'''
        default: eager
        desc: lazy also stops the automatic server preload
      - name: fetchPriority
        type: '''high'' | ''low'' | ''auto'''
        default: auto
        desc: low stops the automatic server preload
      - name: decoding
        type: '''async'' | ''sync'' | ''auto'''
        default: auto
        desc: decode timing hint
      - name: onLoad
        type: () => void
        default: null
        desc: passing it stops a client-rendered View Transition waiting for the image
      notes:
      - empty src warns and is omitted; no children or dangerouslySetInnerHTML
    - id: dom-link
      name: <link>
      summary: Hoisted to head; stylesheets with precedence are deduplicated by href and suspend the component
        until loaded
      lenses:
      - perf
      - composability
      ref: /reference/react-dom/components/link
      signature: <link rel href precedence>
      options:
      - name: rel
        type: string
        default: null
        desc: required relationship; stylesheet gets special treatment
      - name: precedence
        type: string
        default: null
        desc: required for hoisting stylesheets; orders them in head
      - name: onLoad
        type: function
        default: null
        desc: with onError or disabled opts out of special stylesheet handling
      notes:
      - props changes after first render are ignored; may remain in DOM after unmount; itemProp links are
        not hoisted; blocking=render discouraged
    - id: dom-meta
      name: <meta>
      summary: Rendered from any component but placed in head (unless itemProp is set)
      lenses:
      - composability
      ref: /reference/react-dom/components/meta
      signature: <meta name | httpEquiv | charset | itemProp content>
      notes:
      - exactly one of name
      - httpEquiv
      - charset or itemProp
    - id: dom-title
      name: <title>
      summary: Rendered from any component but placed in head; text only, render a single one at a time
      lenses:
      - ux-a11y
      ref: /reference/react-dom/components/title
      signature: <title>text</title>
      notes:
      - inside svg or with itemProp it is not hoisted; several titles all land in head with undefined browser
        behaviour
    - id: dom-script
      name: <script>
      summary: Inline or external script; src plus async is hoisted to head and deduplicated by src
      lenses:
      - perf
      - security
      ref: /reference/react-dom/components/script
      signature: <script src async | children>
      options:
      - name: src
        type: string
        default: null
        desc: external script URL; with async=true React dedupes by src
      - name: nonce
        type: string
        default: null
        desc: CSP nonce
      - name: integrity
        type: string
        default: null
        desc: subresource integrity hash
      - name: onLoad
        type: function
        default: null
        desc: with onError disables special handling
      notes:
      - prop changes after first render are ignored; defer is incompatible with streaming SSR so use async
    - id: dom-style
      name: <style>
      summary: With href and precedence the style is hoisted, deduplicated by href and suspends until loaded
      lenses:
      - perf
      - composability
      ref: /reference/react-dom/components/style
      signature: <style href precedence>css</style>
      options:
      - name: precedence
        type: string
        default: null
        desc: ranks the style in head; required for hoisting
      - name: href
        type: string
        default: null
        desc: dedupe key
      - name: nonce
        type: string
        default: null
        desc: CSP nonce
      notes:
      - with precedence extra props beyond href and precedence are dropped; may stay in the DOM after unmount
    - id: render-to-pipeable-stream
      name: renderToPipeableStream
      summary: Node.js streaming SSR with Suspense; pipe in onShellReady to stream or onAllReady for crawlers
        and static output
      lenses:
      - perf
      - reliability
      ref: /reference/react-dom/server/renderToPipeableStream
      import: react-dom/server
      signature: renderToPipeableStream(reactNode, options?)
      options:
      - name: bootstrapScripts
        type: string[]
        default: null
        desc: script URLs emitted to call hydrateRoot
      - name: bootstrapModules
        type: string[]
        default: null
        desc: like bootstrapScripts as type=module
      - name: bootstrapScriptContent
        type: string
        default: null
        desc: inline bootstrap script
      - name: nonce
        type: string
        default: null
        desc: CSP script-src nonce
      - name: identifierPrefix
        type: string
        default: null
        desc: must equal the hydrateRoot prefix
      - name: formState
        type: ReactFormState
        default: null
        desc: form state from a Server Function submission
      - name: onShellReady
        type: () => void
        default: null
        desc: shell rendered; set status and call pipe to start streaming
      - name: onShellError
        type: (error) => void
        default: null
        desc: shell failed before any bytes; output a fallback shell
      - name: onAllReady
        type: () => void
        default: null
        desc: all content rendered; use for crawlers and static generation
      - name: onError
        type: (error) => void
        default: console.error
        desc: every server error; override to log crash reports
      - name: onHeaders
        type: ({ Link }) => void
        default: null
        desc: resource-hint Link header; capped by maxHeadersLength (default 2000)
      - name: onBrowserBailout
        type: (error, errorInfo) => void
        default: null
        desc: called when browser() leaves a Suspense fallback for the client
      - name: progressiveChunkSize
        type: number
        default: null
        desc: bytes per chunk
      returns: '{ pipe(writable), abort() }'
      notes:
      - reactNode should render the whole document including html; Node only
      - Web Streams runtimes use renderToReadableStream
    - id: render-to-readable-stream
      name: renderToReadableStream
      summary: Web Streams streaming SSR (edge, Deno, Bun); promise rejects if the shell fails, stream.allReady
        waits for all content
      lenses:
      - perf
      - reliability
      ref: /reference/react-dom/server/renderToReadableStream
      import: react-dom/server
      signature: renderToReadableStream(reactNode, options?)
      options:
      - name: signal
        type: AbortSignal
        default: null
        desc: abort server rendering and finish on the client
      - name: bootstrapScripts
        type: string[]
        default: null
        desc: script URLs emitted to call hydrateRoot
      - name: onError
        type: (error) => void
        default: console.error
        desc: every server error; use for crash reports
      - name: onHeaders
        type: '(headers: Headers) => void'
        default: null
        desc: resource-hint Link headers
      - name: nonce
        type: string
        default: null
        desc: CSP script-src nonce
      - name: identifierPrefix
        type: string
        default: null
        desc: must equal the hydrateRoot prefix
      returns: Promise of a ReadableStream with an allReady promise; rejects if the shell fails to render
      notes:
      - await stream.allReady before responding to crawlers or for static generation
    - id: render-to-string
      name: renderToString
      summary: Legacy synchronous HTML string render; no streaming or data waiting and only fallback Suspense
        support
      lenses:
      - reliability
      ref: /reference/react-dom/server/renderToString
      import: react-dom/server
      signature: renderToString(reactNode, options?)
      options:
      - name: identifierPrefix
        type: string
        default: null
        desc: useId prefix; must equal hydrateRoot prefix
      returns: HTML string
      notes:
      - a suspended component immediately yields its fallback; discouraged in client code (render into a DOM
        node instead); prefer streaming APIs
    - id: render-to-static-markup
      name: renderToStaticMarkup
      summary: Non-interactive HTML string for emails or static pages; output cannot be hydrated
      lenses:
      - reliability
      ref: /reference/react-dom/server/renderToStaticMarkup
      import: react-dom/server
      signature: renderToStaticMarkup(reactNode, options?)
      options:
      - name: identifierPrefix
        type: string
        default: null
        desc: useId prefix
      returns: HTML string
      notes:
      - limited Suspense support with immediate fallbacks
    - id: server-resume
      name: resume
      summary: Web Streams resume of a partially prerendered tree from the postponed state returned by prerender
      lenses:
      - perf
      ref: /reference/react-dom/server/resume
      import: react-dom/server
      signature: resume(reactNode, postponedState, options?)
      params:
      - name: reactNode
        type: ReactNode
        default: null
        desc: same node passed to prerender
      - name: postponedState
        type: object
        default: null
        desc: opaque postponed object from a prerender API, loaded from storage
      - name: options
        type: '{ signal?, onError?, nonce?, ... }'
        default: null
        desc: streaming options
      returns: Promise of a ReadableStream with allReady; rejects on shell error
      notes:
      - re-renders from the root until it hits a component that was not fully prerendered
    - id: resume-to-pipeable-stream
      name: resumeToPipeableStream
      summary: Node.js variant of resume for partial prerendering, with pipe and abort
      lenses:
      - perf
      ref: /reference/react-dom/server/resumeToPipeableStream
      import: react-dom/server
      signature: resumeToPipeableStream(reactNode, postponedState, options?)
      options:
      - name: onShellReady
        type: () => void
        default: null
        desc: call pipe here to stream
      - name: onShellError
        type: (error) => void
        default: null
        desc: shell failed; no bytes emitted
      - name: onAllReady
        type: () => void
        default: null
        desc: all content done
      - name: onError
        type: (error) => void
        default: console.error
        desc: server errors
      returns: '{ pipe(writable), abort() }'
    - id: static-prerender
      name: prerender
      summary: Web Streams static HTML generation that waits for all data; returns prelude plus postponed
        state for partial prerendering
      lenses:
      - perf
      ref: /reference/react-dom/static/prerender
      import: react-dom/static
      signature: prerender(reactNode, options?)
      options:
      - name: signal
        type: AbortSignal
        default: null
        desc: abort prerendering; remainder is continued via resume or resumeAndPrerender
      - name: onError
        type: (error) => void
        default: console.error
        desc: server errors
      returns: 'Promise of { prelude: ReadableStream, postponed: object | null }; postponed is null when prelude
        holds all content'
      notes:
      - unlike renderToString it waits for all data; for SSG
    - id: static-prerender-node
      name: prerenderToNodeStream
      summary: Node.js static HTML generation returning a Node stream prelude and postponed state
      lenses:
      - perf
      ref: /reference/react-dom/static/prerenderToNodeStream
      import: react-dom/static
      signature: prerenderToNodeStream(reactNode, options?)
      options:
      - name: signal
        type: AbortSignal
        default: null
        desc: abort prerendering; continue with resumeToPipeableStream
      - name: onError
        type: (error) => void
        default: console.error
        desc: server errors
      returns: 'Promise of { prelude: Node stream, postponed: object | null }'
    - id: static-resume-and-prerender
      name: resumeAndPrerender
      summary: Continue a prerendered tree to static HTML (Web Streams); can be aborted and resumed again
      lenses:
      - perf
      ref: /reference/react-dom/static/resumeAndPrerender
      import: react-dom/static
      signature: resumeAndPrerender(reactNode, postponedState, options?)
      options:
      - name: signal
        type: AbortSignal
        default: null
        desc: abort; continue with resume or another resumeAndPrerender
      - name: onError
        type: (error) => void
        default: console.error
        desc: server errors
      returns: 'Promise of { prelude: ReadableStream, postponed: object | null }'
    - id: static-resume-and-prerender-node
      name: resumeAndPrerenderToNodeStream
      summary: Continue a prerendered tree to static HTML with Node streams
      lenses:
      - perf
      ref: /reference/react-dom/static/resumeAndPrerenderToNodeStream
      import: react-dom/static
      signature: resumeAndPrerenderToNodeStream(reactNode, postponedState, options?)
      options:
      - name: signal
        type: AbortSignal
        default: null
        desc: abort; continue with resume or another resumeAndPrerenderToNodeStream
      - name: onError
        type: (error) => void
        default: console.error
        desc: server errors
      returns: 'Promise of { prelude, postponed: object | null }'
  - id: api-compiler
    title: React Compiler reference
    level: advanced
    requires: [react-compiler-guide]
    ref: /reference/react-compiler/configuration
    entries:
    - id: compiler-config
      name: Compiler options
      summary: Options passed to babel-plugin-react-compiler (or Next `reactCompiler`) controlling which
        code is compiled and how errors surface
      lenses: [perf, reliability]
      signature: '{ compilationMode, target, panicThreshold, logger, gating }'
      ref: /reference/react-compiler/configuration
      options:
      - {name: compilationMode, type: '''infer'' | ''syntax'' | ''annotation'' | ''all''', default: '''infer''',
        desc: infer = components/hooks that use JSX/hooks plus "use memo"; annotation = only "use memo"
          functions}
      - {name: target, type: '''17'' | ''18'' | ''19''', default: '''19''', desc: React version of the
          output; 17/18 need react-compiler-runtime}
      - {name: panicThreshold, type: '''none'' | ''critical_errors'' | ''all_errors''', default: '''none''',
        desc: none skips uncompilable components instead of failing the build (recommended)}
      - {name: logger, type: '{ logEvent(filename, event) }', default: 'null', desc: receives CompileSuccess
          / CompileError etc. events for coverage analysis}
      - {name: gating, type: '{ source, importSpecifierName }', default: 'null', desc: runtime feature
          flag choosing compiled vs original code for A/B or gradual rollout}
    - id: compiler-directives
      name: Directives
      summary: 'Function- or module-level string directives: `"use memo"` forces compilation, `"use no
        memo"` opts out (debugging, incompatible code)'
      lenses: [perf, reliability]
      signature: '"use memo" | "use no memo"'
      ref: /reference/react-compiler/directives
    - id: compiling-libraries
      name: Compiling libraries
      summary: publish pre-compiled output with a `target`
      lenses: [composability]
      ref: /reference/react-compiler/compiling-libraries
    - id: compilation-mode
      name: compilationMode
      summary: Strategy selecting which functions the compiler optimizes; annotation mode suits incremental
        adoption
      lenses:
      - perf
      - reliability
      ref: /reference/react-compiler/compilationMode
      signature: 'compilationMode: ''infer'' | ''syntax'' | ''annotation'' | ''all'''
      options:
      - name: infer
        type: mode
        default: default
        desc: PascalCase components and use-prefixed hooks that create JSX or call hooks, plus use memo functions
      - name: annotation
        type: mode
        default: null
        desc: only functions marked with use memo
      - name: syntax
        type: mode
        default: null
        desc: only Flow component and hook syntax; unusable with TypeScript
      - name: all
        type: mode
        default: null
        desc: all top-level functions; not recommended, may compile non-React code
      notes:
      - use no memo wins over every mode; infer needs React naming conventions
    - id: compiler-target
      name: target
      summary: React version of the compiled output; 17 and 18 need react-compiler-runtime
      lenses:
      - composability
      - reliability
      ref: /reference/react-compiler/target
      signature: 'target: ''17'' | ''18'' | ''19'''
      options:
      - name: target
        type: '''17'' | ''18'' | ''19'''
        default: '''19'''
        desc: string, no patch version; 19 uses the built-in react/compiler-runtime
      notes:
      - for 17 and 18 install react-compiler-runtime@latest
    - id: panic-threshold
      name: panicThreshold
      summary: Whether compile errors fail the build; keep none in production so uncompilable components are
        skipped
      lenses:
      - reliability
      ref: /reference/react-compiler/panicThreshold
      signature: 'panicThreshold: ''none'' | ''critical_errors'' | ''all_errors'''
      options:
      - name: none
        type: level
        default: default
        desc: skip components that cannot be compiled and keep building
      - name: critical_errors
        type: level
        default: null
        desc: fail only on critical errors, for development debugging
      - name: all_errors
        type: level
        default: null
        desc: fail on any compiler diagnostic
    - id: compiler-logger
      name: logger
      summary: Hook receiving compiler events per file for coverage and failure analysis
      lenses:
      - observability
      ref: /reference/react-compiler/logger
      signature: 'logger: { logEvent(filename: string | null, event: LoggerEvent): void } | null'
      notes:
      - event kinds CompileSuccess
      - CompileError
      - CompileDiagnostic
      - CompileSkip
      - PipelineError
      - Timing; event shape may change between versions
    - id: compiler-gating
      name: gating
      summary: Runtime feature flag choosing compiled versus original code, for A/B tests or gradual rollout
      lenses:
      - reliability
      - perf
      ref: /reference/react-compiler/gating
      signature: 'gating: { source: string, importSpecifierName: string } | null'
      options:
      - name: source
        type: string
        default: null
        desc: module path exporting the flag function
      - name: importSpecifierName
        type: string
        default: null
        desc: exported function name; must return a boolean
      notes:
      - both versions ship
      - increasing bundle size; the import is added to every file with compiled functions
    - id: directive-use-memo
      name: '"use memo"'
      summary: Force-compile a function; required in annotation mode, redundant in all mode
      lenses:
      - perf
      ref: /reference/react-compiler/directives/use-memo
      signature: '"use memo"'
      notes:
      - must be first in the function body (comments allowed); plain quotes only
      - not backticks; exact text; only the first directive is processed
    - id: directive-use-no-memo
      name: '"use no memo"'
      summary: Temporary escape hatch excluding a function from compilation; overrides every mode and directive
      lenses:
      - reliability
      ref: /reference/react-compiler/directives/use-no-memo
      signature: '"use no memo"'
      notes:
      - alias "use no forget"; same placement rules as use memo; for debugging or incompatible libraries,
        not a permanent fix
  - id: api-hooks-lint
    title: eslint-plugin-react-hooks lints
    level: intermediate
    requires:
    - api-rules
    ref: /reference/eslint-plugin-react-hooks
    entries:
    - id: lint-rules-of-hooks
      name: react-hooks/rules-of-hooks
      summary: Hooks only at the top level of components or hooks, in the same order every render
      lenses:
      - reliability
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/rules-of-hooks
      signature: react-hooks/rules-of-hooks
      notes:
      - 'violations: hooks in conditions, loops, after early returns, in callbacks, async functions, class
        methods or at module level; `use` is exempt'
      options:
      - name: additionalEffectHooks
        type: string (regex)
        default: null
        desc: additionalEffectHooks (settings.react-hooks, regex, plugin 6.1.1+) treats custom hooks as
          effects so useEffectEvent may be called from them
    - id: lint-exhaustive-deps
      name: react-hooks/exhaustive-deps
      summary: Dependency arrays of useEffect, useMemo and useCallback must list every reactive value read
        inside
      lenses:
      - reliability
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/exhaustive-deps
      signature: react-hooks/exhaustive-deps
      notes:
      - fix by restructuring (see Removing Effect Dependencies), not by silencing the rule
      options:
      - name: additionalEffectHooks
        type: string (regex)
        default: null
        desc: additionalEffectHooks (settings.react-hooks, regex) or rule option additionalHooks (regex,
          takes precedence) add custom hooks to the check
    - id: lint-component-hook-factories
      name: react-hooks/component-hook-factories
      summary: Components and hooks must be defined at module level, not created inside higher-order functions
      lenses:
      - reliability
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/component-hook-factories
      signature: react-hooks/component-hook-factories
      notes:
      - nested definitions create a new component type per call, destroying state
    - id: lint-config
      name: react-hooks/config
      summary: Validates React Compiler configuration option names and value types to prevent silent typos
      lenses:
      - reliability
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/config
      signature: react-hooks/config
      notes:
      - runs in the recommended preset
    - id: lint-error-boundaries
      name: react-hooks/error-boundaries
      summary: Use Error Boundaries, not try/catch, for errors thrown while rendering child components
      lenses:
      - reliability
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/error-boundaries
      signature: react-hooks/error-boundaries
      notes:
      - try/catch cannot catch render-time errors in children
    - id: lint-gating
      name: react-hooks/gating
      summary: Validates the compiler gating configuration
      lenses:
      - reliability
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/gating
      signature: react-hooks/gating
      notes:
      - runs in the recommended preset
    - id: lint-globals
      name: react-hooks/globals
      summary: No assignment or mutation of globals during render; side effects belong outside render
      lenses:
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/globals
      signature: react-hooks/globals
      notes:
      - global mutation breaks purity, Fast Refresh and dev versus prod parity
    - id: lint-immutability
      name: react-hooks/immutability
      summary: Never mutate props, state or other immutable values; use the state setter
      lenses:
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/immutability
      signature: react-hooks/immutability
      notes:
      - props and state are immutable snapshots
    - id: lint-incompatible-library
      name: react-hooks/incompatible-library
      summary: Flags libraries using patterns (e.g. interior mutability) that break under manual or automatic
        memoization
      lenses:
      - reliability
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/incompatible-library
      signature: react-hooks/incompatible-library
      notes:
      - detection uses a known-library list; if manual useMemo breaks, so would the compiler
    - id: lint-preserve-manual-memoization
      name: react-hooks/preserve-manual-memoization
      summary: Existing useMemo, useCallback and memo must be preserved by the compiler; incomplete dependencies
        block compilation of that function
      lenses:
      - perf
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/preserve-manual-memoization
      signature: react-hooks/preserve-manual-memoization
      notes:
      - compiler only compiles when its inference matches or exceeds the manual memoization
    - id: lint-purity
      name: react-hooks/purity
      summary: Components and hooks must not call known-impure functions during render
      lenses:
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/purity
      signature: react-hooks/purity
      notes:
      - 'violations: Math.random(), Date.now(), new Date(), crypto.randomUUID(), performance.now()'
    - id: lint-refs
      name: react-hooks/refs
      summary: No reading or writing ref.current during render
      lenses:
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/refs
      signature: react-hooks/refs
      notes:
      - 'applies to values inferred as refs: useRef or createRef results, identifiers named ref or ending
        in Ref that touch .current, JSX ref props'
    - id: lint-set-state-in-effect
      name: react-hooks/set-state-in-effect
      summary: No synchronous setState directly in an effect body; it forces an extra render pass
      lenses:
      - perf
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/set-state-in-effect
      signature: react-hooks/set-state-in-effect
      notes:
      - 'typical causes: deriving state from props, setting loading flags synchronously, transforming data
        in effects; see You Might Not Need an Effect'
    - id: lint-set-state-in-render
      name: react-hooks/set-state-in-render
      summary: No unconditional setState during render (infinite render loop)
      lenses:
      - reliability
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/set-state-in-render
      signature: react-hooks/set-state-in-render
      notes:
      - runs in the recommended preset
    - id: lint-static-components
      name: react-hooks/static-components
      summary: Components must not be defined inside other components; they are recreated each render and
        lose state
      lenses:
      - reliability
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/static-components
      signature: react-hooks/static-components
      notes:
      - each render makes a new component type, unmounting the old one
    - id: lint-unsupported-syntax
      name: react-hooks/unsupported-syntax
      summary: Flags syntax the compiler cannot analyze (eval, with); keep it out of components
      lenses:
      - reliability
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/unsupported-syntax
      signature: react-hooks/unsupported-syntax
      notes:
      - may still be used in standalone utilities outside React
    - id: lint-use-memo
      name: react-hooks/use-memo
      summary: useMemo must return a value; side effects belong in effects or handlers
      lenses:
      - best-practice
      ref: /reference/eslint-plugin-react-hooks/lints/use-memo
      signature: react-hooks/use-memo
      notes:
      - a useMemo without a return value yields undefined
  - id: api-rules
    title: Rules of React and Server Components
    level: intermediate
    requires: [describing-ui]
    ref: /reference/rules
    entries:
    - id: rules-of-react
      name: Rules of React
      summary: components and hooks must be pure, React calls them, Rules of Hooks
      lenses: [best-practice, reliability]
      notes: [lint-enforced via eslint-plugin-react-hooks]
      ref: /reference/rules
    - id: rsc-server-components
      name: Server Components
      summary: async components, server-only module graph, props must serialize
      lenses: [perf, security]
      notes: [19.3 lets `<Context>` render directly in Server Components]
      ref: /reference/rsc/server-components
    - id: rsc-server-functions
      name: Server Functions and directives
      summary: '`"use server"` marks async functions callable from the client; `"use client"` marks the
        Server/Client module boundary'
      lenses: [security, best-practice]
      signature: '"use server" / "use client"'
      ref: /reference/rsc/server-functions
    - id: rule-pure
      name: Components and Hooks must be pure
      summary: Idempotent render, side effects outside render, props, state and hook values immutable, values
        frozen once passed to JSX
      lenses:
      - best-practice
      - reliability
      ref: /reference/rules/components-and-hooks-must-be-pure
      notes:
      - local mutation of values created during the same render is allowed; enforced by the purity
      - immutability and globals lints
    - id: rule-react-calls
      name: React calls Components and Hooks
      summary: Never call component functions directly or pass Hooks around as values; React orchestrates
        rendering
      lenses:
      - best-practice
      - reliability
      ref: /reference/rules/react-calls-components-and-hooks
      notes:
      - do not dynamically mutate a Hook or dynamically choose which Hook to call; render components as JSX
    - id: rule-hooks
      name: Rules of Hooks
      summary: Call Hooks only at the top level and only from components or custom Hooks
      lenses:
      - best-practice
      - reliability
      ref: /reference/rules/rules-of-hooks
      notes:
      - no Hooks in conditions
      - loops
      - after early returns
      - event handlers
      - try/catch/finally or class components; enforced by react-hooks/rules-of-hooks
    - id: rsc-directives
      name: RSC directives overview
      summary: Source-code directives for RSC-compatible bundlers
      lenses:
      - reuse
      ref: /reference/rsc/directives
      notes:
      - use client marks client code and use server marks server functions callable from the client
    - id: rsc-use-client
      name: '''use client'''
      summary: File-level directive marking a module and its transitive imports as client code, the server/client
        module boundary
      lenses:
      - best-practice
      - perf
      ref: /reference/rsc/use-client
      signature: '''use client'''
      notes:
      - must precede all imports (comments ok) with single or double quotes; no effect inside an already client
        module; server code importing from a client module may only pass components or serializable props;
        the whole client subtree ships to the browser
    - id: rsc-use-server
      name: '''use server'''
      summary: Marks async functions (or all exports of a module) as Server Functions callable from the client
        over the network
      lenses:
      - security
      - best-practice
      ref: /reference/rsc/use-server
      signature: '''use server'''
      notes:
      - only async functions; module-level directive needed to import from client code; arguments are untrusted
        client input so validate and authorize every mutation; call in a Transition (form action does so automatically);
        meant for mutations
      - not data fetching; arguments and return values must be serializable
  - id: api-legacy
    title: Legacy APIs
    level: basic
    requires: []
    ref: /reference/react/legacy
    entries:
    - id: forwardref-legacy
      name: forwardRef
      summary: unnecessary in React 19 (`ref` is a prop); will be deprecated
      lenses: [best-practice]
      deprecated: 'React 19: pass ref as a prop'
      ref: /reference/react/forwardRef
      signature: forwardRef(render)
    - id: class-component
      name: Component
      summary: Class components remain the only way to write an Error Boundary (getDerivedStateFromError
        + componentDidCatch)
      lenses: [reliability]
      signature: class X extends Component { static getDerivedStateFromError(error); componentDidCatch(error,
        info) }
      notes: [only render-error boundary option (WebGL guard)]
      ref: /reference/react/Component
      import: react
      params:
      - {name: getDerivedStateFromError(error), type: static (error) => state, default: null, desc: 'render-phase:
          return state to show the fallback UI'}
      - {name: 'componentDidCatch(error, info)', type: '(error, { componentStack }) => void', default: null,
        desc: 'commit-phase: log to an error reporting service; do not setState here (deprecated)'}
    - id: pure-component
      name: PureComponent
      summary: Class base skipping re-renders for shallow-equal props and state; discouraged in new code
      lenses:
      - perf
      ref: /reference/react/PureComponent
      import: react
      notes:
      - equivalent to a custom shouldComponentUpdate with shallow comparison; prefer function components with
        memo
    - id: children-api
      name: Children
      summary: Count, map, iterate, validate and flatten the children prop; uncommon and fragile
      lenses:
      - composability
      ref: /reference/react/Children
      import: react
      signature: Children.count / forEach / map / only / toArray (children, fn?, thisArg?)
      returns: 'count: number; map: flat array minus null/undefined; only: the single element or throws; toArray:
        flat keyed array; forEach: undefined'
      notes:
      - traversal does not go deeper than elements; arrays count through their items; keys are combined with
        the original child key; prefer render props or explicit props
    - id: clone-element
      name: cloneElement
      summary: Copy an element with overridden props and children; makes data flow hard to trace so prefer
        alternatives
      lenses:
      - composability
      ref: /reference/react/cloneElement
      import: react
      signature: cloneElement(element, props, ...children)
      params:
      - name: element
        type: ReactElement
        default: null
        desc: element to clone
      - name: props
        type: object | null
        default: null
        desc: shallow-merged over element.props; null keeps all
      returns: new element; the original is unmodified
    - id: create-ref
      name: createRef
      summary: 'Create a { current: null } ref object, mostly for class components; function components use
        useRef'
      lenses:
      - composability
      ref: /reference/react/createRef
      import: react
      signature: createRef()
      returns: new object with a current property, initially null, on every call
